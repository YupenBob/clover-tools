<main class="page-body">

    </div>

        <button class="btn btn-primary" id="toSimplified">← 转简体</button>

        <button class="btn btn-secondary" id="clearBtn">清空</button>

<div id="toast"></div>

<script>
// Simplified → Traditional mapping (key = simplified, value = traditional)
var JIAN = {
"与":"與","为":"為","无":"無","来":"來","用":"用","因":"因","此":"此","当":"當","你":"你","我":"我","他":"他","她":"她","们":"們","把":"把","被":"被","对":"對","给":"給","从":"從","国":"國","时":"時","会":"會","说":"說","于":"於","开":"開","关":"關","头":"頭","东":"東","西":"西","南":"南","北":"北","发":"發","里":"裡","气":"氣","电":"電","车":"車","见":"見","进":"進","远":"遠","还":"還","长":"長","点":"點","变":"變","别":"別","最":"最","机":"機","许":"許","区":"區","实":"實","学":"學","没":"沒","总":"總","动":"動","运":"運","现":"現","资料":"資料","经常":"經常","其实":"其實","时间":"時間","应该":"應該","因为":"因為","通过":"通過","这样":"這樣","问题":"問題","这个":"這個","什么":"什麼","怎么":"怎麼","为什么":"為什麼","运动":"運動","已经":"已經","总共":"總共","产":"產","织":"織","参":"參","结":"結","层":"層","业":"業","号":"號","网":"網","员":"員","钟":"鐘","铁":"鐵","链":"鏈","锁":"鎖","错":"錯","键":"鍵","场":"場","坏":"壞","复":"復","够":"夠","奖":"獎","好":"好","妈":"媽","姐":"姐","妹":"妹","孙":"孫","宁":"寧","它":"它","完":"完","客":"家","家":"家","将":"將","小":"小","少":"少","尔":"爾","尘":"塵","儿":"兒","先":"先","光":"光","克":"克","免":"免","党":"黨","兵":"兵","册":"冊","冬":"冬","冰":"冰","冲":"沖","减":"減","几":"幾","出":"出","击":"擊","刀":"刀","切":"切","到":"到","制":"製","刷":"刷","刺":"劍","刻":"刻","剂":"劑","剑":"劍","力":"力","办":"辦","助":"助","努":"努","劫":"劫","劳":"勞","势":"勢","勤":"勤","汇":"匯","晕":"暈","尽":"盡","历":"歷","县":"縣","叉":"叉","及":"及","友":"友","反":"反","取":"取","受":"受","叙":"敘","叠":"疊","弯":"彎","弹":"彈","强":"強","录":"錄","形":"形","彩":"彩","影":"影","彻":"徹","径":"徑","御":"禦","后":"後","行":"行","卫":"衛","凉":"涼","准":"準","凡":"凡","凭":"憑","断":"斷","新":"新","方":"方","施":"施","旋":"旋","旗":"旗","旨":"旨","早":"早","旺":"旺","明":"明","星":"星","昨":"昨","春":"春","是":"是","显":"顯","普":"普","曾":"曾","替":"替","月":"月","有":"有","朋":"朋","服":"服務","望":"望","朝":"朝","期":"期","木":"木","朴":"樸","权":"權","杨":"楊","松":"松","板":"板","极":"極","构":"構","样":"樣","树":"樹","桥":"橋","检":"檢","条":"條","杯":"杯","柜":"櫃","果":"果","架":"架","枪":"槍","案":"案","档":"檔","棉":"棉","棕":"棕","九":"九","也":"也","习":"習","书":"書","买":"買","乡":"鄉","乱":"亂","乳":"乳","了":"了","争":"爭","事":"事","云":"雲","互":"互","五":"五","亚":"亞","些":"些","亡":"亡","交":"交","仆":"僕","仇":"仇","仿":"仿","企":"企","伊":"伊","众":"眾","优":"優","传":"傳","伤":"傷","价":"價","伦":"倫","伯":"伯","估":"估","伴":"伴","伸":"伸","似":"似","但":"但","位":"位","低":"低","住":"住","佐":"佐","佑":"佑","体":"體","何":"何","余":"餘","佛":"佛","作":"作","佳":"佳","侦":"偵","侧":"側","侨":"僑","供":"供","依":"依","侠":"俠","侍":"侍","使":"使","佩":"佩","你":"你","位":"位","低":"低","住":"住","佐":"佐","佑":"佑","体":"體","何":"何","余":"餘","佛":"佛","作":"作","佳":"佳","侦":"偵","侧":"側","侨":"僑","供":"供","依":"依","侠":"俠","侍":"侍","使":"使","佩":"佩","价":"價","伦":"倫","伯":"伯","估":"估","伴":"伴","伸":"伸","似":"似","但":"但"
};

// Reverse mapping (traditional → simplified)
var FAN = {};
Object.keys(JIAN).forEach(function(k) { FAN[JIAN[k]] = k; });

function toTraditional(text) {
  return text.replace(/[^\u4e00-\u9fa5]/g, function(c) {
    return JIAN[c] || c;
  }).replace(/台湾|香港|中国|电脑|网络|软件|硬件|系统|程序|数据|信息|服务|网络|电子|数码|科技|科学|技术|工程|管理|经营|营销|广告|宣传|媒体|新闻|记者|编辑|出版|发行|销售|购买|购买|租赁|投资|理财|金融|银行|货币|股票|债券|基金|保险|贸易|商业|企业|公司|工厂|生产|制造|加工|包装|运输|物流|仓储|库存|原料|材料|能源|资源|农业|林业|渔业|畜牧|兽医/g, function(w) {
    return JIAN[w] || w;
  });
}

function toSimplified(text) {
  return text.replace(/[^\u4e00-\u9fa5]/g, function(c) {
    return FAN[c] || c;
  });
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

var inputText = document.getElementById('inputText');
var outputText = document.getElementById('outputText');
var charCount = document.getElementById('charCount');
var outCharCount = document.getElementById('outCharCount');

inputText.addEventListener('input', function() {
  charCount.textContent = inputText.value.length;
});

document.getElementById('toTraditional').onclick = function() {
  if (!inputText.value.trim()) return;
  outputText.value = toTraditional(inputText.value);
  outCharCount.textContent = outputText.value.length;
};

document.getElementById('toSimplified').onclick = function() {
  if (!inputText.value.trim()) return;
  outputText.value = toSimplified(inputText.value);
  outCharCount.textContent = outputText.value.length;
};

document.getElementById('swapBtn').onclick = function() {
  var t = inputText.value;
  inputText.value = outputText.value;
  outputText.value = t;
  charCount.textContent = inputText.value.length;
  outCharCount.textContent = outputText.value.length;
};

document.getElementById('clearBtn').onclick = function() {
  inputText.value = '';
  outputText.value = '';
  charCount.textContent = '0';
  outCharCount.textContent = '0';
};

document.getElementById('copyBtn').onclick = function() {
  if (!outputText.value) return;
  navigator.clipboard.writeText(outputText.value).then(function() {
    CT.showToast('已复制！');
  }).catch(function() {
    CT.showToast('复制失败');
  });
};

CT.initTheme();
</script>
</body>
</html>
