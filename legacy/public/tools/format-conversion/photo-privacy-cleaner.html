<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片隐私信息去除 - CloverTools</title>
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #e0e0e0;
            --muted: #8b949e;
            --accent: #c9a96e;
            --accent-hover: #e0c88a;
            --border: #30363d;
            --danger: #f85149;
            --success: #3fb950;
            --warning: #d29922;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 720px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 { font-size: 26px; color: var(--accent); margin-bottom: 8px; }
        .header p { color: var(--muted); font-size: 14px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 20px;
        }
        .upload-zone {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 48px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background: rgba(201,169,110,0.05);
        }
        .upload-zone .icon { font-size: 48px; margin-bottom: 12px; }
        .upload-zone p { color: var(--muted); font-size: 14px; }
        .upload-zone .formats { font-size: 12px; color: var(--muted); margin-top: 8px; }
        #fileInput { display: none; }
        .preview-section { display: none; margin-top: 24px; }
        .preview-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .preview-box { flex: 1; }
        .preview-box h3 { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
        .preview-image {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .exif-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .exif-table th, .exif-table td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--border); }
        .exif-table th { color: var(--muted); font-weight: 500; width: 40%; }
        .exif-table td { color: var(--text); }
        .exif-table .sensitive { color: var(--danger); }
        .exif-table .safe { color: var(--success); }
        .btn-group { display: flex; gap: 12px; margin-top: 20px; }
        .btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--accent); color: #0d1117; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .status { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 14px; display: none; }
        .status.info { background: rgba(63,185,80,0.1); color: var(--success); border: 1px solid rgba(63,185,80,0.3); }
        .status.error { background: rgba(248,81,73,0.1); color: var(--danger); border: 1px solid rgba(248,81,73,0.3); }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
        .info-item {
            background: var(--bg);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .info-item .icon { font-size: 20px; }
        .info-item .label { font-size: 12px; color: var(--muted); }
        .info-item .value { font-size: 16px; font-weight: 600; }
        .tips { background: rgba(201,169,110,0.08); border: 1px solid rgba(201,169,110,0.2); border-radius: 8px; padding: 16px; margin-top: 16px; }
        .tips h4 { color: var(--accent); font-size: 13px; margin-bottom: 8px; }
        .tips ul { list-style: none; font-size: 12px; color: var(--muted); }
        .tips li { padding: 3px 0; padding-left: 14px; position: relative; }
        .tips li::before { content: '•'; position: absolute; left: 0; color: var(--accent); }
        @media (max-width: 600px) {
            .preview-row { flex-direction: column; }
            .info-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔒 照片隐私信息去除</h1>
            <p>上传照片，自动检测并去除所有EXIF隐私信息，防止位置、设备信息泄露</p>
        </div>
        <div class="card">
            <div class="upload-zone" id="uploadZone">
                <div class="icon">🖼️</div>
                <p>点击或拖拽上传照片</p>
                <div class="formats">支持 JPG、JPEG、PNG 格式</div>
                <input type="file" id="fileInput" accept="image/jpeg,image/png,.jpg,.jpeg,.png">
            </div>
            <div id="status" class="status"></div>
        </div>

        <div class="card preview-section" id="previewSection">
            <div class="preview-row">
                <div class="preview-box">
                    <h3>📷 原图（含EXIF）</h3>
                    <img id="originalPreview" class="preview-image" alt="Original">
                </div>
                <div class="preview-box">
                    <h3>✅ 已去除隐私信息</h3>
                    <img id="cleanedPreview" class="preview-image" alt="Cleaned">
                </div>
            </div>
            <div id="exifTable"></div>
            <div class="info-grid">
                <div class="info-item">
                    <span class="icon">📍</span>
                    <div>
                        <div class="label">GPS位置</div>
                        <div class="value" id="gpsInfo">—</div>
                    </div>
                </div>
                <div class="info-item">
                    <span class="icon">📅</span>
                    <div>
                        <div class="label">拍摄时间</div>
                        <div class="value" id="dateInfo">—</div>
                    </div>
                </div>
                <div class="info-item">
                    <span class="icon">📱</span>
                    <div>
                        <div class="label">设备信息</div>
                        <div class="value" id="deviceInfo">—</div>
                    </div>
                </div>
                <div class="info-item">
                    <span class="icon">🔢</span>
                    <div>
                        <div class="label">剩余EXIF字段</div>
                        <div class="value" id="fieldCount">—</div>
                    </div>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="downloadBtn">💾 下载已清理图片</button>
                <button class="btn btn-secondary" id="resetBtn">🔄 重新上传</button>
            </div>
        </div>

        <div class="card tips">
            <h4>💡 关于EXIF隐私信息</h4>
            <ul>
                <li>GPS坐标：精确记录拍照地点，移除后无法追溯位置</li>
                <li>拍摄时间：暴露拍照时间，可能涉及隐私</li>
                <li>设备型号：泄露手机/相机型号信息</li>
                <li>软件信息：包含修图软件签名，影响原始性</li>
                <li>去除EXIF不影响图片正常显示和画质</li>
            </ul>
        </div>
    </div>

    <script>
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const status = document.getElementById('status');
        let currentFile = null;
        let cleanedBlob = null;

        uploadZone.addEventListener('click', () => fileInput.click());
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
        uploadZone.addEventListener('drop', (e) => { e.preventDefault(); uploadZone.classList.remove('dragover'); handleFile(e.dataTransfer.files[0]); });
        fileInput.addEventListener('change', (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); });

        document.getElementById('downloadBtn').addEventListener('click', downloadCleaned);
        document.getElementById('resetBtn').addEventListener('click', reset);

        function showStatus(msg, type) {
            status.textContent = msg;
            status.className = 'status ' + type;
            status.style.display = 'block';
        }

        function handleFile(file) {
            if (!file) return;
            if (!file.type.match(/image\/(jpeg|png)/)) {
                showStatus('请上传 JPG 或 PNG 格式的图片', 'error');
                return;
            }
            currentFile = file;
            processFile(file);
        }

        function processFile(file) {
            showStatus('正在读取图片...', 'info');

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    document.getElementById('originalPreview').src = e.target.result;
                    showExifData(file, e.target.result, img);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showExifData(file, dataUrl, img) {
            EXIF.getData(file, function() {
                const allTags = EXIF.getAllTags(this);
                const gps = getGPSInfo(allTags);
                const date = allTags.DateTime || allTags.DateTimeOriginal || '—';
                const device = [allTags.Make, allTags.Model].filter(Boolean).join(' ') || '—';
                const software = allTags.Software || '—';
                const fieldCount = Object.keys(allTags).length;

                document.getElementById('gpsInfo').textContent = gps.lat ? `${gps.lat}, ${gps.lng}` : '无';
                document.getElementById('gpsInfo').style.color = gps.lat ? 'var(--danger)' : 'var(--success)';
                document.getElementById('dateInfo').textContent = date;
                document.getElementById('deviceInfo').textContent = device !== '—' ? device : '无';
                document.getElementById('deviceInfo').style.color = device !== '—' ? 'var(--warning)' : 'var(--success)';
                document.getElementById('fieldCount').textContent = fieldCount + ' 个字段';

                let tableHtml = '<table class="exif-table"><tr><th>字段</th><th>值</th><th>敏感度</th></tr>';
                const sensitiveKeys = ['GPSLatitude', 'GPSLongitude', 'GPSAltitude', 'DateTime', 'DateTimeOriginal', 'Make', 'Model', 'Software', 'Artist', 'Copyright', 'SerialNumber', 'LensModel'];
                for (const [key, val] of Object.entries(allTags).slice(0, 20)) {
                    const isSensitive = sensitiveKeys.includes(key) || key.startsWith('GPS');
                    const displayVal = typeof val === 'object' ? JSON.stringify(val) : String(val);
                    tableHtml += `<tr><td>${key}</td><td>${displayVal.substring(0, 50)}</td><td class="${isSensitive ? 'sensitive' : 'safe'}">${isSensitive ? '⚠️ 敏感' : '✓'}</td></tr>`;
                }
                tableHtml += '</table>';
                document.getElementById('exifTable').innerHTML = tableHtml;

                showStatus(`检测到 ${fieldCount} 个EXIF字段，其中 ${Object.keys(allTags).filter(k => k.startsWith('GPS')).length} 个GPS位置字段需要去除`, 'info');

                cleanImage(img);
            });
        }

        function getGPSInfo(tags) {
            if (tags.GPSLatitude && tags.GPSLongitude) {
                const lat = convertDMSToDD(tags.GPSLatitude, tags.GPSLatitudeRef);
                const lng = convertDMSToDD(tags.GPSLongitude, tags.GPSLongitudeRef);
                return { lat, lng };
            }
            return {};
        }

        function convertDMSToDD(dms, ref) {
            if (!dms || !Array.isArray(dms) || dms.length < 3) return null;
            let dd = dms[0] + dms[1] / 60 + dms[2] / 3600;
            if (ref === 'S' || ref === 'W') dd = -dd;
            return dd.toFixed(6);
        }

        function cleanImage(img) {
            showStatus('正在去除EXIF隐私信息...', 'info');

            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            canvas.toBlob(function(blob) {
                cleanedBlob = blob;
                const cleanedUrl = URL.createObjectURL(blob);
                document.getElementById('cleanedPreview').src = cleanedUrl;
                document.getElementById('cleanedPreview').style.display = 'block';
                previewSection.style.display = 'block';

                // Verify cleaned image has no EXIF
                EXIF.getData(blob, function() {
                    const tags = EXIF.getAllTags(this);
                    const remainingFields = Object.keys(tags).filter(k => !['imageWidth','imageHeight','imageSize'].includes(k));
                    if (remainingFields.length === 0) {
                        showStatus('✅ EXIF已全部清除，图片安全', 'info');
                    } else {
                        showStatus(`⚠️ 仍有 ${remainingFields.length} 个字段（${remainingFields.slice(0,3).join(', ')}...）`, 'error');
                    }
                });
            }, 'image/jpeg', 0.95);
        }

        function downloadCleaned() {
            if (!cleanedBlob) return;
            const a = document.createElement('a');
            a.href = URL.createObjectURL(cleanedBlob);
            const originalName = currentFile.name.replace(/\.[^.]+$/, '');
            a.download = originalName + '_cleaned.jpg';
            a.click();
        }

        function reset() {
            currentFile = null;
            cleanedBlob = null;
            previewSection.style.display = 'none';
            status.style.display = 'none';
            fileInput.value = '';
        }
    </script>
</body>
</html>
