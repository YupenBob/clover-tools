<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片元信息编辑器 - CloverTools</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/piexifjs@1.0.6/piexif.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', system-ui, -apple-system, sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            background-color: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, #c9a96e, #a8894d);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; color: #0d1117; font-size: 18px;
        }
        .header-title { font-size: 18px; font-weight: 500; color: #e0e0e0; }
        .main-container { flex: 1; padding: 24px; max-width: 900px; margin: 0 auto; width: 100%; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .card-title { font-size: 16px; font-weight: 500; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; color: #c9a96e; }
        .upload-zone {
            border: 2px dashed #30363d; border-radius: 8px;
            padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease;
        }
        .upload-zone:hover, .upload-zone.dragover { border-color: #c9a96e; background-color: rgba(201,169,110,0.05); }
        .upload-zone i { font-size: 48px; color: #c9a96e; margin-bottom: 12px; }
        .upload-zone p { color: #8b949e; font-size: 14px; }
        .upload-zone .formats { color: #6e7681; font-size: 12px; margin-top: 8px; }
        #fileInput { display: none; }
        .preview-container { display: none; margin-top: 20px; }
        .preview-container.active { display: block; }
        .preview-image { max-width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid #30363d; }
        .metadata-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        .metadata-table th, .metadata-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #30363d; }
        .metadata-table th { color: #c9a96e; font-weight: 500; width: 40%; }
        .metadata-table td { color: #e0e0e0; }
        .no-exif { color: #8b949e; font-style: italic; padding: 20px; text-align: center; }
        .edit-form { display: grid; gap: 16px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; }
        .form-group label { font-size: 14px; font-weight: 500; color: #c9a96e; }
        .form-group input {
            padding: 10px 12px; background-color: #0d1117; border: 1px solid #30363d;
            border-radius: 8px; color: #e0e0e0; font-size: 14px; font-family: inherit; transition: border-color 0.3s ease;
        }
        .form-group input:focus { outline: none; border-color: #c9a96e; }
        .form-group input::placeholder { color: #6e7681; }
        .btn-container { display: flex; gap: 12px; margin-top: 8px; }
        .btn {
            padding: 12px 24px; border: none; border-radius: 8px; font-size: 14px;
            font-weight: 500; font-family: inherit; cursor: pointer; display: flex;
            align-items: center; gap: 8px; transition: all 0.3s ease;
        }
        .btn-primary { background-color: #c9a96e; color: #0d1117; }
        .btn-primary:hover { background-color: #b89a5f; }
        .btn-primary:disabled { background-color: #4a4a4a; color: #8b949e; cursor: not-allowed; }
        .btn-secondary { background-color: transparent; color: #e0e0e0; border: 1px solid #30363d; }
        .btn-secondary:hover { border-color: #c9a96e; color: #c9a96e; }
        .footer { text-align: center; padding: 20px; color: #6e7681; font-size: 12px; border-top: 1px solid #30363d; }
        .error-message { background-color: rgba(248,81,73,0.1); border: 1px solid #f85149; color: #f85149; padding: 12px 16px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
        .success-message { background-color: rgba(63,185,80,0.1); border: 1px solid #3fb950; color: #3fb950; padding: 12px 16px; border-radius: 8px; margin-top: 12px; font-size: 14px; }
        .preview-row { display: flex; gap: 20px; margin-top: 20px; }
        .preview-col { flex: 1; }
        .preview-col h4 { font-size: 13px; color: #8b949e; margin-bottom: 8px; }
        .preview-col img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
        .badge-before { background: rgba(248,81,73,0.15); color: #f85149; }
        .badge-after { background: rgba(63,185,80,0.15); color: #3fb950; }
        @media (max-width: 600px) {
            .main-container { padding: 16px; }
            .card { padding: 16px; }
            .btn-container { flex-direction: column; }
            .form-row { grid-template-columns: 1fr; }
            .preview-row { flex-direction: column; }
            .btn { justify-content: center; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">C</div>
        <h1 class="header-title">CloverTools - 照片元信息编辑器</h1>
    </header>

    <main class="main-container">
        <div class="card">
            <h2 class="card-title"><i class="bi bi-cloud-upload"></i> 上传照片</h2>
            <div class="upload-zone" id="uploadZone">
                <i class="bi bi-image"></i>
                <p>拖拽照片到这里，或点击选择文件</p>
                <p class="formats">支持 JPG 格式</p>
            </div>
            <input type="file" id="fileInput" accept="image/jpeg">
            <div class="preview-container" id="previewContainer">
                <div class="preview-row">
                    <div class="preview-col">
                        <h4><span class="badge badge-before">修改前</span></h4>
                        <img id="previewBefore" alt="修改前">
                    </div>
                    <div class="preview-col">
                        <h4><span class="badge badge-after">修改后</span></h4>
                        <img id="previewAfter" alt="修改后">
                    </div>
                </div>
            </div>
            <div id="errorContainer"></div>
        </div>

        <div class="card" id="metadataCard">
            <h2 class="card-title"><i class="bi bi-info-circle"></i> 图片元信息</h2>
            <div id="metadataContent">
                <p class="no-exif">请上传照片以查看元信息</p>
            </div>
        </div>

        <div class="card" id="editCard">
            <h2 class="card-title"><i class="bi bi-pencil"></i> 编辑元信息</h2>
            <form class="edit-form" id="editForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="gpsLatitude">GPS 纬度 (decimal，如 25.0330)</label>
                        <input type="text" id="gpsLatitude" placeholder="正值=N，负值=S，如 25.0330">
                    </div>
                    <div class="form-group">
                        <label for="gpsLongitude">GPS 经度 (decimal，如 121.5654)</label>
                        <input type="text" id="gpsLongitude" placeholder="正值=E，负值=W，如 121.5654">
                    </div>
                </div>
                <div class="form-group">
                    <label for="dateTime">拍摄时间 (EXIF格式，如 2024:01:15 10:30:00)</label>
                    <input type="text" id="dateTime" placeholder="格式: 2024:01:15 10:30:00">
                </div>
                <div class="btn-container">
                    <button type="submit" class="btn btn-primary" id="downloadBtn" disabled>
                        <i class="bi bi-download"></i> 下载编辑后的图片
                    </button>
                    <button type="button" class="btn btn-secondary" id="resetBtn">
                        <i class="bi bi-arrow-counterclockwise"></i> 重置
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2024 CloverTools - 照片元信息编辑器</p>
    </footer>

    <script>
    (function() {
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewBefore = document.getElementById('previewBefore');
        const previewAfter = document.getElementById('previewAfter');
        const metadataContent = document.getElementById('metadataContent');
        const editForm = document.getElementById('editForm');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const errorContainer = document.getElementById('errorContainer');
        const gpsLatitudeInput = document.getElementById('gpsLatitude');
        const gpsLongitudeInput = document.getElementById('gpsLongitude');
        const dateTimeInput = document.getElementById('dateTime');

        let currentFile = null;
        let originalExifData = null;
        let hasExifData = false;

        function showError(message) {
            errorContainer.innerHTML = '<div class="error-message"><i class="bi bi-exclamation-triangle"></i> ' + message + '</div>';
            setTimeout(function() { errorContainer.innerHTML = ''; }, 5000);
        }

        function showSuccess(message) {
            errorContainer.innerHTML = '<div class="success-message"><i class="bi bi-check-circle"></i> ' + message + '</div>';
            setTimeout(function() { errorContainer.innerHTML = ''; }, 3000);
        }

        function formatGPSCoordinate(coordinate, ref) {
            if (!coordinate || !Array.isArray(coordinate) || coordinate.length < 3) return null;
            var degrees = coordinate[0];
            var minutes = coordinate[1];
            var seconds = coordinate[2];
            var decimal = degrees + minutes / 60 + seconds / 3600;
            if (ref === 'S' || ref === 'W') decimal = -decimal;
            return decimal.toFixed(6);
        }

        function decimalToDMS(value) {
            var abs = Math.abs(value);
            var deg = Math.floor(abs);
            var minFloat = (abs - deg) * 60;
            var min = Math.floor(minFloat);
            var sec = Math.round((minFloat - min) * 60 * 100);
            return [deg, min, sec];
        }

        function readExifData(file) {
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        EXIF.getData(img, function() {
                            var allTags = EXIF.getAllTags(this);
                            var exifData = {
                                GPSLatitude: allTags.GPSLatitude,
                                GPSLongitude: allTags.GPSLongitude,
                                GPSLatitudeRef: allTags.GPSLatitudeRef,
                                GPSLongitudeRef: allTags.GPSLongitudeRef,
                                DateTimeOriginal: allTags.DateTimeOriginal,
                                DateTime: allTags.DateTime,
                                Make: allTags.Make,
                                Model: allTags.Model,
                                Software: allTags.Software,
                                LensModel: allTags.LensModel,
                                imageWidth: allTags.PixelXDimension || allTags.imageWidth,
                                imageHeight: allTags.PixelYDimension || allTags.imageHeight
                            };
                            resolve(exifData);
                        });
                    };
                    img.onerror = function() { reject(new Error('无法加载图片')); };
                    img.src = e.target.result;
                };
                reader.onerror = function() { reject(new Error('读取文件失败')); };
                reader.readAsDataURL(file);
            });
        }

        function displayMetadata(exifData) {
            var html = '';
            hasExifData = false;

            var gpsLat = formatGPSCoordinate(exifData.GPSLatitude, exifData.GPSLatitudeRef);
            var gpsLng = formatGPSCoordinate(exifData.GPSLongitude, exifData.GPSLongitudeRef);

            var fields = [
                { label: 'GPS 纬度', value: gpsLat, key: 'GPSLatitude' },
                { label: 'GPS 经度', value: gpsLng, key: 'GPSLongitude' },
                { label: '拍摄时间', value: exifData.DateTimeOriginal || exifData.DateTime, key: 'DateTimeOriginal' },
                { label: '相机品牌', value: exifData.Make, key: 'Make' },
                { label: '相机型号', value: exifData.Model, key: 'Model' },
                { label: '软件', value: exifData.Software, key: 'Software' },
                { label: '镜头型号', value: exifData.LensModel, key: 'LensModel' },
                { label: '图片尺寸', value: (exifData.imageWidth && exifData.imageHeight) ? exifData.imageWidth + ' x ' + exifData.imageHeight : null, key: 'Size' }
            ];

            for (var i = 0; i < fields.length; i++) {
                var field = fields[i];
                if (field.value) {
                    hasExifData = true;
                    html += '<tr><th>' + field.label + '</th><td>' + field.value + '</td></tr>';
                }
            }

            if (!hasExifData) {
                metadataContent.innerHTML = '<p class="no-exif">此照片没有EXIF信息</p>';
                gpsLatitudeInput.value = '';
                gpsLongitudeInput.value = '';
                dateTimeInput.value = '';
            } else {
                metadataContent.innerHTML = '<table class="metadata-table"><tbody>' + html + '</tbody></table>';

                if (gpsLat) gpsLatitudeInput.value = gpsLat;
                if (gpsLng) gpsLongitudeInput.value = gpsLng;
                if (exifData.DateTimeOriginal) dateTimeInput.value = exifData.DateTimeOriginal;
                else if (exifData.DateTime) dateTimeInput.value = exifData.DateTime;
            }

            downloadBtn.disabled = false;
        }

        function handleFile(file) {
            if (!file) return;

            if (!file.type.match(/^image\/jpeg$/)) {
                showError('请上传 JPG 格式的图片（编辑EXIF需要JPEG格式）');
                return;
            }

            if (file.size > 50 * 1024 * 1024) {
                showError('文件大小不能超过 50MB');
                return;
            }

            currentFile = file;
            errorContainer.innerHTML = '';
            previewContainer.classList.add('active');

            var beforeUrl = URL.createObjectURL(file);
            previewBefore.src = beforeUrl;
            previewAfter.src = beforeUrl;

            readExifData(file).then(function(exifData) {
                originalExifData = exifData;
                displayMetadata(exifData);
            }).catch(function(error) {
                showError('读取图片信息时出错：' + error.message);
                metadataContent.innerHTML = '<p class="no-exif">此照片没有EXIF信息</p>';
                hasExifData = false;
                downloadBtn.disabled = false;
            });
        }

        uploadZone.addEventListener('click', function() { fileInput.click(); });
        fileInput.addEventListener('change', function(e) { handleFile(e.target.files[0]); });
        uploadZone.addEventListener('dragover', function(e) { e.preventDefault(); uploadZone.classList.add('dragover'); });
        uploadZone.addEventListener('dragleave', function(e) { e.preventDefault(); uploadZone.classList.remove('dragover'); });
        uploadZone.addEventListener('drop', function(e) {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFile(e.dataTransfer.files[0]);
        });

        resetBtn.addEventListener('click', function() {
            if (originalExifData) {
                displayMetadata(originalExifData);
                showSuccess('已重置为原始数据');
            }
        });

        function dataURLToArrayBuffer(dataURL) {
            var base64 = dataURL.split(',')[1];
            var binary = atob(base64);
            var arr = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
            return arr.buffer;
        }

        function arrayBufferToDataURL(buffer) {
            var bytes = new Uint8Array(buffer);
            var binary = '';
            for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
            return 'data:image/jpeg;base64,' + btoa(binary);
        }

        editForm.addEventListener('submit', function(e) {
            e.preventDefault();

            if (!currentFile) {
                showError('请先上传图片');
                return;
            }

            var reader = new FileReader();
            reader.onload = function(event) {
                try {
                    var imageData = event.target.result;
                    var binaryStr;
                    if (imageData.indexOf('data:image/jpeg;base64,') === 0) {
                        binaryStr = atob(imageData.split(',')[1]);
                    } else {
                        showError('不支持的图片格式');
                        return;
                    }

                    var exifObj;
                    try {
                        exifObj = piexif.load(binaryStr);
                    } catch (err) {
                        exifObj = {
                            '0th': {}, 'Exif': {}, 'GPS': {},
                            '1st': {}, 'thumbnail': null
                        };
                    }

                    var lat = gpsLatitudeInput.value.trim();
                    var lng = gpsLongitudeInput.value.trim();
                    var datetime = dateTimeInput.value.trim();

                    if (lat !== '') {
                        var latVal = parseFloat(lat);
                        if (isNaN(latVal)) { showError('纬度格式错误'); return; }
                        var latRef = latVal >= 0 ? 'N' : 'S';
                        var latDMS = decimalToDMS(latVal);
                        exifObj['GPS'][piexif.GPSIFD.GPSLatitudeRef] = latRef;
                        exifObj['GPS'][piexif.GPSIFD.GPSLatitude] = latDMS;
                    } else {
                        delete exifObj['GPS'][piexif.GPSIFD.GPSLatitudeRef];
                        delete exifObj['GPS'][piexif.GPSIFD.GPSLatitude];
                    }

                    if (lng !== '') {
                        var lngVal = parseFloat(lng);
                        if (isNaN(lngVal)) { showError('经度格式错误'); return; }
                        var lngRef = lngVal >= 0 ? 'E' : 'W';
                        var lngDMS = decimalToDMS(lngVal);
                        exifObj['GPS'][piexif.GPSIFD.GPSLongitudeRef] = lngRef;
                        exifObj['GPS'][piexif.GPSIFD.GPSLongitude] = lngDMS;
                    } else {
                        delete exifObj['GPS'][piexif.GPSIFD.GPSLongitudeRef];
                        delete exifObj['GPS'][piexif.GPSIFD.GPSLongitude];
                    }

                    if (datetime !== '') {
                        exifObj['Exif'][piexif.ExifIFD.DateTimeOriginal] = datetime;
                        exifObj['0th'][piexif.ImageIFD.DateTime] = datetime;
                    }

                    var exifBytes = piexif.dump(exifObj);
                    var newData = piexif.insert(exifBytes, binaryStr);

                    var newDataURL;
                    if (typeof Buffer !== 'undefined') {
                        newDataURL = 'data:image/jpeg;base64,' + Buffer.from(newData).toString('base64');
                    } else {
                        var binary = '';
                        for (var i = 0; i < newData.length; i++) binary += String.fromCharCode(newData.charCodeAt(i) & 0xff);
                        newDataURL = 'data:image/jpeg;base64,' + btoa(binary);
                    }

                    previewAfter.src = newDataURL;

                    var link = document.createElement('a');
                    var fileName = currentFile.name.replace(/\.[^.]+$/, '') + '_edited.jpg';
                    link.download = fileName;
                    link.href = newDataURL;
                    link.click();

                    showSuccess('图片已成功下载！');
                } catch (error) {
                    showError('处理图片时出错：' + error.message);
                    console.error(error);
                }
            };
            reader.onerror = function() { showError('读取文件失败'); };
            reader.readAsDataURL(currentFile);
        });
    })();
    </script>
</body>
</html>
