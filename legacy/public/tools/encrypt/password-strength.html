<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码强度检测 - CloverTools</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #c9a96e;
            --text: #e0e0e0;
            --muted: #8b949e;
            --border: #30363d;
            --danger: #f85149;
            --warning: #d29922;
            --success: #3fb950;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 32px;
        }
        .header h1 {
            font-size: 28px;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .header p {
            color: var(--muted);
            font-size: 14px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px;
            width: 100%;
            max-width: 560px;
        }
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
        }
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        #password {
            width: 100%;
            padding: 14px 50px 14px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        #password:focus {
            border-color: var(--accent);
        }
        .toggle-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--muted);
            cursor: pointer;
            font-size: 18px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-btn:hover { color: var(--accent); }
        .score-display {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }
        .score-number {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent);
            min-width: 80px;
        }
        .score-number.danger { color: var(--danger); }
        .score-number.warning { color: var(--warning); }
        .score-number.success { color: var(--success); }
        .bar-container {
            flex: 1;
            height: 12px;
            background: var(--bg);
            border-radius: 6px;
            overflow: hidden;
        }
        #strengthBar {
            height: 100%;
            width: 0%;
            border-radius: 6px;
            transition: width 0.3s, background 0.3s;
            background: var(--danger);
        }
        #strengthBar.medium { background: var(--warning); }
        #strengthBar.strong { background: #7ee787; }
        #strengthBar.very-strong { background: var(--success); }
        .level-text {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 24px;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
            width: 100%;
        }
        .level-text.danger { color: var(--danger); background: rgba(248,81,73,0.1); }
        .level-text.warning { color: var(--warning); background: rgba(210,153,34,0.1); }
        .level-text.success { color: #7ee787; background: rgba(63,185,80,0.1); }
        .level-text.very-strong { color: var(--success); background: rgba(63,185,80,0.1); }
        .details {
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .details h3 {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 12px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }
        .detail-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            padding: 8px 12px;
            background: var(--bg);
            border-radius: 6px;
        }
        .detail-item .icon {
            font-size: 14px;
            width: 20px;
            text-align: center;
        }
        .detail-item .label { color: var(--muted); flex: 1; }
        .detail-item .value { font-weight: 600; }
        .detail-item .value.ok { color: var(--success); }
        .detail-item .value.fail { color: var(--danger); }
        .suggestions {
            background: rgba(201,169,110,0.08);
            border: 1px solid rgba(201,169,110,0.2);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
        }
        .suggestions h4 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 10px;
        }
        .suggestions ul {
            list-style: none;
            font-size: 13px;
            color: var(--muted);
        }
        .suggestions li {
            padding: 4px 0;
            padding-left: 16px;
            position: relative;
        }
        .suggestions li::before {
            content: '→';
            position: absolute;
            left: 0;
            color: var(--accent);
        }
        .copy-btn {
            width: 100%;
            padding: 12px;
            margin-top: 16px;
            background: var(--accent);
            color: #0d1117;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .copy-btn:hover { opacity: 0.85; }
        .copy-btn.copied {
            background: var(--success);
        }
        .crack-time {
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            margin-top: 12px;
        }
        .crack-time span { color: var(--text); font-weight: 600; }
        @media (max-width: 480px) {
            .card { padding: 20px; }
            .detail-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔐 密码强度检测</h1>
        <p>实时分析密码安全性，助你设置更强密码</p>
    </div>
    <div class="card">
        <div class="input-group">
            <label>输入你要检测的密码</label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="请输入密码..." autocomplete="new-password">
                <button class="toggle-btn" id="toggleBtn" onclick="togglePassword()">👁</button>
            </div>
        </div>

        <div class="score-display">
            <div class="score-number" id="scoreNum">0</div>
            <div class="bar-container">
                <div id="strengthBar"></div>
            </div>
        </div>

        <div style="text-align:center">
            <div class="level-text danger" id="levelText">请输入密码</div>
            <div class="crack-time" id="crackTime"></div>
        </div>

        <div class="details" id="details">
            <h3>📊 详细分析</h3>
            <div class="detail-grid">
                <div class="detail-item">
                    <span class="icon">🔤</span>
                    <span class="label">小写字母</span>
                    <span class="value fail" id="hasLower">✗</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🔠</span>
                    <span class="label">大写字母</span>
                    <span class="value fail" id="hasUpper">✗</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🔢</span>
                    <span class="label">数字</span>
                    <span class="value fail" id="hasNumber">✗</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🔣</span>
                    <span class="label">特殊字符</span>
                    <span class="value fail" id="hasSpecial">✗</span>
                </div>
            </div>
            <div class="detail-grid">
                <div class="detail-item">
                    <span class="icon">📏</span>
                    <span class="label">密码长度</span>
                    <span class="value" id="pwdLen">0</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🔁</span>
                    <span class="label">重复字符</span>
                    <span class="value ok" id="noRepeat">✓</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🚫</span>
                    <span class="label">常见弱密码</span>
                    <span class="value ok" id="noCommon">✓</span>
                </div>
                <div class="detail-item">
                    <span class="icon">🎯</span>
                    <span class="label">字符多样性</span>
                    <span class="value" id="diversity">0</span>
                </div>
            </div>
        </div>

        <div class="suggestions" id="suggestions">
            <h4>💡 改进建议</h4>
            <ul id="suggestList">
                <li>输入密码查看改进建议</li>
            </ul>
        </div>

        <button class="copy-btn" id="copyBtn" onclick="copyLevel()">复制强度等级</button>
    </div>

    <script>
        const weakPasswords = [
            'password','123456','12345678','1234','qwerty','12345',
            'dragon','pussy','master','111111','baseball','abc123',
            'football','pass','maggie','696969','shadow','sunshine',
            'princess','letmein','welcome','666666','66666','aaaaaa',
            'admin','iloveyou','rockyou','stress','freedom','whatever',
            'qazwsx','monkey','login','starwars','hello','charlie',
            'donald','password1','password123','000000','123123',
            'qwert','letmein','access','master','abc','abcd','1234567890'
        ];

        const pwdInput = document.getElementById('password');
        const toggleBtn = document.getElementById('toggleBtn');
        const scoreNum = document.getElementById('scoreNum');
        const strengthBar = document.getElementById('strengthBar');
        const levelText = document.getElementById('levelText');
        const crackTime = document.getElementById('crackTime');
        const suggestList = document.getElementById('suggestList');

        function togglePassword() {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = '👁';
            }
        }

        function hasConsecutiveRepeats(pwd) {
            for (let i = 0; i < pwd.length - 2; i++) {
                if (pwd[i] === pwd[i+1] && pwd[i+1] === pwd[i+2]) return true;
            }
            return false;
        }

        function isCommonPattern(pwd) {
            const lower = pwd.toLowerCase();
            for (const wp of weakPasswords) {
                if (lower === wp || lower.includes(wp)) return true;
            }
            const patterns = ['123456','abcdef','qwerty','asdfgh','zxcvbn','qazwsx','0123456789'];
            for (const p of patterns) {
                if (lower.includes(p)) return true;
            }
            return false;
        }

        function getCrackTime(score) {
            if (score >= 80) return '暴力破解需要 <span>数百年</span>';
            if (score >= 60) return '暴力破解需要 <span>数年</span>';
            if (score >= 40) return '暴力破解需要 <span>数月</span>';
            if (score >= 20) return '暴力破解需要 <span>数天</span>';
            return '暴力破解仅需 <span>数秒</span>';
        }

        function analyze() {
            const pwd = pwdInput.value;
            const len = pwd.length;

            if (!pwd) {
                scoreNum.textContent = '0';
                scoreNum.className = 'score-number';
                strengthBar.style.width = '0%';
                strengthBar.className = '';
                levelText.textContent = '请输入密码';
                levelText.className = 'level-text danger';
                crackTime.innerHTML = '';
                document.getElementById('hasLower').className = 'value fail';
                document.getElementById('hasUpper').className = 'value fail';
                document.getElementById('hasNumber').className = 'value fail';
                document.getElementById('hasSpecial').className = 'value fail';
                document.getElementById('pwdLen').textContent = '0';
                document.getElementById('noRepeat').textContent = '✓';
                document.getElementById('noRepeat').className = 'value ok';
                document.getElementById('noCommon').textContent = '✓';
                document.getElementById('noCommon').className = 'value ok';
                document.getElementById('diversity').textContent = '0';
                suggestList.innerHTML = '<li>输入密码查看改进建议</li>';
                return;
            }

            let score = 0;
            const checks = {
                hasLower: /[a-z]/.test(pwd),
                hasUpper: /[A-Z]/.test(pwd),
                hasNumber: /[0-9]/.test(pwd),
                hasSpecial: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?`~]/.test(pwd),
                noRepeat: !hasConsecutiveRepeats(pwd),
                noCommon: !isCommonPattern(pwd)
            };

            // Length scoring
            if (len < 8) { /* 长度不够，直接算弱 */ }
            else if (len <= 12) score += 20;
            else if (len <= 16) score += 30;
            else score += 40;

            // Character type scoring
            if (checks.hasLower) score += 10;
            if (checks.hasUpper) score += 10;
            if (checks.hasNumber) score += 10;
            if (checks.hasSpecial) score += 15;

            // Pattern scoring
            if (checks.noRepeat) score += 5;
            if (checks.noCommon) score += 10;

            // Diversity bonus
            let types = 0;
            if (checks.hasLower) types++;
            if (checks.hasUpper) types++;
            if (checks.hasNumber) types++;
            if (checks.hasSpecial) types++;

            if (types === 4) score += 10;
            else if (types === 3) score += 5;

            // Upper cap at 100
            score = Math.min(score, 100);

            // Update UI
            scoreNum.textContent = score;
            scoreNum.className = 'score-number' + (score < 40 ? ' danger' : score < 60 ? ' warning' : score < 80 ? '' : ' success');

            strengthBar.style.width = score + '%';
            strengthBar.className = score < 40 ? '' : score < 60 ? 'medium' : score < 80 ? 'strong' : 'very-strong';

            let level = '', levelClass = '';
            if (score < 20) { level = '❌ 极弱'; levelClass = 'danger'; }
            else if (score < 40) { level = '🔴 弱'; levelClass = 'danger'; }
            else if (score < 60) { level = '🟡 中等'; levelClass = 'warning'; }
            else if (score < 80) { level = '🟢 强'; levelClass = 'success'; }
            else { level = '✅ 非常强'; levelClass = 'very-strong'; }

            levelText.textContent = level;
            levelText.className = 'level-text ' + levelClass;
            crackTime.innerHTML = getCrackTime(score);

            // Update detail items
            document.getElementById('hasLower').textContent = checks.hasLower ? '✓' : '✗';
            document.getElementById('hasLower').className = 'value ' + (checks.hasLower ? 'ok' : 'fail');
            document.getElementById('hasUpper').textContent = checks.hasUpper ? '✓' : '✗';
            document.getElementById('hasUpper').className = 'value ' + (checks.hasUpper ? 'ok' : 'fail');
            document.getElementById('hasNumber').textContent = checks.hasNumber ? '✓' : '✗';
            document.getElementById('hasNumber').className = 'value ' + (checks.hasNumber ? 'ok' : 'fail');
            document.getElementById('hasSpecial').textContent = checks.hasSpecial ? '✓' : '✗';
            document.getElementById('hasSpecial').className = 'value ' + (checks.hasSpecial ? 'ok' : 'fail');
            document.getElementById('pwdLen').textContent = len;
            document.getElementById('noRepeat').textContent = checks.noRepeat ? '✓' : '✗';
            document.getElementById('noRepeat').className = 'value ' + (checks.noRepeat ? 'ok' : 'fail');
            document.getElementById('noCommon').textContent = checks.noCommon ? '✓' : '✗';
            document.getElementById('noCommon').className = 'value ' + (checks.noCommon ? 'ok' : 'fail');
            document.getElementById('diversity').textContent = types + '/4';

            // Suggestions
            const suggestions = [];
            if (len < 8) suggestions.push('密码长度至少8位，建议12位以上');
            if (!checks.hasLower) suggestions.push('添加小写字母 (a-z)');
            if (!checks.hasUpper) suggestions.push('添加大写字母 (A-Z)');
            if (!checks.hasNumber) suggestions.push('添加数字 (0-9)');
            if (!checks.hasSpecial) suggestions.push('添加特殊字符 (!@#$%等)');
            if (hasConsecutiveRepeats(pwd)) suggestions.push('避免连续重复字符 (如 aaa)');
            if (isCommonPattern(pwd)) suggestions.push('避免常见密码模式 (如 123456)');
            if (types < 3) suggestions.push('增加字符类型组合，提升复杂度');

            suggestList.innerHTML = suggestions.length
                ? suggestions.map(s => `<li>${s}</li>`).join('')
                : '<li>🎉 密码强度优秀！</li>';
        }

        function copyLevel() {
            const level = levelText.textContent;
            navigator.clipboard.writeText(level).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = '已复制 ✓';
                btn.className = 'copy-btn copied';
                setTimeout(() => {
                    btn.textContent = '复制强度等级';
                    btn.className = 'copy-btn';
                }, 2000);
            });
        }

        pwdInput.addEventListener('input', analyze);
        pwdInput.addEventListener('paste', () => setTimeout(analyze, 0));
    </script>
</body>
</html>
