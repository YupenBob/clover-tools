<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>fixture</title><style>html,body{margin:0;height:100%;background:#000;color:#fff;overflow:hidden}main{display:grid;place-items:center;height:100vh}#fakeTime{font-size:24vh;font-variant-numeric:tabular-nums}#fakeExit{position:fixed;top:12px;right:12px;width:48px;height:48px;min-width:44px;min-height:44px;background:transparent;border:0;color:#fff;opacity:.35}#fakeExit:focus-visible{outline:2px solid #fff}</style></head>
<body><main id="fakeRoot" data-presentation-state="primary" data-presentation-mode="inline"><span id="fakeTime">09:30</span><canvas id="fakeCanvas" width="120" height="40"></canvas><button id="fakeExit" data-presentation-control="exit" aria-label="退出大屏">×</button></main>
<script>const c=document.getElementById('fakeCanvas').getContext('2d');c.fillStyle='#fff';c.font='20px sans-serif';c.fillText('NO',4,26);</script></body></html>
