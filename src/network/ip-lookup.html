<head>
  <meta charset="UTF-8">

  <style>
    .page-body { padding: 2.5rem 0 4rem; }
    .breadcrumb { font-size: 0.85rem; opacity: 0.6; margin-bottom: 0.5rem; }
    .breadcrumb a { color: var(--primary); text-decoration: none; }
    .nav-icon { width: 1.1rem; height: 1.1rem; vertical-align: middle; margin-right: 0.25rem; }
    .nav-icon-link { display: inline-flex !important; align-items: center; gap: 0.1rem; }
    .nav-icon-link span { font-size: 0.9rem; }
    .share-icon { width: 1rem; height: 1rem; vertical-align: middle; margin-right: 0.25rem; }

    .tool-card { background: var(--card-bg); border-radius: var(--radius); padding: 1.75rem; box-shadow: var(--card-shadow); margin-bottom: 1.5rem; }
    .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 0.6rem; opacity: 0.8; }

    /* Search box */
    .search-box { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; }
    .search-input-wrap { flex: 1; min-width: 200px; position: relative; }
    .search-input {
      width: 100%; padding: 0.65rem 0.85rem; font-size: 1rem;
      border: 1px solid var(--border); border-radius: 8px;
      background: var(--input-bg); color: var(--text);
      box-sizing: border-box;
    }
    .search-input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .btn { padding: 0.6rem 1.5rem; font-size: 0.9rem; font-weight: 600; border: none; border-radius: 8px; cursor: pointer; transition: opacity 0.2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Info card */
    .info-card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--card-shadow); overflow: hidden; margin-bottom: 1.5rem; }
    .info-card-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
      background: var(--bg-secondary);
    }
    .info-card-title { font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
    .badge { display: inline-block; padding: 0.15rem 0.55rem; font-size: 0.72rem; font-weight: 600; border-radius: 20px; background: var(--primary); color: #fff; }
    .copy-btn {
      display: flex; align-items: center; gap: 0.3rem;
      padding: 0.35rem 0.85rem; font-size: 0.8rem; font-weight: 600;
      background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; cursor: pointer; transition: opacity 0.2s;
    }
    .copy-btn:hover { opacity: 0.8; }
    .copy-btn.copied { background: var(--primary); color: #fff; border-color: var(--primary); }
    .info-card-body { padding: 1.25rem 1.5rem; }
    .ip-display { font-size: 1.5rem; font-weight: 700; font-family: 'Courier New', monospace; margin-bottom: 0.25rem; }

    /* Details grid */
    .details-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.5rem; margin-top: 1rem; }
    .detail-item { background: var(--bg-secondary); border-radius: 8px; padding: 0.75rem 1rem; }
    .detail-label { font-size: 0.75rem; font-weight: 600; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.2rem; }
    .detail-value { font-size: 0.92rem; font-weight: 500; word-break: break-all; }

    /* Location bar */
    .location-bar { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.6rem; font-size: 0.9rem; opacity: 0.8; }

    /* Loading state */
    .loading-wrap { display: none; align-items: center; gap: 0.75rem; padding: 1.25rem 1.5rem; }
    .loading-wrap.active { display: flex; }
    .spinner { width: 22px; height: 22px; border: 2.5px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; opacity: 0.75; }

    /* Error state */
    .error-msg { display: none; padding: 1rem 1.5rem; background: #fff0f0; border: 1px solid #ffcccc; border-radius: 8px; color: #c00; font-size: 0.88rem; margin-top: 0.5rem; }
    .error-msg.active { display: block; }

    /* Coordinate map link */
    .map-link { display: inline-flex; align-items: center; gap: 0.3rem; color: var(--primary); font-size: 0.85rem; text-decoration: none; margin-top: 0.5rem; }
    .map-link:hover { opacity: 0.8; }
  </style>
</head>

  <header class="site-header">
    <div class="container">
      <a href="/" class="site-logo">CloverTools</a>
      <nav class="site-nav site-nav-desktop">
        <a href="/" class="nav-icon-link" title="工具首页"><svg class="nav-icon" aria-hidden="true"><use href="#icon-home"/></svg><span>工具</span></a>
        <a href="https://github.com/YupenBob/clover-tools" target="_blank" class="nav-icon-link" title="GitHub"><svg class="nav-icon" aria-hidden="true"><use href="#icon-github"/></svg><span>GitHub</span></a>
        <button class="theme-toggle" id="themeToggle" title="切换主题"><svg class="icon-sun" style="display:none"><use href="#icon-sun"/></svg><svg class="icon-moon"><use href="#icon-moon"/></svg></button>
      </nav>
    </div>
  </header>

  <main class="page-body">
    <div class="container">
      <div class="breadcrumb"><a href="/">← 返回工具箱</a></div>
      <div class="tool-header">
        <h1>IP 查询</h1>
        <p class="description">查询 IP 地址或域名的地理位置信息，自动检测本机公网 IP</p>
      </div>

      <div class="tool-layout">
        <div class="tool-card">
          <div class="search-box">
            <div class="search-input-wrap">
              <input type="text" id="ipInput" class="search-input" placeholder="输入 IP 地址，按 Enter 查询..." autocomplete="off" spellcheck="false" />
            </div>
            <button class="btn btn-primary" id="btnQuery">查询</button>
          </div>
          <div id="errorMsg" class="error-msg"></div>
        </div>

        <div class="info-card" id="resultCard" style="display:none;">
          <div class="info-card-header">
            <div class="info-card-title">
              <span id="ipLabel"></span>
            </div>
            <button class="copy-btn" id="copyBtn" onclick="copyIP()">
              <svg width="14" height="14" aria-hidden="true"><use href="#icon-copy"/></svg>
              <span id="copyText">复制 IP</span>
            </button>
          </div>
          <div class="loading-wrap" id="loadingWrap">
            <div class="spinner"></div>
            <div class="loading-text">正在查询...</div>
          </div>
          <div class="info-card-body" id="resultBody"></div>
        </div>
      </div>
    </div>
  </main>

  <button class="share-btn" id="shareBtn" title="分享此工具">
    <svg class="share-icon" aria-hidden="true"><use href="#icon-share"/></svg>分享
  </button>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p style="margin:0;">Made with 🍀 by Clover · Open Source · No tracking · No server</p>
    </div>
  </footer>

  <div id="toast"></div>

  <script>
  CT.initTheme();
  CT.initKeyboardShortcuts();
  CT.initReveal();
  CT.initCopyPulse();

  var lastQueryIP = '';

  document.getElementById('shareBtn').onclick = function() {
    navigator.clipboard.writeText(window.location.href).then(function() {
      CT.showToast('链接已复制！');
    }).catch(function() {
      CT.showToast('复制失败');
    });
  };

  function showError(msg) {
    var el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('active');
    setTimeout(function() { el.classList.remove('active'); }, 5000);
  }

  function hideError() {
    document.getElementById('errorMsg').classList.remove('active');
  }

  function getCurrentIP() {
    return fetch('https://api.ipify.org?format=json')
      .then(function(r) { return r.json(); })
      .then(function(data) { return data.ip; });
  }

  function queryIP(ip) {
    lastQueryIP = ip;
    hideError();

    var card = document.getElementById('resultCard');
    card.style.display = 'block';

    var loadingWrap = document.getElementById('loadingWrap');
    var resultBody = document.getElementById('resultBody');
    loadingWrap.classList.add('active');
    resultBody.innerHTML = '';

    var isOwn = (arguments.length > 1 && arguments[1] === true);
    document.getElementById('ipLabel').textContent = isOwn ? ip + ' <span class="badge">本机 IP</span>' : ip;

    fetch('https://ip-api.com/json/' + ip + '?fields=status,message,country,countryCode,city,isp,org,as,lat,lon,timezone,query')
      .then(function(r) {
        if (!r.ok) throw new Error('网络请求失败');
        return r.json();
      })
      .then(function(data) {
        loadingWrap.classList.remove('active');

        if (data.status === 'fail') {
          var msg = data.message || '查询失败';
          if (msg.indexOf('reserved range') !== -1) msg = '该 IP 地址无效或为保留地址';
          else if (msg.indexOf('invalid query') !== -1) msg = 'IP 地址格式无效';
          showError(msg);
          resultBody.innerHTML = '';
          return;
        }

        renderResult(data);
      })
      .catch(function(err) {
        loadingWrap.classList.remove('active');
        showError('网络错误，请检查网络连接');
        resultBody.innerHTML = '';
      });
  }

  function renderResult(data) {
    var body = document.getElementById('resultBody');
    var lat = data.lat, lon = data.lon;

    var coords = (lat !== undefined && lon !== undefined)
      ? lat.toFixed(4) + '°, ' + lon.toFixed(4) + '°'
      : '—';

    var mapUrl = (lat !== undefined && lon !== undefined)
      ? 'https://www.openstreetmap.org/?mlat=' + lat + '&mlon=' + lon
      : '';

    var items = [
      ['国家/地区', (data.country || '') + (data.countryCode ? ' (' + data.countryCode + ')' : '')],
      ['城市', data.city || '—'],
      ['ISP', data.isp || '—'],
      ['组织', data.org || '—'],
      ['坐标', coords],
      ['时区', data.timezone || '—'],
      ['AS', data.as || '—'],
    ];

    var html = '<div class="ip-display">' + data.query + '</div>';

    if (data.city || data.country) {
      var flag = data.countryCode ? countryFlag(data.countryCode) : '';
      html += '<div class="location-bar">' + flag + ' ' + (data.country || '') + (data.city ? ' / ' + data.city : '') + '</div>';
    }

    html += '<div class="details-grid">';
    items.forEach(function(item) {
      if (item[1] && item[1] !== '—') {
        html += '<div class="detail-item">';
        html += '<div class="detail-label">' + item[0] + '</div>';
        html += '<div class="detail-value">' + item[1] + '</div>';
        html += '</div>';
      }
    });
    html += '</div>';

    if (mapUrl) {
      html += '<a href="' + mapUrl + '" target="_blank" rel="noopener" class="map-link">';
      html += '<svg width="14" height="14" aria-hidden="true"><use href="#icon-map-pin"/></svg>在地图上查看';
      html += '</a>';
    }

    body.innerHTML = html;
  }

  function countryFlag(code) {
    if (!code || code.length !== 2) return '';
    var offset = 127397;
    var emoji = [];
    var chars = code.toUpperCase().split('');
    for (var i = 0; i < chars.length; i++) {
      emoji.push(String.fromCodePoint(chars[i].charCodeAt(0) + offset));
    }
    return emoji.join('');
  }

  function copyIP() {
    if (!lastQueryIP) return;
    navigator.clipboard.writeText(lastQueryIP).then(function() {
      var btn = document.getElementById('copyBtn');
      var text = document.getElementById('copyText');
      btn.classList.add('copied');
      text.textContent = '已复制';
      CT.showToast('IP 已复制！');
      setTimeout(function() {
        btn.classList.remove('copied');
        text.textContent = '复制 IP';
      }, 2000);
    }).catch(function() {
      CT.showToast('复制失败');
    });
  }

  // Event listeners
  document.getElementById('btnQuery').addEventListener('click', function() {
    var input = document.getElementById('ipInput').value.trim();
    if (!input) {
      showError('请输入 IP 地址');
      return;
    }
    queryIP(input);
  });

  document.getElementById('ipInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      var input = this.value.trim();
      if (!input) {
        showError('请输入 IP 地址');
        return;
      }
      queryIP(input);
    }
  });

  // Auto-detect own IP on page load
  (function() {
    var input = document.getElementById('ipInput');
    getCurrentIP().then(function(ip) {
      input.value = ip;
      queryIP(ip, true);
    }).catch(function() {
      // Silent fail — user can still type manually
    });
  })();
  </script>
</body>
</html>
