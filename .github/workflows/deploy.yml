name: Deploy to Vercel

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'tools.json'
      - 'articles.json'
      - 'article_contents/**'
      - 'generator.js'
      - 'src/**'
      - 'templates/**'
      - 'keywords.json'
      - 'public/**'
      - 'vercel.json'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate static files
        run: node generator.js

      - name: Deploy to Vercel
        run: npx vercel --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Submit to Bing IndexNow
        run: |
          node -e "
          const https = require('https');
          const data = JSON.parse(require('fs').readFileSync('articles.json', 'utf8'));
          const urls = data.articles.map(a => 'https://tools.xsanye.cn/blog/' + a.slug + '.html');
          const payload = JSON.stringify({ host: 'https://tools.xsanye.cn', key: '05b97bd1ccb0108b037fad6252fd553acee2ce13191856e3a13c0aa1b5b4c37a', urlList: urls });
          const req = https.request({ hostname: 'www.bing.com', path: '/indexnow', method: 'POST', headers: { 'Content-Type': 'application/json', 'Content-Length': Buffer.byteLength(payload) } }, res => { console.log('IndexNow status:', res.statusCode); process.exit(0); });
          req.on('error', e => console.error('IndexNow error:', e.message));
          req.write(payload); req.end();
          "
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
