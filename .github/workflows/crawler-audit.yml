name: Cloudflare crawler audit
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Quality checks']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: clovertools-crawler-audit
  cancel-in-progress: false
jobs:
  bots:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Bot Fight Mode is off
        env:
          CLOUDFLARE_BOT_API_TOKEN: ${{ secrets.CLOUDFLARE_BOT_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ZONE_NAME: clovertools.cn
        run: node scripts/check-cloudflare-bots.mjs
      - name: Audit published sitemap, index directives and canonical redirects
        if: always()
        env:
          PUBLIC_SITE_URL: https://clovertools.cn
        run: node scripts/audit-crawlability.mjs
      - name: Save API verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawler-audit-${{ github.sha }}
          path: output/crawler-audit/
          retention-days: 30
