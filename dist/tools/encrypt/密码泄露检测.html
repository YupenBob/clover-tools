    // SHA-1 hex digest using Web Crypto API
async function sha1Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-1', enc);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
}

const pwdInput = document.getElementById('passwordInput');
const toggleBtn = document.getElementById('toggleMask');
const checkBtn = document.getElementById('checkBtn');
const status = document.getElementById('status');
const output = document.getElementById('output');

function setMask() {
  pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
  toggleBtn.textContent = pwdInput.type === 'password' ? '👁️' : '🙈';
}
toggleBtn.onclick = setMask;
pwdInput.type = 'password';

function strengthMeter(pwd) {
  if (!pwd) return { score: 0, label: '无' };
  let score = 0;
  if (pwd.length >= 8) score++;
  if (pwd.length >= 12) score++;
  if (/[A-Z]/.test(pwd) && /[a-z]/.test(pwd)) score++;
  if (/\d/.test(pwd)) score++;
  if (/[^A-Za-z0-9]/.test(pwd)) score++;
  const labels = ['极弱', '较弱', '一般', '良好', '强', '极强'];
  return { score: score, label: labels[score] || '极弱' };
}

function renderStrength(pwd) {
  const s = strengthMeter(pwd);
  if (!pwd) return '';
  const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#10b981', '#06b6d4'];
  const c = colors[s.score];
  const pct = ((s.score + 1) / 6 * 100).toFixed(0);
  return '<div style="margin-top:0.6rem;background:var(--bg-secondary);padding:0.6rem 0.8rem;border-radius:8px;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;font-size:0.8rem;margin-bottom:0.3rem;">'
    +   '<span style="opacity:0.7;">本地强度评估</span>'
    +   '<span style="font-weight:600;color:' + c + ';">' + s.label + '</span>'
    + '</div>'
    + '<div style="height:6px;background:rgba(127,127,127,0.15);border-radius:3px;overflow:hidden;">'
    +   '<div style="height:100%;width:' + pct + '%;background:' + c + ';border-radius:3px;transition:width 0.3s;"></div>'
    + '</div>'
    + '</div>';
}

async function runCheck() {
  const pwd = pwdInput.value;
  output.innerHTML = '';
  status.innerHTML = '';
  if (!pwd) {
    output.innerHTML = '<div style="padding:1rem;text-align:center;opacity:0.6;">请输入密码</div>';
    return;
  }
  if (pwd.length < 4) {
    output.innerHTML = '<div style="padding:1rem;text-align:center;opacity:0.6;">密码长度至少 4 位</div>';
    return;
  }
  checkBtn.disabled = true;
  checkBtn.textContent = '检查中...';
  status.innerHTML = '⏳ 正在计算 SHA-1 并向 HIBP 查询...';
  try {
    const hash = await sha1Hex(pwd);
    const prefix = hash.slice(0, 5);
    const suffix = hash.slice(5);
    // k-anonymity: only send first 5 chars of hash
    const url = 'https://api.pwnedpasswords.com/range/' + prefix;
    const resp = await fetch(url, { headers: { 'Add-Padding': 'true' } });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const lines = text.split('\n');
    let count = 0;
    for (const line of lines) {
      const [h, c] = line.trim().split(':');
      if (h && h.toUpperCase() === suffix) {
        count = parseInt(c, 10) || 0;
        break;
      }
    }
    let html = '';
    if (count > 0) {
      html += '<div style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.4);padding:1rem;border-radius:12px;margin-bottom:0.75rem;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#ef4444;margin-bottom:0.4rem;">⚠️ 密码已泄露</div>'
        + '<div style="font-size:0.9rem;line-height:1.7;">该密码在公开数据泄露事件中出现 <b style="color:#ef4444;font-size:1.3rem;font-family:monospace;">' + count.toLocaleString() + '</b> 次。'
        +   '<br>🚫 强烈建议立即更换此密码！</div>'
        + '</div>';
    } else {
      html += '<div style="background:rgba(34,197,94,0.12);border:1px solid rgba(34,197,94,0.4);padding:1rem;border-radius:12px;margin-bottom:0.75rem;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#22c55e;margin-bottom:0.4rem;">✅ 密码安全</div>'
        + '<div style="font-size:0.9rem;line-height:1.7;">未在 HIBP 已知泄露数据中发现此密码。'
        +   '<br>👍 但请注意：未泄露不等于绝对安全，仍建议使用密码管理器生成强密码。</div>'
        + '</div>';
    }
    html += renderStrength(pwd);
    html += '<div style="margin-top:0.75rem;padding:0.6rem 0.8rem;background:var(--bg-secondary);border-radius:8px;font-size:0.78rem;opacity:0.7;line-height:1.7;">'
      + '🔍 SHA-1 前缀：<code style="font-family:monospace;">' + prefix + '*****</code><br>'
      + '🛡️ 查询由 <a href="https://haveibeenpwned.com/Passwords" target="_blank" rel="noopener" style="color:var(--primary);">Have I Been Pwned</a> 提供，k-anonymity 模型确保完整哈希不会离开您的设备。'
      + '</div>';
    output.innerHTML = html;
    status.innerHTML = count > 0 ? '❌ 查询完成，发现 ' + count.toLocaleString() + ' 次泄露记录' : '✅ 查询完成，未发现泄露';
  } catch (e) {
    output.innerHTML = '<div style="padding:1rem;text-align:center;color:#ef4444;">❌ 查询失败：' + e.message + '<br><span style="font-size:0.8rem;opacity:0.7;">请检查网络连接或稍后重试</span></div>';
    status.innerHTML = '❌ 查询失败';
  } finally {
    checkBtn.disabled = false;
    checkBtn.textContent = '检查是否已泄露';
  }
}

checkBtn.onclick = runCheck;
pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') runCheck(); });
document.getElementById('copyOutput').onclick = () => {
  const text = output.innerText;
  if (text) copyToClipboard(text);
};
output.innerHTML = '<div style="padding:1.5rem;text-align:center;opacity:0.5;">👆 输入密码后点击"检查"按钮</div>';
  </script>
