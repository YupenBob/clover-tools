  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    const typeSel = document.getElementById('keyType');
const lengthSel = document.getElementById('keyLength');
const useUpper = document.getElementById('useUpper');
const useLower = document.getElementById('useLower');
const useDigits = document.getElementById('useDigits');
const useSymbols = document.getElementById('useSymbols');
const useHexUpper = document.getElementById('useHexUpper');
const batchMode = document.getElementById('batchMode');
const output = document.getElementById('output');

const CHARS = {
  upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lower: 'abcdefghijklmnopqrstuvwxyz',
  digits: '0123456789',
  symbols: '!@#$%^&*()-_=+[]{}|;:,.<>?/~',
  hexLower: '0123456789abcdef',
  hexUpper: '0123456789ABCDEF',
};

function cryptoRandom(max) {
  // Unbiased modulo using rejection sampling
  const range = 0x100000000;
  const limit = range - (range % max);
  const buf = new Uint32Array(1);
  let n;
  do { crypto.getRandomValues(buf); n = buf[0]; } while (n >= limit);
  return n % max;
}

function generateRandom(len, charset) {
  let s = '';
  for (let i = 0; i < len; i++) s += charset[cryptoRandom(charset.length)];
  return s;
}

function generatePassphrase(wordCount) {
  // Simple English word list for passphrases
  const words = ['apple','banana','cherry','dragon','eagle','forest','galaxy','hammer','island','jungle','kettle','lemon','mountain','nebula','ocean','planet','quartz','rocket','silver','thunder','umbrella','violet','whisper','yellow','zenith','amber','bridge','crystal','diamond','ember','feather','glacier','horizon','ivory','jasmine','kingdom','lighthouse','meadow','nimbus','octopus','panther','quasar','rainbow','sapphire','tornado','unicorn','volcano','waterfall','xenon','yacht','zephyr'];
  const out = [];
  for (let i = 0; i < wordCount; i++) out.push(words[cryptoRandom(words.length)]);
  return out.join('-') + '-' + generateRandom(4, CHARS.digits);
}

function generateUUID() {
  const buf = new Uint8Array(16);
  crypto.getRandomValues(buf);
  buf[6] = (buf[6] & 0x0f) | 0x40; // version 4
  buf[8] = (buf[8] & 0x3f) | 0x80; // variant
  const h = Array.from(buf).map(b => b.toString(16).padStart(2, '0'));
  return h.slice(0,4).join('') + '-' + h.slice(4,6).join('') + '-' + h.slice(6,8).join('') + '-' + h.slice(8,10).join('') + '-' + h.slice(10,16).join('');
}

function toBase64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function generateOne() {
  const type = typeSel.value;
  const len = parseInt(lengthSel.value, 10);
  let result = '';
  if (type === 'random') {
    let charset = '';
    if (useUpper.checked) charset += CHARS.upper;
    if (useLower.checked) charset += CHARS.lower;
    if (useDigits.checked) charset += CHARS.digits;
    if (useSymbols.checked) charset += CHARS.symbols;
    if (!charset) charset = CHARS.lower + CHARS.digits;
    result = generateRandom(len, charset);
  } else if (type === 'aes') {
    const bytes = new Uint8Array(len / 8);
    crypto.getRandomValues(bytes);
    result = toBase64(bytes);
  } else if (type === 'hex') {
    const charset = useHexUpper.checked ? CHARS.hexUpper : CHARS.hexLower;
    result = generateRandom(len, charset);
  } else if (type === 'base64') {
    const bytes = new Uint8Array(Math.ceil(len * 6 / 8));
    crypto.getRandomValues(bytes);
    result = toBase64(bytes).replace(/[+/=]/g, '').slice(0, len);
  } else if (type === 'uuid') {
    result = generateUUID();
  } else if (type === 'passphrase') {
    result = generatePassphrase(Math.max(3, Math.min(8, Math.ceil(len / 8))));
  }
  return result;
}

function renderResults(list) {
  const meta = '<div style="font-size:0.78rem;opacity:0.65;margin-bottom:0.5rem;">'
    + '📊 类型：<b>' + typeSel.options[typeSel.selectedIndex].text + '</b> | 长度：<b>' + lengthSel.value + '</b> | 生成时间：<b>' + new Date().toLocaleTimeString() + '</b>'
    + '</div>';
  const items = list.map((s, i) =>
    '<div style="display:flex;align-items:center;gap:0.5rem;padding:0.6rem 0.8rem;background:var(--bg-secondary);border-radius:8px;margin-bottom:0.5rem;">'
    + '<span style="opacity:0.5;font-size:0.8rem;min-width:1.5em;text-align:right;">' + (i+1) + '</span>'
    + '<code style="flex:1;font-family:monospace;font-size:0.9rem;word-break:break-all;user-select:all;">' + s + '</code>'
    + '<button class="copy-btn" data-val="' + s.replace(/"/g, '&quot;') + '" style="padding:0.2rem 0.5rem;font-size:0.75rem;">复制</button>'
    + '</div>'
  ).join('');
  output.innerHTML = meta + items;
  output.querySelectorAll('.copy-btn').forEach(b => {
    b.onclick = () => copyToClipboard(b.getAttribute('data-val'));
  });
}

function gen() {
  try {
    const count = batchMode.checked ? 5 : 1;
    const list = [];
    for (let i = 0; i < count; i++) list.push(generateOne());
    renderResults(list);
  } catch (e) {
    output.innerHTML = '<div style="padding:1rem;text-align:center;color:#ef4444;">❌ 生成失败：' + e.message + '</div>';
  }
}

document.getElementById('genBtn').onclick = gen;
document.getElementById('batchBtn').onclick = () => {
  batchMode.checked = true;
  gen();
};
[typeSel, lengthSel, useUpper, useLower, useDigits, useSymbols, useHexUpper, batchMode].forEach(el => el.addEventListener('change', gen));
document.getElementById('copyOutput').onclick = () => {
  const codes = Array.from(output.querySelectorAll('code')).map(c => c.textContent);
  if (codes.length) copyToClipboard(codes.join('\n'));
};
gen();
  </script>
