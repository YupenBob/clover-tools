  <script>

    (function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d'),ph=document.getElementById('ph'),info=document.getElementById('info'),sw=document.getElementById('sw'),hex=document.getElementById('hex'),rgb=document.getElementById('rgb'),hsl=document.getElementById('hsl'),pos=document.getElementById('pos');
function loadImg(src){var img=new Image();img.onload=function(){var mw=600,mh=400;var w=img.width,h=img.height,r=Math.min(mw/w,mh/h,1);cv.width=w*r;cv.height=h*r;ctx.drawImage(img,0,0,cv.width,cv.height);cv.style.display='block';ph.style.display='none';};img.src=src;}
document.getElementById('file').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){loadImg(ev.target.result);};r.readAsDataURL(f);};
document.getElementById('sampleBtn').onclick=function(){var c=document.createElement('canvas');c.width=300;c.height=200;var cx=c.getContext('2d');var g=cx.createLinearGradient(0,0,300,200);g.addColorStop(0,'#ff6b6b');g.addColorStop(0.5,'#4ecdc4');g.addColorStop(1,'#45b7d1');cx.fillStyle=g;cx.fillRect(0,0,300,200);loadImg(c.toDataURL());};
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),h=0,s=0,l=(mx+mn)/2;if(mx!==mn){var d=mx-mn;s=l>0.5?d/(2-mx-mn):d/(mx+mn);switch(mx){case r:h=((g-b)/d+(g<b?6:0))/6;break;case g:h=((b-r)/d+2)/6;break;case b:h=((r-g)/d+4)/6;break;}}return[h*360,s*100,l*100];}
cv.onclick=function(e){var rect=cv.getBoundingClientRect();var x=Math.round((e.clientX-rect.left)*(cv.width/rect.width)),y=Math.round((e.clientY-rect.top)*(cv.height/rect.height));var d=ctx.getImageData(x,y,1,1).data;var r=d[0],g=d[1],b=d[2];var hx='#'+[r,g,b].map(function(v){return v.toString(16).padStart(2,'0');}).join('').toUpperCase();sw.style.backgroundColor=hx;hex.value=hx;rgb.textContent='rgb('+r+', '+g+', '+b+')';var hsl2=rgb2hsl(r,g,b);hsl.textContent='hsl('+Math.round(hsl2[0])+', '+Math.round(hsl2[1])+'%, '+Math.round(hsl2[2])+'%)';pos.textContent='('+x+', '+y+')';info.style.display='block';};
document.getElementById('copyBtn').onclick=function(){navigator.clipboard.writeText(hex.value);};
})();
