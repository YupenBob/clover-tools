<div class="tool-card"><div class="breadcrumb">首页 / 文本处理 / CSS格式化</div><h1>CSS 格式化工具</h1><p style="color:var(--text-secondary);font-size:.9rem;margin-bottom:1.5rem">美化或压缩 CSS 代码，支持多种格式化风格。</p><div class="tool-card"><h3>输入 CSS</h3><textarea id="cssInput" placeholder="粘贴 CSS 代码..." style="min-height:120px;font-family:monospace;font-size:.85rem"></textarea><div class="format-options"><div class="opt-row"><label>格式化风格</label><select id="styleSelect"><option value="1tbs">1TBS (单行)</option><option value="allman">Allman (换行)</option><option value="kr">K&R (紧凑)</option></select></div><div class="opt-row"><label>缩进</label><input type="number" id="indentSize" value="2" min="0" max="8" style="width:60px"> 空格</div><div class="opt-row"><label>选项</label><label><input type="checkbox" id="sortSelectors" checked> 排序选择器</label><label style="margin-left:1rem"><input type="checkbox" id="removeComments"> 移除注释</label></div></div><div class="btn-row"><button class="btn btn-primary" onclick="formatCSS()">格式化</button><button class="btn btn-secondary" onclick="compressCSS()">压缩</button><button class="btn btn-secondary" onclick="copyCSS()">复制</button></div></div><div class="output-box"><h3>输出结果</h3><textarea id="cssOutput" readonly placeholder="格式化结果..." style="min-height:120px;font-family:monospace;font-size:.85rem;min-height:150px"></textarea></div>

function formatCSS(){
  var css=document.getElementById('cssInput').value;
  if(!css.trim())return;
  var indent=parseInt(document.getElementById('indentSize').value)||2;
  var style=document.getElementById('styleSelect').value;
  var sortSel=document.getElementById('sortSelectors').checked;
  var rmCmt=document.getElementById('removeComments').checked;
  if(rmCmt)css=css.replace(/\/\*[\s\S]*?\*\//g,'');
  css=css.replace(/\s+/g,' ').replace(/\s*\{\s*/g,'{').replace(/\s*\}\s*/g,'}').replace(/\s*:\s*/g,': ').replace(/\s*;\s*/g,';').trim();
  if(style==='allman'){
    css=css.replace(/\{/g,' {\n'+' '.repeat(indent)).replace(/;/g,';\n'+' '.repeat(indent));
  }else if(style==='kr'){
    css=css.replace(/;/g,'; ');
  }
  if(sortSel){
    var rules=css.split(/}\s*/).filter(function(r){return r.trim();});
    rules.sort(function(a,b){return a.localeCompare(b);});
    css=rules.join('}\n');
  }
  document.getElementById('cssOutput').value=css;
}
function compressCSS(){
  var css=document.getElementById('cssInput').value;
  if(!css.trim())return;
  var result=css.replace(/\/\*[\s\S]*?\*\//g,'').replace(/\s+/g,' ').replace(/\s*\{\s*/g,'{').replace(/\s*\}\s*/g,'}').replace(/\s*:\s*/g,':').replace(/\s*;\s*/g,';').replace(/;}/g,'}').trim();
  document.getElementById('cssOutput').value=result;
}
window.formatCSS=formatCSS;
window.compressCSS=compressCSS;
window.copyCSS=function(){
  var t=document.getElementById('cssOutput').value;
  if(!t)return;
  navigator.clipboard.writeText(t).then(function(){if(window.CT&&CT.showToast)CT.showToast('已复制');});
};
})();
