  { q: "亡羊补____", a: "牢", full: "亡羊补牢", cat: "寓言", exp: "丢了羊后修补羊圈，比喻出了问题以后想办法补救，可以防止继续受损失。" },
  { q: "____底之蛙", a: "井", full: "井底之蛙", cat: "寓言", exp: "井底下的青蛙只能看到井口那么大的天，比喻见识狭窄的人。" },
  { q: "刻舟求____", a: "剑", full: "刻舟求剑", cat: "寓言", exp: "在船上刻记号寻找掉入水中的剑，比喻拘泥固执，不知变通。" },
  { q: "杯弓____影", a: "蛇", full: "杯弓蛇影", cat: "寓言", exp: "把映在酒杯里的弓影误认为蛇，比喻因疑神疑鬼而引起恐惧。" },
  { q: "____翁之意", a: "醉", full: "醉翁之意不在酒", cat: "历史", exp: "本意不在此，而在彼，也比喻别有用心。" },
  { q: "____水车薪", a: "杯", full: "杯水车薪", cat: "寓言", exp: "用一杯水去救一车着了火的柴，比喻力量太小，无济于事。" },
  { q: "____牛一毛", a: "九", full: "九牛一毛", cat: "数字", exp: "九头牛身上的一根毛，比喻极大数量中微不足道的一小部分。" },
  { q: "____全十美", a: "十", full: "十全十美", cat: "数字", exp: "十分完美，毫无欠缺。" },
  { q: "____面埋伏", a: "四", full: "四面埋伏", cat: "数字", exp: "四面八方布置了隐藏的兵力，形容被包围的态势。" },
  { q: "____海为家", a: "五", full: "五湖四海", cat: "数字", exp: "泛指四面八方或全国各地。" },
  { q: "____神无主", a: "六", full: "六神无主", cat: "数字", exp: "形容心慌意乱，拿不定主意。" },
  { q: "____上八下", a: "七", full: "七上八下", cat: "数字", exp: "形容心里慌乱不安。" },
  { q: "____霄云外", a: "九", full: "九霄云外", cat: "数字", exp: "九重天以外，形容极其高远或远得无影无踪。" },
  { q: "____毛不拔", a: "一", full: "一毛不拔", cat: "数字", exp: "形容极端吝啬自私。" },
  { q: "对____弹琴", a: "牛", full: "对牛弹琴", cat: "动物", exp: "比喻对不懂道理的人讲道理，或对外行人说内行话，白费口舌。" },
  { q: "____到成功", a: "马", full: "马到成功", cat: "动物", exp: "形容事情顺利，很快就能成功。" },
  { q: "____急跳墙", a: "狗", full: "狗急跳墙", cat: "动物", exp: "比喻走投无路时不顾一切地采取极端行动。" },
  { q: "____马之劳", a: "犬", full: "犬马之劳", cat: "动物", exp: "表示心甘情愿地像犬马一样为主人奔走效力。" },
  { q: "____雀无声", a: "鸦", full: "鸦雀无声", cat: "动物", exp: "形容非常安静，没有一点声音。" },
  { q: "____目混珠", a: "鱼", full: "鱼目混珠", cat: "动物", exp: "拿鱼眼睛冒充珍珠，比喻用假的冒充真的。" },
  { q: "____飞凤舞", a: "龙", full: "龙飞凤舞", cat: "动物", exp: "形容书法笔势舒展活泼，也形容气势奔放雄壮。" },
  { q: "____马奔腾", a: "万", full: "万马奔腾", cat: "动物", exp: "形容声势浩大、场面热烈。" },
  { q: "____过拔毛", a: "雁", full: "雁过拔毛", cat: "动物", exp: "比喻对经手的事务绝不放过任何牟取私利的机会。" },
  { q: "____立鸡群", a: "鹤", full: "鹤立鸡群", cat: "动物", exp: "像鹤站在鸡群中，比喻一个人的仪表或才能在周围一群人里显得很突出。" },
  { q: "____破天惊", a: "石", full: "石破天惊", cat: "自然", exp: "形容文章或议论惊人，或比喻事情发生得突然。" },
  { q: "____过隙", a: "光", full: "光阴似箭", cat: "自然", exp: "时间过得飞快。" },
  { q: "____外桃源", a: "世", full: "世外桃源", cat: "自然", exp: "比喻与世隔绝或理想中的美好地方。" },
  { q: "____然大波", a: "滔", full: "滔天大波", cat: "自然", exp: "形容波浪极大或风浪极大。" },
  { q: "____风化雨", a: "春", full: "春风化雨", cat: "自然", exp: "比喻良好的教育或良好的熏陶。" },
  { q: "____过天晴", a: "雨", full: "雨过天晴", cat: "自然", exp: "比喻情况由坏变好。" },
  { q: "____花似锦", a: "繁", full: "繁花似锦", cat: "自然", exp: "各种各样的鲜花盛开，像锦绣一样美好。" },
  { q: "____阳似火", a: "骄", full: "骄阳似火", cat: "自然", exp: "强烈的阳光像火一样热。" },
  { q: "____风凛冽", a: "寒", full: "寒风凛冽", cat: "自然", exp: "形容非常寒冷刺骨的风。" },
  { q: "三顾____庐", a: "茅", full: "三顾茅庐", cat: "历史", exp: "比喻真心诚意一再邀请或拜访。" },
  { q: "____壁借光", a: "囊", full: "囊萤映雪", cat: "历史", exp: "形容刻苦学习。" },
  { q: "____梅竹马", a: "青", full: "青梅竹马", cat: "情感", exp: "形容男女小时候天真无邪地在一起玩耍。" },
  { q: "____深情厚", a: "情", full: "情深似海", cat: "情感", exp: "形容感情深厚。" },
  { q: "____不宁", a: "忐忑", full: "忐忑不安", cat: "情感", exp: "形容心神不安。" },
  { q: "____碎念", a: "唠", full: "唠唠叨叨", cat: "情感", exp: "说起来没完，形容说话啰嗦。" }
];

let cur = null;
let answered = 0;
let correct = 0;

function pickQuestion() {
  const cats = Array.from(document.querySelectorAll('.catFilter:checked')).map(c => c.value);
  const pool = QUESTIONS.filter(q => cats.includes(q.cat));
  if (!pool.length) return null;
  let next;
  do { next = pool[Math.floor(Math.random() * pool.length)]; } while (next === cur && pool.length > 1);
  return next;
}

function renderQuestion() {
  cur = pickQuestion();
  if (!cur) {
    document.getElementById('questionArea').textContent = '请至少选择一个分类';
    return;
  }
  const display = cur.q.replace('____', ' ____ ');
  document.getElementById('questionArea').innerHTML = '<span style="opacity:0.65;font-size:0.85rem;">[' + cur.cat + '类]</span><br><br>' + display;
  document.getElementById('userAnswer').value = '';
  document.getElementById('result').style.display = 'none';
  document.getElementById('explanation').style.display = 'none';
}

function check() {
  if (!cur) return;
  const userAns = document.getElementById('userAnswer').value.trim();
  const result = document.getElementById('result');
  const ok = userAns === cur.full;
  result.style.display = '';
  result.style.background = ok ? '#dcfce7' : '#fee2e2';
  result.style.color = ok ? '#15803d' : '#b91c1c';
  result.innerHTML = ok
    ? '✅ 回答正确！成语是：<b>' + cur.full + '</b>'
    : '❌ 回答错误。你的答案：<b>' + userAns + '</b><br>正确答案：<b>' + cur.full + '</b>';
  answered++;
  if (ok) correct++;
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('correctCount').textContent = correct;
}

document.getElementById('newQuestion').addEventListener('click', renderQuestion);
document.getElementById('showAnswer').addEventListener('click', () => {
  if (!cur) return;
  const r = document.getElementById('result');
  r.style.display = '';
  r.style.background = '#dbeafe';
  r.style.color = '#1e40af';
  r.innerHTML = '💡 答案：<b>' + cur.full + '</b>';
});
document.getElementById('showExplanation').addEventListener('click', () => {
  if (!cur) return;
  const e = document.getElementById('explanation');
  e.style.display = '';
  e.innerHTML = '<b>📖 成语解释：</b><br>' + cur.exp;
});
document.getElementById('checkBtn').addEventListener('click', check);
document.getElementById('userAnswer').addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
document.querySelectorAll('.catFilter').forEach(c => c.addEventListener('change', renderQuestion));

renderQuestion();
  </script>
