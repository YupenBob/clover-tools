      "马":"CNY","猪":"QTFJ","羊":"UDY","狗":"TRQK","猫":"QTAL","鼠":"VNR","虎":"HAOU","龙":"DXV","蛇":"JPX","鸟":"QYNG"
    };
    var currentMode = '86';
    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.mode === mode);
      });
    }
    function convert() {
      var text = document.getElementById('input').value.trim();
      if (!text) { alert('请输入汉字'); return; }
      var chars = Array.from(text).filter(function(c) { return /[\u4e00-\u9fa5]/.test(c); });
      if (chars.length === 0) { alert('未找到汉字，请输入中文字符'); return; }
      var dedup = Array.from(new Set(chars));
      var found = 0, notFound = 0;
      var rows = '';
      var show86 = currentMode === '86' || currentMode === 'both';
      var show98 = currentMode === '98' || currentMode === 'both';
      dedup.forEach(function(c) {
        var w86 = WUBI86[c];
        var w98 = WUBI98[c];
        var has86 = !!w86, has98 = !!w98;
        if (has86 || has98) found++; else notFound++;
        var cell86 = has86 ? w86 : '<span class="not-found">暂未收录</span>';
        var cell98 = has98 ? w98 : '<span class="not-found">暂未收录</span>';
        rows += '<tr><td class="char-cell">' + c + '</td>';
        if (show86) rows += '<td style="font-family:monospace">' + cell86 + '</td>';
        if (show98) rows += '<td style="font-family:monospace">' + cell98 + '</td>';
        rows += '</tr>';
      });
      var header = '<tr><th>汉字</th>';
      if (show86) header += '<th>86 版五笔</th>';
      if (show98) header += '<th>98 版五笔</th>';
      header += '</tr>';
      document.getElementById('resultTable').innerHTML = header + rows;
      document.getElementById('resultCard').style.display = 'block';
      document.getElementById('stats').innerHTML =
        '共 <span>' + dedup.length + '</span> 个不重复汉字 · 收录 <span>' + found + '</span> 个 · 暂未收录 <span>' + notFound + '</span> 个';
    }
    function clearAll() {
      document.getElementById('input').value = '';
      document.getElementById('resultCard').style.display = 'none';
    }
    function copyResult() {
      var text = '';
      var rows = document.querySelectorAll('#resultTable tr');
      rows.forEach(function(r) {
        var cells = r.querySelectorAll('th, td');
        var arr = [];
        cells.forEach(function(c) { arr.push(c.textContent.trim()); });
        text += arr.join(' : ') + '\n';
      });
      navigator.clipboard.writeText(text).then(function() { alert('已复制到剪贴板'); });
    }
    window.setMode = setMode;
    window.convert = convert;
    window.clearAll = clearAll;
    window.copyResult = copyResult;
  </script>

  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
