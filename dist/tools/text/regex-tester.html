<div class="tool-card"><div class="breadcrumb">首页 / 文本处理 / 正则表达式测试器</div><h1 style="font-size:1.5rem;margin-bottom:.4rem">正则表达式测试器</h1><p style="color:var(--text-secondary);font-size:.9rem;margin-bottom:1.5rem">输入正则表达式，实时高亮显示所有匹配结果。</p><div class="tool-card"><h3>正则表达式</h3><input type="text" id="regexInput" placeholder="输入正则表达式，如 \d+ 或 [a-z]+" style="font-size:1.1rem"><div class="flags"><span style="font-size:.8rem;color:var(--text-secondary);margin-right:.3rem">标志:</span><button class="flag-btn active" id="flag-g" onclick="toggleFlag('g')">g 全局</button><button class="flag-btn active" id="flag-i" onclick="toggleFlag('i')">i 不区分大小写</button><button class="flag-btn" id="flag-m" onclick="toggleFlag('m')">m 多行</button><button class="flag-btn" id="flag-s" onclick="toggleFlag('s')">s dotAll</button></div><div id="regexError" style="color:#e74c3c;font-size:.82rem;margin-top:.4rem;display:none"></div></div><div class="tool-card"><h3>测试文本</h3><textarea id="testText" placeholder="输入需要匹配的测试文本..." oninput="runRegex()"></textarea><div style="display:flex;gap:.5rem;margin-top:.75rem"><button class="btn" onclick="runRegex()">测试匹配</button><button class="btn btn-secondary" onclick="clearAll()">清空</button></div></div><div class="tool-card"><h3>常用模板</h3><div class="templates"><button class="tpl-btn" onclick="setPattern('[\\w.-]+@[\\w.-]+\\.\\w+')">邮箱</button><button class="tpl-btn" onclick="setPattern('1[3-9]\\d{9}')">手机号</button><button class="tpl-btn" onclick="setPattern('https?://[\\w./%-]+')">URL</button><button class="tpl-btn" onclick="setPattern('\\d{4}-\\d{2}-\\d{2}')">日期</button><button class="tpl-btn" onclick="setPattern('\\d{1,3}(\\.\\d{1,3}){3}')">IP地址</button><button class="tpl-btn" onclick="setPattern('<[^>]+>')">HTML标签</button></div></div><div class="tool-card"><h3>匹配结果 <span id="matchCount" style="font-size:.85rem;color:var(--text-secondary);font-weight:400"></span></h3><div id="highlightedText" style="font-family:monospace;font-size:.88rem;white-space:pre-wrap;word-break:break-all;padding:.75rem;background:var(--result-bg);border-radius:8px;min-height:60px;line-height:1.6"></div><div id="matchList" style="margin-top:.75rem;display:grid;gap:.4rem"></div></div>
</div>

  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    (function(){
if(typeof CT==='undefined'){
document.querySelector('.navbar').innerHTML='<div class="nav-inner"><a href="/" class="nav-brand">CloverTools</a></div>';
document.querySelector('.footer').innerHTML='<div class="footer-inner">2026 <a href="/">CloverTools</a></div>';
}
var flags={g:true,i:true,m:false,s:false};
window.toggleFlag=function(f){
  flags[f]=!flags[f];
  document.getElementById('flag-'+f).classList.toggle('active',flags[f]);
  runRegex();
};
window.setPattern=function(p){
  document.getElementById('regexInput').value=p;
  runRegex();
};
window.runRegex=function(){
  var pat=document.getElementById('regexInput').value;
  var text=document.getElementById('testText').value;
  var errBox=document.getElementById('regexError');
  var outBox=document.getElementById('highlightedText');
  var countBox=document.getElementById('matchCount');
  var listBox=document.getElementById('matchList');
  if(!pat){
    errBox.style.display='none';
    outBox.textContent=text||'(无文本)';
    countBox.textContent='';
    listBox.innerHTML='';
    return;
  }
  var flagStr=(flags.g?'g':'')+(flags.i?'i':'')+(flags.m?'m':'')+(flags.s?'s':'');
  var re;
  try{re=new RegExp(pat,flagStr);}catch(e){
    errBox.textContent='正则错误: '+e.message;
    errBox.style.display='block';
    outBox.textContent=text||'(无文本)';
    countBox.textContent='';
    listBox.innerHTML='';
    return;
  }
  errBox.style.display='none';
  if(!text){
    outBox.textContent='(无文本)';
    countBox.textContent='';
    listBox.innerHTML='';
    return;
  }
  var matches=[];
  if(flags.g){
    var m;
    while((m=re.exec(text))!==null){
      matches.push({match:m[0],index:m.index,groups:m.slice(1)});
      if(m[0].length===0){re.lastIndex++;}
    }
  }else{
    var n=text.match(re);
    if(n){matches.push({match:n[0],index:text.search(re),groups:n.slice(1)});}
  }
  countBox.textContent='('+matches.length+' 个匹配)';
  var highlighted=text;
  matches.forEach(function(x){
    highlighted=highlighted.replace(x.match,'【'+x.match+'】');
  });
  outBox.innerHTML=escHtml(highlighted).replace(/【([^】]+)】/g,'<mark style="background:#c9a96e33;color:#c9a96e;padding:1px 4px;border-radius:4px;font-weight:600">$1</mark>');
  listBox.innerHTML=matches.map(function(x,i){
    return '<div style="background:var(--bg-secondary);padding:.5rem .75rem;border-radius:6px;font-family:monospace;font-size:.82rem"><b style="color:var(--primary)">'+(i+1)+'</b> <span style="color:#c9a96e">'+escHtml(x.match)+'</span> <span style="color:var(--text-secondary);font-size:.75rem">位置:'+x.index+'</span></div>'+(x.groups.length?'<div style="font-size:.75rem;color:var(--text-secondary);padding:2px 8px">捕获组: '+x.groups.map(function(g){return g||'(空)';}).join(', ')+'</div>':'');
  }).join('');
};
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
window.clearAll=function(){
  document.getElementById('regexInput').value='';
  document.getElementById('testText').value='';
  document.getElementById('highlightedText').textContent='(无文本)';
  document.getElementById('matchCount').textContent='';
  document.getElementById('matchList').innerHTML='';
  document.getElementById('regexError').style.display='none';
};
window.runRegex();
})();
  </script>
