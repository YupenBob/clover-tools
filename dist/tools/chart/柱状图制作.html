        <h1>柱状图制作</h1>

        <div class="tool-card">
  <h3>📊 数据输入</h3>
  <p style="opacity:0.75;font-size:0.9rem;margin:0.25rem 0 0.75rem;">每行一组：<code>标签,数值</code>（支持负数、小数）</p>
  <textarea id="dataInput" rows="6" style="width:100%;font-family:monospace;" placeholder="一月,120&#10;二月,98&#10;三月,150&#10;四月,170&#10;五月,135">一月,120
二月,98
三月,150
四月,170
五月,135
六月,200</textarea>

  <h3 style="margin-top:1.25rem;">🎨 样式设置</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0.75rem;">
    <label>图表标题
      <input id="chartTitle" type="text" value="月度销售数据" style="width:100%;">
    </label>
    <label>X 轴标签
      <input id="xLabel" type="text" value="月份" style="width:100%;">
    </label>
    <label>Y 轴标签
      <input id="yLabel" type="text" value="销量（万件）" style="width:100%;">
    </label>
    <label>柱体颜色
      <input id="barColor" type="color" value="#4f46e5" style="width:100%;height:2.5rem;">
    </label>
    <label>图例位置
      <select id="legendPos" style="width:100%;">
        <option value="top">顶部</option>
        <option value="bottom">底部</option>
        <option value="left">左侧</option>
        <option value="right">右侧</option>
        <option value="none">不显示</option>
      </select>
    </label>
    <label>横向柱图
      <select id="orientation" style="width:100%;">
        <option value="v">纵向</option>
        <option value="h">横向</option>
      </select>
    </label>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" id="renderBtn">生成柱状图</button>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <div id="toast"></div>

  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    let chartInstance = null;

function parseData() {
  const raw = document.getElementById('dataInput').value.trim();
  if (!raw) return { labels: [], values: [] };
  const lines = raw.split(/\r?\n/).filter(l => l.trim());
  const labels = [];
  const values = [];
  for (const line of lines) {
    const parts = line.split(/[,，\t]/);
    if (parts.length >= 2) {
      const label = parts[0].trim();
      const val = parseFloat(parts[1].trim());
      if (!isNaN(val)) {
        labels.push(label);
        values.push(val);
      }
    }
  }
  return { labels, values };
}

function renderChart() {
  const { labels, values } = parseData();
  if (!labels.length) {
    CT && CT.showToast ? CT.showToast('请输入有效数据') : alert('请输入有效数据');
    return;
  }
  const title = document.getElementById('chartTitle').value || '柱状图';
  const xLabel = document.getElementById('xLabel').value || '';
  const yLabel = document.getElementById('yLabel').value || '';
  const color = document.getElementById('barColor').value || '#4f46e5';
  const legendPos = document.getElementById('legendPos').value;
  const orientation = document.getElementById('orientation').value;

  const ctx = document.getElementById('chartCanvas').getContext('2d');
  if (chartInstance) chartInstance.destroy();

  const baseColor = color;
  const bgColors = values.map(v => v < 0 ? 'rgba(239,68,68,0.7)' : hexToRgba(baseColor, 0.75));
  const borderColors = values.map(v => v < 0 ? 'rgba(239,68,68,1)' : baseColor);

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: title,
        data: values,
        backgroundColor: bgColors,
        borderColor: borderColors,
        borderWidth: 2,
        borderRadius: 4,
      }],
    },
    options: {
      indexAxis: orientation === 'h' ? 'y' : 'x',
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        title: {
          display: true,
          text: title,
          font: { size: 18, weight: 'bold' },
          padding: { top: 8, bottom: 16 },
        },
        legend: {
          display: legendPos !== 'none',
          position: legendPos === 'none' ? 'top' : legendPos,
        },
        tooltip: {
          callbacks: {
            label: ctx => `${ctx.dataset.label || ''}: ${ctx.parsed[orientation === 'h' ? 'x' : 'y']}`,
          },
        },
      },
      scales: {
        x: {
          title: { display: !!xLabel, text: xLabel },
          beginAtZero: true,
        },
        y: {
          title: { display: !!yLabel, text: yLabel },
          beginAtZero: true,
        },
      },
    },
  });
}

function hexToRgba(hex, alpha) {
  const m = hex.replace('#', '').match(/.{2}/g);
  if (!m) return hex;
  const [r, g, b] = m.map(h => parseInt(h, 16));
  return `rgba(${r},${g},${b},${alpha})`;
}

function downloadPNG() {
  if (!chartInstance) {
    renderChart();
  }
  const canvas = document.getElementById('chartCanvas');
  const url = canvas.toDataURL('image/png');
  const a = document.createElement('a');
  a.href = url;
  a.download = (document.getElementById('chartTitle').value || 'chart') + '.png';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  if (CT && CT.showToast) CT.showToast('已下载 PNG');
}

function loadSample() {
  document.getElementById('dataInput').value = '一月,120\n二月,98\n三月,150\n四月,170\n五月,135\n六月,200\n七月,180\n八月,210';
  document.getElementById('chartTitle').value = '2026 年度销售数据';
  document.getElementById('xLabel').value = '月份';
  document.getElementById('yLabel').value = '销量（万件）';
  renderChart();
}

document.getElementById('renderBtn').addEventListener('click', renderChart);
document.getElementById('downloadBtn').addEventListener('click', downloadPNG);
document.getElementById('loadSample').addEventListener('click', loadSample);

// Auto-render on load with default data
window.addEventListener('load', () => {
  setTimeout(renderChart, 100);
});
  </script>
