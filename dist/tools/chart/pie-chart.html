    <script>
    // safe-innerHTML: 所有用户输入已通过 escapeHtml/escapeAttr/escapeXml 转义。
    // 静态/受约束数据（color picker / number input）已记录在审查报告。

    (function(){
        const PALETTE = ['#c9a96e','#5b8def','#3fb950','#f85149','#a371f7','#ffa657','#39c5cf','#db61a2','#bf6c2c','#7ee787','#79c0ff','#d2a8ff'];
        let data = [
            { label: '直接访问', value: 35, color: '#c9a96e' },
            { label: '搜索引擎', value: 28, color: '#5b8def' },
            { label: '社交媒体', value: 18, color: '#3fb950' },
            { label: '外部链接', value: 12, color: '#a371f7' },
            { label: '其他', value: 7, color: '#ffa657' }
        ];

        const dataList = document.getElementById('dataList');
        const chartCanvas = document.getElementById('chartCanvas');
        const ctx = chartCanvas.getContext('2d');
        const legendEl = document.getElementById('legend');
        const statusEl = document.getElementById('status');

        function renderDataList() {
            dataList.innerHTML = '';
            if (data.length === 0) {
                dataList.innerHTML = '<div class="empty-hint">暂无数据，点击"添加数据"开始</div>';
                return;
            }
            data.forEach((d, i) => {
                const row = document.createElement('div');
                row.className = 'data-row';
                row.innerHTML = ''
                    + '<input type="color" class="color-swatch" value="' + d.color + '" data-i="' + i + '" data-k="color">'
                    + '<input type="text" value="' + escapeAttr(d.label) + '" placeholder="标签" data-i="' + i + '" data-k="label">'
                    + '<input type="number" value="' + d.value + '" placeholder="值" min="0" step="any" data-i="' + i + '" data-k="value">'
                    + '<button class="del-btn" data-i="' + i + '" title="删除">×</button>';
                dataList.appendChild(row);
            });
        }

        function escapeAttr(s) {
            return String(s).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }

        function escapeXml(s) {
            return String(s).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&apos;' }[m];
            });
        }

        dataList.addEventListener('input', function(e) {
            const t = e.target;
            if (t.dataset && t.dataset.i !== undefined) {
                const i = +t.dataset.i;
                const k = t.dataset.k;
                if (t.type === 'color') data[i].color = t.value;
                else if (k === 'value') data[i].value = parseFloat(t.value) || 0;
                else data[i][k] = t.value;
                draw();
            }
        });
        dataList.addEventListener('click', function(e) {
            if (e.target.classList && e.target.classList.contains('del-btn')) {
                const i = +e.target.dataset.i;
                data.splice(i, 1);
                renderDataList();
                draw();
            }
        });

        document.getElementById('addRow').addEventListener('click', function() {
            const idx = data.length;
            data.push({ label: '类别' + (idx + 1), value: 10, color: PALETTE[idx % PALETTE.length] });
            renderDataList();
            draw();
        });

        document.getElementById('loadSample').addEventListener('click', function() {
            data = [
                { label: 'Chrome', value: 65, color: '#5b8def' },
                { label: 'Safari', value: 19, color: '#c9a96e' },
                { label: 'Firefox', value: 8, color: '#3fb950' },
                { label: 'Edge', value: 5, color: '#a371f7' },
                { label: '其他', value: 3, color: '#ffa657' }
            ];
            renderDataList();
            draw();
        });

        ['chartTitle','chartSize','startAngle','showLegend','showPercent','showLabel'].forEach(function(id) {
            const el = document.getElementById(id);
            el.addEventListener('input', draw);
            el.addEventListener('change', draw);
        });

        function draw() {
            const size = +document.getElementById('chartSize').value;
            const dpr = window.devicePixelRatio || 1;
            chartCanvas.width = size * dpr;
            chartCanvas.height = size * dpr;
            chartCanvas.style.width = size + 'px';
            chartCanvas.style.height = size + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.clearRect(0, 0, size, size);

            const validData = data.filter(function(d) { return d.value > 0; });
            const total = validData.reduce(function(s, d) { return s + d.value; }, 0);

            const title = document.getElementById('chartTitle').value;
            const titleOffset = title ? 24 : 0;
            if (title) {
                ctx.fillStyle = '#e0e0e0';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText(title, size / 2, 8);
            }

            if (total === 0) {
                ctx.fillStyle = '#6e7681';
                ctx.font = '14px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('请添加数据', size / 2, size / 2);
                renderLegend([], 0);
                return;
            }

            const cx = size / 2;
            const cy = (size / 2) + (title ? 4 : 0);
            const radius = Math.min(cx, cy - titleOffset / 2) - 20;
            const startAngleDeg = +document.getElementById('startAngle').value;
            let startAngle = (startAngleDeg - 90) * Math.PI / 180;
            const showPercent = document.getElementById('showPercent').checked;
            const showLabel = document.getElementById('showLabel').checked;

            validData.forEach(function(d) {
                const sliceAngle = (d.value / total) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = d.color;
                ctx.fill();
                ctx.strokeStyle = '#0d1117';
                ctx.lineWidth = 2;
                ctx.stroke();

                if (showPercent || showLabel) {
                    const midAngle = startAngle + sliceAngle / 2;
                    const percent = (d.value / total * 100);
                    const labelRadius = radius * 0.65;
                    const tx = cx + Math.cos(midAngle) * labelRadius;
                    const ty = cy + Math.sin(midAngle) * labelRadius;
                    ctx.fillStyle = '#fff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.font = 'bold 12px sans-serif';
                    let text = '';
                    if (showLabel && showPercent) text = d.label + ' ' + percent.toFixed(1) + '%';
                    else if (showLabel) text = d.label;
                    else text = percent.toFixed(1) + '%';
                    if (percent >= 4) ctx.fillText(text, tx, ty);
                }
                startAngle = endAngle;
            });
            renderLegend(validData, total);
        }

        function renderLegend(validData, total) {
            legendEl.innerHTML = '';
            if (!document.getElementById('showLegend').checked || validData.length === 0) return;
            validData.forEach(function(d) {
                const pct = total ? ((d.value / total) * 100).toFixed(1) + '%' : '';
                const item = document.createElement('div');
                item.className = 'legend-item';
                item.innerHTML = '<span class="legend-color" style="background:' + d.color + '"></span>' + escapeAttr(d.label) + ' (' + pct + ')';
                legendEl.appendChild(item);
            });
        }

        document.getElementById('exportPng').addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'pie-chart.png';
            link.href = chartCanvas.toDataURL('image/png');
            link.click();
            statusEl.textContent = '✅ PNG 已下载';
            setTimeout(function() { statusEl.textContent = ''; }, 3000);
        });

        document.getElementById('exportSvg').addEventListener('click', function() {
            const size = +document.getElementById('chartSize').value;
            const validData = data.filter(function(d) { return d.value > 0; });
            const total = validData.reduce(function(s, d) { return s + d.value; }, 0);
            if (total === 0) { statusEl.textContent = '❌ 暂无数据'; return; }
            const title = document.getElementById('chartTitle').value;
            const cx = size / 2, cy = size / 2, radius = Math.min(cx, cy) - 30;
            const startAngleDeg = +document.getElementById('startAngle').value;
            let startAngle = (startAngleDeg - 90) * Math.PI / 180;
            let svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '"><rect width="' + size + '" height="' + size + '" fill="#0d1117"/>';
            if (title) {
                svg += '<text x="' + (size/2) + '" y="22" text-anchor="middle" fill="#e0e0e0" font-size="16" font-weight="bold" font-family="sans-serif">' + escapeXml(title) + '</text>';
            }
            validData.forEach(function(d) {
                const sliceAngle = (d.value / total) * Math.PI * 2;
                const endAngle = startAngle + sliceAngle;
                const x1 = cx + Math.cos(startAngle) * radius;
                const y1 = cy + Math.sin(startAngle) * radius;
                const x2 = cx + Math.cos(endAngle) * radius;
                const y2 = cy + Math.sin(endAngle) * radius;
                const largeArc = sliceAngle > Math.PI ? 1 : 0;
                const path = 'M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + radius + ',' + radius + ' 0 ' + largeArc + ' 1 ' + x2 + ',' + y2 + ' Z';
                svg += '<path d="' + path + '" fill="' + d.color + '" stroke="#0d1117" stroke-width="2"/>';
                startAngle = endAngle;
            });
            svg += '</svg>';
            const blob = new Blob([svg], { type: 'image/svg+xml' });
            const link = document.createElement('a');
            link.download = 'pie-chart.svg';
            link.href = URL.createObjectURL(blob);
            link.click();
            statusEl.textContent = '✅ SVG 已下载';
            setTimeout(function() { statusEl.textContent = ''; }, 3000);
        });

        renderDataList();
        draw();
    })();
    </script>

  <script>
    CT.initTheme();
    CT.initReveal();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
