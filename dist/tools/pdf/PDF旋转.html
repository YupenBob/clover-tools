  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const meta = document.getElementById('meta');
const pageSettings = document.getElementById('pageSettings');
const pageGrid = document.getElementById('pageGrid');
const applyBtn = document.getElementById('applyBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');

let pdfDoc = null;
let pdfBytes = null;
let rotations = []; // degrees per page

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(1) + ' KB';
  return (b / 1024 / 1024).toFixed(2) + ' MB';
}

function renderPageGrid() {
  if (!pdfDoc) return;
  pageGrid.innerHTML = pdfDoc.map((_, i) => {
    const deg = rotations[i] || 0;
    return `
      <div style="border:1px solid var(--border);border-radius:6px;padding:.5rem;background:var(--bg-secondary);">
        <div style="font-size:.85rem;opacity:.7;margin-bottom:.25rem;">第 ${i + 1} 页</div>
        <select data-page="${i}" style="width:100%;padding:.25rem;">
          <option value="0" ${deg === 0 ? 'selected' : ''}>0°</option>
          <option value="90" ${deg === 90 ? 'selected' : ''}>90°</option>
          <option value="180" ${deg === 180 ? 'selected' : ''}>180°</option>
          <option value="270" ${deg === 270 ? 'selected' : ''}>270°</option>
        </select>
      </div>
    `;
  }).join('');
}

async function loadFile(file) {
  if (!file) return;
  if (!file.name.toLowerCase().endsWith('.pdf') && file.type !== 'application/pdf') {
    statusEl.textContent = '请选择 PDF 文件';
    return;
  }
  if (typeof PDFLib === 'undefined') {
    statusEl.textContent = '错误：PDFLib 未加载';
    return;
  }
  statusEl.textContent = '加载中...';
  try {
    pdfBytes = await file.arrayBuffer();
    pdfDoc = await PDFLib.PDFDocument.load(pdfBytes, { ignoreEncryption: true });
    rotations = new Array(pdfDoc.getPageCount()).fill(0);
    meta.style.display = '';
    meta.textContent = `文件：${escapeHtml(file.name)} · 大小：${fmtSize(file.size)} · 共 ${pdfDoc.getPageCount()} 页`;
    pageSettings.style.display = '';
    renderPageGrid();
    applyBtn.disabled = false;
    resetBtn.disabled = false;
    statusEl.textContent = `已加载 ${pdfDoc.getPageCount()} 页`;
  } catch (err) {
    statusEl.textContent = '加载失败：' + (err.message || err);
    console.error(err);
  }
}

fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) loadFile(f);
  fileInput.value = '';
});

['dragenter', 'dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.style.background = 'var(--bg-primary)'; })
);
['dragleave', 'drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.style.background = ''; })
);
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});

pageGrid.addEventListener('change', e => {
  const sel = e.target;
  if (sel.tagName !== 'SELECT') return;
  const i = parseInt(sel.dataset.page, 10);
  rotations[i] = parseInt(sel.value, 10);
});

document.querySelectorAll('[data-bulk]').forEach(btn => {
  btn.addEventListener('click', () => {
    const deg = parseInt(btn.dataset.bulk, 10);
    rotations = rotations.map(() => deg);
    renderPageGrid();
  });
});

resetBtn.addEventListener('click', () => {
  rotations = rotations.map(() => 0);
  renderPageGrid();
});

async function applyRotation() {
  if (!pdfDoc) return;
  statusEl.textContent = '处理中...';
  applyBtn.disabled = true;
  try {
    const out = await PDFLib.PDFDocument.create();
    const pages = await out.copyPages(pdfDoc, pdfDoc.getPageIndices());
    pages.forEach((p, i) => {
      const current = p.getRotation().angle || 0;
      const total = (current + (rotations[i] || 0)) % 360;
      p.setRotation(PDFLib.degrees(total));
      out.addPage(p);
    });
    const bytes = await out.save();
    const blob = new Blob([bytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `rotated_${Date.now()}.pdf`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    statusEl.textContent = `✅ 完成！输出 ${(bytes.length / 1024).toFixed(1)} KB`;
    if (CT && CT.showToast) CT.showToast('已下载旋转后的 PDF');
  } catch (err) {
    statusEl.textContent = '❌ 失败：' + (err.message || err);
    console.error(err);
  } finally {
    applyBtn.disabled = false;
  }
}

applyBtn.addEventListener('click', applyRotation);
  </script>
