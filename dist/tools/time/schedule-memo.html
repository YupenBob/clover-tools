  <script>
    // safe-innerHTML: 用户输入已通过 escapeHtml/escapeAttr/escapeXml 转义。

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
      });
    }
    function escapeAttr(s) { return escapeHtml(s); }

    var STORAGE_KEY = 'clovertools_memos';
    var memos = [];
    var currentView = 'list';
    var viewDate = new Date();
    function loadMemos() {
      try {
        var data = localStorage.getItem(STORAGE_KEY);
        memos = data ? JSON.parse(data) : [];
      } catch(e) { memos = []; }
    }
    function saveMemos() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(memos)); } catch(e) {}
    }
    function addMemo() {
      var t = document.getElementById('fTitle').value.trim();
      var d = document.getElementById('fDate').value;
      var c = document.getElementById('fCategory').value;
      var p = document.getElementById('fPriority').value;
      var content = document.getElementById('fContent').value.trim();
      if (!t) { alert('请输入标题'); return; }
      memos.push({
        id: Date.now() + Math.random(),
        title: t, date: d, category: c, priority: p,
        content: content, completed: false,
        createdAt: new Date().toISOString()
      });
      saveMemos();
      clearForm();
      render();
    }
    function clearForm() {
      document.getElementById('fTitle').value = '';
      document.getElementById('fDate').value = '';
      document.getElementById('fContent').value = '';
      document.getElementById('fPriority').value = 'medium';
    }
    function deleteMemo(id) {
      if (!confirm('确认删除？')) return;
      memos = memos.filter(function(m){ return m.id !== id; });
      saveMemos();
      render();
    }
    function toggleComplete(id) {
      var m = memos.find(function(x){ return x.id === id; });
      if (m) m.completed = !m.completed;
      saveMemos();
      render();
    }
    function setView(v) {
      currentView = v;
      document.querySelectorAll('.view-tab').forEach(function(t) {
        t.classList.toggle('active', t.dataset.view === v);
      });
      document.getElementById('filterRow').style.display = v === 'list' ? 'flex' : 'none';
      render();
    }
    function getFiltered() {
      var q = document.getElementById('searchInput').value.toLowerCase();
      var cat = document.getElementById('filterCategory').value;
      var pri = document.getElementById('filterPriority').value;
      var st = document.getElementById('filterStatus').value;
      return memos.filter(function(m) {
        if (q && (m.title + m.content).toLowerCase().indexOf(q) === -1) return false;
        if (cat && m.category !== cat) return false;
        if (pri && m.priority !== pri) return false;
        if (st === 'active' && m.completed) return false;
        if (st === 'completed' && !m.completed) return false;
        return true;
      });
    }
    function renderStats(total) {
      var active = memos.filter(function(m){ return !m.completed; }).length;
      var done = memos.filter(function(m){ return m.completed; }).length;
      var high = memos.filter(function(m){ return !m.completed && m.priority === 'high'; }).length;
      document.getElementById('statsRow').innerHTML =
        '<div class="stat-box"><div class="num">' + total + '</div><div class="lbl">显示</div></div>' +
        '<div class="stat-box"><div class="num">' + active + '</div><div class="lbl">未完成</div></div>' +
        '<div class="stat-box"><div class="num">' + done + '</div><div class="lbl">已完成</div></div>' +
        '<div class="stat-box"><div class="num">' + high + '</div><div class="lbl">高优先级</div></div>';
    }
    function renderList() {
      var list = getFiltered();
      renderStats(list.length);
      if (list.length === 0) {
        document.getElementById('memoContainer').innerHTML = '<div class="empty">暂无事项，点击上方添加 ✨</div>';
        return;
      }
      list.sort(function(a,b){
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        var pOrder = {high:0, medium:1, low:2};
        if (pOrder[a.priority] !== pOrder[b.priority]) return pOrder[a.priority] - pOrder[b.priority];
        return (a.date || '').localeCompare(b.date || '');
      });
      var html = '<div class="memo-list">';
      list.forEach(function(m) {
        var pl = {high:'高', medium:'中', low:'低'}[m.priority];
        html += '<div class="memo-item priority-' + m.priority + (m.completed ? ' completed' : '') + '">' +
          '<div class="memo-header">' +
            '<div class="memo-title">' + esc(m.title) + '</div>' +
            '<div class="memo-actions">' +
              '<button onclick="toggleComplete(' + m.id + ')">' + (m.completed ? '↺ 撤销' : '✓ 完成') + '</button>' +
              '<button class="danger" onclick="deleteMemo(' + m.id + ')">删除</button>' +
            '</div>' +
          '</div>' +
          '<div class="memo-meta">' +
            (m.date ? '<span>📅 ' + m.date + '</span>' : '') +
            '<span class="badge badge-category">' + esc(m.category) + '</span>' +
            '<span class="badge badge-priority-' + m.priority + '">' + pl + '优先级</span>' +
          '</div>' +
          (m.content ? '<div class="memo-content">' + esc(m.content) + '</div>' : '') +
        '</div>';
      });
      html += '</div>';
      document.getElementById('memoContainer').innerHTML = html;
    }
    function renderWeek() {
      var today = new Date();
      var dow = today.getDay();
      var monday = new Date(today);
      monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));
      monday.setHours(0,0,0,0);
      var dayNames = ['一','二','三','四','五','六','日'];
      var html = '<div class="month-nav"><button onclick="viewDate.setDate(viewDate.getDate()-7);render()">← 上周</button><div class="title">' + monday.getFullYear() + ' 第' + Math.ceil(((monday - new Date(monday.getFullYear(),0,1)) / 86400000 + 1) / 7) + '周</div><button onclick="viewDate.setDate(viewDate.getDate()+7);render()">下周 →</button></div>';
      html += '<div class="week-grid">';
      for (var i = 0; i < 7; i++) {
        var d = new Date(monday);
        d.setDate(monday.getDate() + i);
        var ds = d.toISOString().slice(0,10);
        var dayMemos = memos.filter(function(m){ return m.date === ds; });
        var isToday = ds === today.toISOString().slice(0,10);
        html += '<div class="week-day' + (isToday ? ' today' : '') + '" style="' + (isToday ? 'border-color:var(--accent)' : '') + '">' +
          '<div class="day-name">周' + dayNames[i] + '</div>' +
          '<div class="day-date">' + d.getMonth()+1 + '/' + d.getDate() + '</div>';
        dayMemos.forEach(function(m){
          html += '<div class="item-tag" title="' + esc(m.title) + '">' + esc(m.title) + '</div>';
        });
        html += '</div>';
      }
      html += '</div>';
      renderStats(memos.length);
      document.getElementById('memoContainer').innerHTML = html;
    }
    function renderMonth() {
      var y = viewDate.getFullYear();
      var m = viewDate.getMonth();
      var today = new Date().toISOString().slice(0,10);
      var first = new Date(y, m, 1);
      var last = new Date(y, m + 1, 0);
      var startDow = (first.getDay() + 6) % 7;
      var html = '<div class="month-nav"><button onclick="viewDate.setMonth(viewDate.getMonth()-1);render()">← 上月</button><div class="title">' + y + ' 年 ' + (m+1) + ' 月</div><button onclick="viewDate.setMonth(viewDate.getMonth()+1);render()">下月 →</button></div>';
      html += '<div class="month-grid">';
      ['一','二','三','四','五','六','日'].forEach(function(n){
        html += '<div class="day-h">' + n + '</div>';
      });
      for (var i = 0; i < startDow; i++) html += '<div class="day"></div>';
      for (var d = 1; d <= last.getDate(); d++) {
        var ds = y + '-' + String(m+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
        var dayMemos = memos.filter(function(x){ return x.date === ds; });
        var isToday = ds === today;
        html += '<div class="day' + (isToday ? ' today' : '') + '">' +
          '<div class="num">' + d + '</div>' +
          (dayMemos.length > 0 ? '<div class="count">' + dayMemos.length + ' 件</div>' : '') +
        '</div>';
      }
      html += '</div>';
      renderStats(memos.length);
      document.getElementById('memoContainer').innerHTML = html;
    }
    function render() {
      if (currentView === 'list') renderList();
      else if (currentView === 'week') renderWeek();
      else renderMonth();
    }
    function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function exportData() {
      var blob = new Blob([JSON.stringify(memos, null, 2)], {type: 'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'memos-' + new Date().toISOString().slice(0,10) + '.json';
      a.click();
      URL.revokeObjectURL(url);
    }
    function importData(e) {
      var f = e.target.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function(ev) {
        try {
          var data = JSON.parse(ev.target.result);
          if (Array.isArray(data)) {
            memos = memos.concat(data);
            saveMemos();
            render();
            alert('导入成功，新增 ' + data.length + ' 条');
          }
        } catch(err) { alert('文件格式错误'); }
      };
      r.readAsText(f);
    }
    function clearAll() {
      if (!confirm('确认清空所有事项？此操作不可恢复')) return;
      memos = [];
      saveMemos();
      render();
    }
    loadMemos();
    document.getElementById('fDate').value = new Date().toISOString().slice(0,10);
    render();
    window.addMemo = addMemo;
    window.clearForm = clearForm;
    window.deleteMemo = deleteMemo;
    window.toggleComplete = toggleComplete;
    window.setView = setView;
    window.exportData = exportData;
    window.importData = importData;
    window.clearAll = clearAll;
  </script>

  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
