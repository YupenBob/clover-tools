  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    // 单位 -> 秒 (近似换算)
const UNITS = [
  { key: 'ms',  name: '毫秒 (ms)',     sec: 0.001 },
  { key: 's',   name: '秒 (s)',        sec: 1 },
  { key: 'min', name: '分钟 (min)',    sec: 60 },
  { key: 'h',   name: '小时 (h)',      sec: 3600 },
  { key: 'd',   name: '天 (d)',        sec: 86400 },
  { key: 'wk',  name: '周 (wk)',       sec: 86400 * 7 },
  { key: 'mo',  name: '月 (mo,30.44天)', sec: 86400 * 30.44 },
  { key: 'yr',  name: '年 (yr,365.25天)', sec: 86400 * 365.25 },
  { key: 'dec', name: '十年 (dec)',    sec: 86400 * 365.25 * 10 },
  { key: 'cen', name: '世纪 (cen)',    sec: 86400 * 365.25 * 100 },
];

const fromSel = document.getElementById('fromUnit');
const inputVal = document.getElementById('inputVal');
const output = document.getElementById('output');
UNITS.forEach(u => {
  const o = document.createElement('option'); o.value = u.key; o.textContent = u.name;
  fromSel.appendChild(o);
});
fromSel.value = 'h'; inputVal.value = 1;

function calc() {
  const v = parseFloat(inputVal.value);
  const from = fromSel.value;
  const fromUnit = UNITS.find(u => u.key === from);
  if (!fromUnit || isNaN(v)) { output.innerHTML = '<div style="opacity:0.6;padding:1rem;text-align:center;">请输入有效数值</div>'; return; }
  const totalSec = v * fromUnit.sec;
  output.innerHTML = UNITS.map(u => {
    const converted = totalSec / u.sec;
    let display;
    if (Math.abs(converted) >= 1e6 || (converted !== 0 && Math.abs(converted) < 0.001)) {
      display = converted.toExponential(4);
    } else {
      display = converted.toLocaleString('en-US', { maximumFractionDigits: 6 });
    }
    const isCurrent = u.key === from;
    return '<div style="display:flex;justify-content:space-between;padding:0.3rem 0.6rem;border-radius:6px;background:' + (isCurrent ? 'rgba(99,102,241,0.1)' : 'transparent') + ';">'
      + '<span style="opacity:0.75;">' + u.name + '</span>'
      + '<span style="font-weight:600;color:' + (isCurrent ? 'var(--primary)' : 'var(--text)') + ';">' + display + '</span>'
      + '</div>';
  }).join('');
}

[inputVal, fromSel].forEach(el => el.addEventListener('input', calc));
document.getElementById('copyOutput').onclick = () => copyToClipboard(output.innerText);
calc();
  </script>
