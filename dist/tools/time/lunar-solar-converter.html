    (function(){
var info=[19416,32896,33536,34880,38960,45024,55968,60352,63424,69904,72320,97280,106272,105632,113760,123200,120960,132720,120000,111440,110880,112400,110880,102760,92160,108160,120720,104800,114080,115984,109760,123136,122400,121600,128160];
function lunarYearDays(y){var d=info[y-1900]>>12&15?30:29;for(var i=1;i<=(info[y-1900]>>12&15);i++)d+=info[y-1900]>>(12-i)&1?30:29;return d;}
function fmtLunar(y,m,d){var mN=["正","二","三","四","五","六","七","八","九","十","冬","腊"];var dN=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];return y+"年"+mN[m-1]+"月"+dN[d-1];}
function convert(){
var s=document.getElementById("solarDate").value;
if(!s)return;
var parts=s.split("-");
var y=parseInt(parts[0]),m=parseInt(parts[1])-1,d=parseInt(parts[2]);
var off=new Date(y,m,d)-new Date(1900,0,31);
var days=Math.floor(off/86400000),ly=1900,lm=0;
while(ly<2100&&days>lunarYearDays(ly)){days-=lunarYearDays(ly++);}
var leap=(info[ly-1900]>>16)&15;
for(lm=1;lm<13&&days>0;lm++){var md=leap&&lm===leap+1?30:(info[ly-1900]>>(12-lm)&1)?30:29;if(days<md)break;days-=md;}
if(lm===leap+1)leap=0;
document.getElementById("result").innerHTML=fmtLunar(ly,lm,days+1);
}
window.convert=convert;
})();
