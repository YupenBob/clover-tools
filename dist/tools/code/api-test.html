        <div class="tool-card">
<div class="tool-wrapper"><div class="req-row"><select class="method-select" id="method"><option value="GET">GET</option><option value="POST">POST</option><option value="PUT">PUT</option><option value="DELETE">DELETE</option><option value="PATCH">PATCH</option></select><input class="url-input" id="urlInput" type="text" value="https://jsonplaceholder.typicode.com/posts/1" placeholder="https://api.example.com/endpoint"><button class="send-btn" id="sendBtn">发送请求</button></div><div class="section"><div class="section-title">Headers (每行一个，格式: Key: Value)</div><textarea class="req-headers" id="headersInput" placeholder="Content-Type: application/json&#10;Authorization: Bearer token"></textarea></div><div class="section" id="bodySection"><div class="section-title">Request Body</div><textarea class="req-body" id="bodyInput" placeholder='{"key": "value"}'></textarea></div><div class="res-area" id="resArea" style="display:none;"><div class="res-status"><span class="status-code" id="statusCode"></span><span class="res-time" id="resTime"></span></div><div class="res-body" id="resBody"></div></div><div class="loading" id="loading" style="display:none;">请求中...</div>
</div>

  <div id="toast"></div>

  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var methodSel=document.getElementById('method');var urlInput=document.getElementById('urlInput');var headersInput=document.getElementById('headersInput');var bodyInput=document.getElementById('bodyInput');var sendBtn=document.getElementById('sendBtn');var resArea=document.getElementById('resArea');var loading=document.getElementById('loading');var statusCode=document.getElementById('statusCode');var resTime=document.getElementById('resTime');var resBody=document.getElementById('resBody');methodSel.addEventListener('change',function(){var m=methodSel.value;document.getElementById('bodySection').style.display=(m==='GET'||m==='DELETE')?'none':'block';});function parseHeaders(hdrStr){var headers={};if(!hdrStr)return headers;hdrStr.split('\n').forEach(function(line){var idx=line.indexOf(':');if(idx>0){var key=line.substring(0,idx).trim();var val=line.substring(idx+1).trim();headers[key]=val;}});return headers;}function fmtTime(ms){if(ms<1000)return ms+'ms';return(ms/1000).toFixed(2)+'s';}function fmtJson(str){try{var obj=JSON.parse(str);return JSON.stringify(obj,null,2);}catch(e){return str;}}function getStatusClass(code){if(code>=200&&code<300)return'status-ok';if(code>=300&&code<400)return'status-redirect';return'status-error';}function escHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function sendReq(){var url=urlInput.value.trim();if(!url){if(window.CT&&CT.showToast)CT.showToast('请输入URL');return;}if(!url.startsWith('http://')&&!url.startsWith('https://'))url='https://'+url;var method=methodSel.value;var headers=parseHeaders(headersInput.value);var body=method!=='GET'&&method!=='DELETE'?bodyInput.value:null;if(!headers['Content-Type']&&body)headers['Content-Type']='application/json';var startTime=Date.now();sendBtn.disabled=true;sendBtn.textContent='请求中...';loading.style.display='block';resArea.style.display='none';fetch(url,{method:method,headers:headers,body:body}).then(function(res){var ms=Date.now()-startTime;var cls=getStatusClass(res.status);statusCode.innerHTML='<span class="'+cls+'">'+res.status+' '+res.statusText+'</span>';resTime.textContent='耗时: '+fmtTime(ms);var h=[];res.headers.forEach(function(v,k){h.push(escHtml(k)+': '+escHtml(v));});resBody.innerHTML='<pre style="white-space:pre-wrap;word-break:break-all;">'+fmtJson(res.responseText)+'</pre>';loading.style.display='none';resArea.style.display='block';sendBtn.disabled=false;sendBtn.textContent='发送请求';}).catch(function(e){loading.style.display='none';resArea.style.display='block';resBody.innerHTML='<div style="color:#ef4444;">请求失败: '+escHtml(e.message)+'</div>';sendBtn.disabled=false;sendBtn.textContent='发送请求';});}sendBtn.onclick=sendReq;document.getElementById('bodyInput').addEventListener('keydown',function(e){if(e.ctrlKey&&e.key==='Enter')sendReq();});
  </script>
