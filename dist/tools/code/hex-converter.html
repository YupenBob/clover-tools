    var input=document.getElementById('input');var output=document.getElementById('output');function updateStats(){document.getElementById('inputStats').textContent=input.value.length+' 字符';document.getElementById('outputStats').textContent=output.value.length+' 字符';}function toHex(){if(!input.value){output.value='';updateStats();return;}var hex='';for(var i=0;i<input.value.length;i++){hex+=input.value.charCodeAt(i).toString(16).padStart(2,'0')+' ';}output.value=hex.trim().toUpperCase();updateStats();}function fromHex(){var text=input.value.replace(/\s/g,'');if(!/^[0-9a-fA-F]+$/.test(text)||text.length%2!==0){output.value='错误: 请输入有效的偶数位十六进制字符';return;}var result='';for(var i=0;i<text.length;i+=2){result+=String.fromCharCode(parseInt(text.substr(i,2),16));}output.value=result;updateStats();}document.getElementById('toHex').onclick=toHex;document.getElementById('fromHex').onclick=fromHex;document.getElementById('copyOutput').onclick=function(){navigator.clipboard.writeText(output.value);};document.getElementById('clearInput').onclick=function(){input.value='';output.value='';updateStats();input.focus();};input.addEventListener('input',updateStats);updateStats();
