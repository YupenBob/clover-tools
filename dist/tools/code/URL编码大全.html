      <div class="tool-header">
        <h1>URL 编码大全</h1>
        <p class="description">在线 URL 编码解码工具，支持 encodeURI/encodeURIComponent 两种模式，可批量按行处理与一键交换输入输出。</p>
      </div>
      <div class="tool-layout ">
        <div class="tool-card">
  <h3>URL 编码 / 解码</h3>
  <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem;flex-wrap:wrap;">
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;">
      <input type="radio" name="mode" value="encode" checked /> 编码
    </label>
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;">
      <input type="radio" name="mode" value="decode" /> 解码
    </label>
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;margin-left:1rem;">
      <input type="checkbox" id="useComponent" checked /> 用 encodeURIComponent
    </label>
    <label style="display:flex;align-items:center;gap:0.4rem;font-size:0.9rem;">
      <input type="checkbox" id="batchMode" /> 批量（按行）
    </label>
  </div>
  <div>
    <label style="font-size:0.85rem;opacity:0.7;display:block;margin-bottom:0.3rem;">输入</label>
    <textarea id="input" rows="5" placeholder="输入要编码或解码的文本..." style="width:100%;padding:0.75rem;border-radius:10px;border:1px solid var(--border);font-size:0.95rem;background:var(--bg-secondary);color:var(--text);font-family:monospace;resize:vertical;"></textarea>
  </div>
  <div style="display:flex;gap:0.5rem;margin-top:0.5rem;flex-wrap:wrap;">
    <button class="btn btn-primary" id="runBtn" style="padding:0.5rem 1.2rem;">▶ 执行</button>
    <button class="btn" id="swapBtn" style="padding:0.5rem 1.2rem;background:var(--bg-secondary);border:1px solid var(--border);">↕ 交换</button>
    <button class="btn" id="clearBtn" style="padding:0.5rem 1.2rem;background:var(--bg-secondary);border:1px solid var(--border);">清空</button>
  </div>
  <div style="font-size:0.8rem;opacity:0.75;line-height:1.6;background:var(--bg-secondary);padding:0.6rem 0.8rem;border-radius:8px;margin-top:0.75rem;">
    💡 <b>encodeURIComponent</b> 编码所有非字母数字与 <code>-_.~!*'()</code> 字符；<b>encodeURI</b> 保留 <code>;/?:@&=+$,#</b> 等 URL 保留字符。批量模式按行独立处理。
  </div>
</div>
<div class="output-box">
  <h3>输出 <button class="copy-btn" id="copyOutput">复制</button></h3>
  <textarea id="output" rows="5" readonly style="width:100%;padding:0.75rem;border-radius:10px;border:1px solid var(--border);font-size:0.95rem;background:var(--bg-secondary);color:var(--text);font-family:monospace;resize:vertical;"></textarea>

  <div id="toast"></div>

  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    const inputEl = document.getElementById('input');
const outputEl = document.getElementById('output');
const statsEl = document.getElementById('stats');
const useComponent = document.getElementById('useComponent');
const batchMode = document.getElementById('batchMode');
const runBtn = document.getElementById('runBtn');
const swapBtn = document.getElementById('swapBtn');
const clearBtn = document.getElementById('clearBtn');

inputEl.value = 'https://example.com/search?q=你好 世界&type=前端';

function getMode() {
  return document.querySelector('input[name="mode"]:checked').value;
}

function run() {
  try {
    const mode = getMode();
    const text = inputEl.value;
    if (batchMode.checked) {
      const lines = text.split(/\r?\n/);
      const out = lines.map(line => {
        if (line === '') return '';
        if (mode === 'encode') {
          return useComponent.checked ? encodeURIComponent(line) : encodeURI(line);
        } else {
          return useComponent.checked ? decodeURIComponent(line) : decodeURI(line);
        }
      });
      outputEl.value = out.join('\n');
      statsEl.textContent = '批量处理 ' + lines.length + ' 行 | 模式：' + (mode === 'encode' ? (useComponent.checked ? 'encodeURIComponent' : 'encodeURI') : (useComponent.checked ? 'decodeURIComponent' : 'decodeURI'));
    } else {
      if (mode === 'encode') {
        outputEl.value = useComponent.checked ? encodeURIComponent(text) : encodeURI(text);
        statsEl.textContent = '模式：' + (useComponent.checked ? 'encodeURIComponent' : 'encodeURI') + ' | 输入 ' + text.length + ' 字符 → 输出 ' + outputEl.value.length + ' 字符';
      } else {
        outputEl.value = useComponent.checked ? decodeURIComponent(text) : decodeURI(text);
        statsEl.textContent = '模式：' + (useComponent.checked ? 'decodeURIComponent' : 'decodeURI') + ' | 输入 ' + text.length + ' 字符 → 输出 ' + outputEl.value.length + ' 字符';
      }
    }
  } catch (e) {
    outputEl.value = '❌ 错误：' + (e && e.message ? e.message : e) + '\n（提示：解码时若包含未编码的非法序列会抛 URIError）';
    statsEl.textContent = '';
  }
}

runBtn.addEventListener('click', run);
inputEl.addEventListener('input', run);
[useComponent, batchMode].forEach(el => el.addEventListener('change', run));
document.querySelectorAll('input[name="mode"]').forEach(el => el.addEventListener('change', run));
swapBtn.addEventListener('click', () => {
  const a = inputEl.value; inputEl.value = outputEl.value; outputEl.value = a;
  const m = document.querySelector('input[name="mode"]:checked');
  document.querySelector('input[name="mode"][value="' + (m.value === 'encode' ? 'decode' : 'encode') + '"]').checked = true;
  run();
});
clearBtn.addEventListener('click', () => { inputEl.value = ''; outputEl.value = ''; statsEl.textContent = ''; });
document.getElementById('copyOutput').onclick = () => copyToClipboard(outputEl.value);
run();
  </script>
