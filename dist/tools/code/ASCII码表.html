  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    const charInput = document.getElementById('charInput');
const decInput = document.getElementById('decInput');
const charInfo = document.getElementById('charInfo');
const tableWrap = document.getElementById('tableWrap');
const filter = document.getElementById('filter');
const showAll = document.getElementById('showAll');
const outputEl = document.getElementById('output');

const DESCRIPTIONS = {
  0: 'NUL (空字符)', 1: 'SOH (标题开始)', 2: 'STX (正文开始)', 3: 'ETX (正文结束)',
  4: 'EOT (传输结束)', 5: 'ENQ (询问)', 6: 'ACK (确认)', 7: 'BEL (响铃)',
  8: 'BS  (退格)', 9: 'HT  (水平制表 \\t)', 10: 'LF  (换行 \\n)', 11: 'VT  (垂直制表)',
  12: 'FF  (换页)', 13: 'CR  (回车 \\r)', 14: 'SO  (移出)', 15: 'SI  (移入)',
  16: 'DLE (数据链路转义)', 17: 'DC1 (设备控制 1)', 18: 'DC2 (设备控制 2)', 19: 'DC3 (设备控制 3)',
  20: 'DC4 (设备控制 4)', 21: 'NAK (否定应答)', 22: 'SYN (同步空闲)', 23: 'ETB (传输块结束)',
  24: 'CAN (取消)', 25: 'EM  (介质结束)', 26: 'SUB (替换)', 27: 'ESC (转义)',
  28: 'FS  (文件分隔)', 29: 'GS  (组分隔)', 30: 'RS  (记录分隔)', 31: 'US  (单元分隔)',
  32: 'SPACE (空格)', 127: 'DEL (删除)'
};

function charLabel(code) {
  if (code === 32) return "' '";
  if (code === 127) return 'DEL';
  if (code < 32) return DESCRIPTIONS[code] || '(控制字符)';
  return "'" + String.fromCharCode(code) + "'";
}

function renderInfo(code) {
  if (code === null || isNaN(code) || code < 0 || code > 127) {
    charInfo.innerHTML = '<span style="opacity:0.6;">请输入有效字符或 0-127 的十进制数字</span>';
    return;
  }
  const c = String.fromCharCode(code);
  const desc = DESCRIPTIONS[code] || (code >= 33 && code <= 126 ? '可打印字符' : '');
  const bin = code.toString(2).padStart(8, '0');
  charInfo.innerHTML =
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:0.5rem;">' +
    '<div><b>字符：</b><code style="background:var(--bg);padding:2px 6px;border-radius:4px;font-size:1.05rem;">' + (code < 32 || code === 127 ? charLabel(code) : c) + '</code></div>' +
    '<div><b>描述：</b>' + desc + '</div>' +
    '<div><b>十进制：</b>' + code + '</div>' +
    '<div><b>十六进制：</b>0x' + code.toString(16).toUpperCase().padStart(2, '0') + '</div>' +
    '<div><b>八进制：</b>0' + code.toString(8) + '</div>' +
    '<div><b>二进制：</b>' + bin + '</div>' +
    '<div><b>Unicode：</b>U+' + code.toString(16).toUpperCase().padStart(4, '0') + '</div>' +
    '<div><b>JS 转义：</b>\\u' + code.toString(16).padStart(4, '0') + '</div>' +
    '</div>';
}

function renderTable() {
  const f = filter.value.trim().toLowerCase();
  const range = showAll.checked ? [0, 127] : [32, 126];
  let html = '<table style="width:100%;border-collapse:collapse;font-size:0.85rem;font-family:monospace;">';
  html += '<thead style="position:sticky;top:0;background:var(--bg);z-index:1;"><tr>' +
    '<th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);">Dec</th>' +
    '<th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);">Hex</th>' +
    '<th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);">Oct</th>' +
    '<th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);">Bin</th>' +
    '<th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);">Char</th>' +
    '<th style="padding:6px;text-align:left;border-bottom:1px solid var(--border);">描述</th>' +
    '</tr></thead><tbody>';
  let rows = [];
  for (let i = range[0]; i <= range[1]; i++) {
    let display = i >= 32 && i !== 127 ? String.fromCharCode(i) : '';
    let desc = DESCRIPTIONS[i] || '';
    const blob = (i + '|' + i.toString(16) + '|' + i.toString(8) + '|' + i.toString(2) + '|' + display + '|' + desc).toLowerCase();
    if (f && blob.indexOf(f) === -1) continue;
    rows.push('<tr style="cursor:pointer;" data-code="' + i + '">' +
      '<td style="padding:5px 8px;border-bottom:1px solid var(--border);">' + i + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid var(--border);">' + i.toString(16).toUpperCase().padStart(2, '0') + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid var(--border);">' + i.toString(8) + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid var(--border);color:var(--primary);">' + i.toString(2).padStart(8, '0') + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid var(--border);font-weight:600;">' + (display || '<span style="opacity:0.4;">·</span>') + '</td>' +
      '<td style="padding:5px 8px;border-bottom:1px solid var(--border);opacity:0.75;">' + (desc || '可打印') + '</td>' +
      '</tr>');
  }
  html += rows.join('');
  html += '</tbody></table>';
  if (rows.length === 0) {
    html = '<div style="padding:1.5rem;text-align:center;opacity:0.6;">没有匹配的项</div>';
  }
  tableWrap.innerHTML = html;
  // Click to fill input
  tableWrap.querySelectorAll('tr[data-code]').forEach(tr => {
    tr.addEventListener('click', () => {
      const code = parseInt(tr.getAttribute('data-code'), 10);
      decInput.value = code;
      charInput.value = code >= 32 && code !== 127 ? String.fromCharCode(code) : '';
      renderInfo(code);
    });
  });
}

function onCharInput() {
  const v = charInput.value;
  if (v.length === 0) { renderInfo(null); return; }
  const code = v.charCodeAt(0);
  if (code > 127) {
    charInfo.innerHTML = '<span style="color:#ef4444;">⚠️ 字符 "' + v + '" 超出 ASCII 范围 (0-127)，其 Unicode 为 U+' + code.toString(16).toUpperCase() + '</span>';
    return;
  }
  decInput.value = code;
  renderInfo(code);
}

function onDecInput() {
  const v = parseInt(decInput.value, 10);
  if (isNaN(v)) { renderInfo(null); return; }
  if (v < 0 || v > 127) {
    charInfo.innerHTML = '<span style="color:#ef4444;">⚠️ ASCII 仅支持 0-127</span>';
    return;
  }
  charInput.value = v >= 32 && v !== 127 ? String.fromCharCode(v) : '';
  renderInfo(v);
}

charInput.addEventListener('input', onCharInput);
decInput.addEventListener('input', onDecInput);
filter.addEventListener('input', renderTable);
showAll.addEventListener('change', renderTable);

document.getElementById('copyOutput').onclick = () => {
  // Copy current table as text
  const lines = ['Dec\tHex\tOct\tBin\tChar\t描述'];
  const range = showAll.checked ? [0, 127] : [32, 126];
  for (let i = range[0]; i <= range[1]; i++) {
    const c = i >= 32 && i !== 127 ? String.fromCharCode(i) : '';
    const desc = DESCRIPTIONS[i] || '可打印';
    lines.push([i, i.toString(16).toUpperCase().padStart(2, '0'), i.toString(8), i.toString(2).padStart(8, '0'), c, desc].join('\t'));
  }
  copyToClipboard(lines.join('\n'));
};

charInput.value = 'A';
onCharInput();
renderTable();
  </script>
</body>
