  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var runBtn=document.getElementById('runBtn');var results=document.getElementById('results');var extraBox=document.getElementById('extraBox');var extra=document.getElementById('extra');function colorFor(value,thresholds){if(value<=thresholds[0])return '#22c55e';if(value<=thresholds[1])return '#f59e0b';return '#ef4444';}function score(v,t){if(v<=t[0])return '优秀';if(v<=t[1])return '一般';return '差';}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}runBtn.onclick=function(){runBtn.disabled=true;runBtn.textContent='测量中...';results.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:1rem;">⏳ 正在采集性能数据,请稍候...</div>';setTimeout(function(){measure();},100);};function measure(){var fcp=null,lcp=null,cls=0;var lcpObserver=new PerformanceObserver(function(list){var entries=list.getEntries();lcp=entries[entries.length-1];});lcpObserver.observe({type:'largest-contentful-paint',buffered:true});var clsObserver=new PerformanceObserver(function(list){for(var i=0;i<list.getEntries().length;i++){if(!list.getEntries()[i].hadRecentInput)cls+=list.getEntries()[i].value;}});clsObserver.observe({type:'layout-shift',buffered:true});var navTiming=performance.getEntriesByType('navigation')[0];var paintEntries=performance.getEntriesByType('paint');var fcpEntry=paintEntries.find(function(p){return p.name==='first-contentful-paint';});fcp=fcpEntry?fcpEntry.startTime:null;setTimeout(function(){lcpObserver.disconnect();clsObserver.disconnect();var lcpVal=lcp?lcp.startTime:null;var cards=[];if(fcp!==null){var c=colorFor(fcp,[1800,3000]);cards.push({name:'FCP',desc:'首次内容绘制',value:fcp.toFixed(0)+' ms',score:score(fcp,[1800,3000]),color:c,thresholds:['< 1800 优秀','< 3000 一般']});}if(lcpVal!==null){var c=colorFor(lcpVal,[2500,4000]);cards.push({name:'LCP',desc:'最大内容绘制',value:lcpVal.toFixed(0)+' ms',score:score(lcpVal,[2500,4000]),color:c,thresholds:['< 2500 优秀','< 4000 一般']});}var c=colorFor(cls,[0.1,0.25]);cards.push({name:'CLS',desc:'累计布局偏移',value:cls.toFixed(3),score:score(cls,[0.1,0.25]),color:c,thresholds:['< 0.1 优秀','< 0.25 一般']});if(navTiming){var ttfb=navTiming.responseStart-navTiming.requestStart;var c=colorFor(ttfb,[800,1800]);cards.push({name:'TTFB',desc:'首字节时间',value:ttfb.toFixed(0)+' ms',score:score(ttfb,[800,1800]),color:c,thresholds:['< 800 优秀','< 1800 一般']});var domContent=navTiming.domContentLoadedEventEnd-navTiming.startTime;cards.push({name:'DCL',desc:'DOM 内容加载',value:domContent.toFixed(0)+' ms',score:'-',color:'#3b82f6',thresholds:['信息项']});var loadTime=navTiming.loadEventEnd-navTiming.startTime;cards.push({name:'Load',desc:'完整加载时间',value:loadTime.toFixed(0)+' ms',score:'-',color:'#3b82f6',thresholds:['信息项']});}results.innerHTML=cards.map(function(c){return '<div style="background:var(--bg-secondary);padding:1rem;border-radius:8px;border-left:4px solid '+c.color+';"><div style="font-size:0.8rem;opacity:0.7;">'+c.name+'</div><div style="font-size:1.6rem;font-weight:700;color:'+c.color+';margin:0.3rem 0;">'+c.value+'</div><div style="font-size:0.75rem;opacity:0.8;">'+c.desc+'</div><div style="font-size:0.75rem;margin-top:0.3rem;color:'+c.color+';font-weight:600;">'+c.score+'</div><div style="font-size:0.7rem;opacity:0.5;margin-top:0.2rem;">'+c.thresholds[0]+'</div></div>';}).join('');extra.innerHTML='<b>URL:</b> '+esc(location.href)+'<br><b>用户代理:</b> '+esc(navigator.userAgent.slice(0,100))+'...<br><b>屏幕:</b> '+screen.width+'x'+screen.height+'<br><b>连接:</b> '+(navigator.connection?esc(navigator.connection.effectiveType):'未知')+'<br><b>内存:</b> '+(navigator.deviceMemory?navigator.deviceMemory+' GB':'未知');extraBox.style.display='block';runBtn.disabled=false;runBtn.textContent='重新测量';},2000);}
