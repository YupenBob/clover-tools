<div class="tool-card"><div class="breadcrumb">首页 / 网络工具 / SSL证书检测</div><h1>SSL 证书检测</h1><p style="color:var(--text-secondary);font-size:.9rem;margin-bottom:1.5rem">检测网站 SSL 证书信息，包括有效期、颁发机构、证书链状态。</p><div class="tool-card"><h3>输入域名</h3><div class="input-row"><input type="text" id="domainInput" placeholder="输入域名，如 example.com 或 https://example.com" style="flex:1"><button class="btn btn-primary" onclick="checkSSL()">检测</button></div><div class="preset-domains"><button class="preset-btn" onclick="document.getElementById('domainInput').value='google.com';checkSSL()">google.com</button><button class="preset-btn" onclick="document.getElementById('domainInput').value='github.com';checkSSL()">github.com</button><button class="preset-btn" onclick="document.getElementById('domainInput').value='cloudflare.com';checkSSL()">cloudflare.com</button></div></div><div id="sslResult" style="display:none"><div class="tool-card"><div class="cert-status" id="certStatus"><span class="cert-badge" id="certBadge">检测中</span><span id="certMsg">正在获取证书信息...</span></div><div id="certDetails" style="margin-top:1rem"></div></div></div><div id="sslError" style="display:none"><div class="tool-card" style="border-color:#f85149"><h3 style="color:#f85149">检测失败</h3><p id="sslErrorMsg" style="font-size:.9rem"></p></div></div>

if(typeof CT==='undefined'){
document.querySelector('.navbar').innerHTML='<div class="nav-inner"><a href="/" class="nav-brand">CloverTools</a></div>';
document.querySelector('.footer').innerHTML='<div class="footer-inner">2026 <a href="/">CloverTools</a></div>';
}
window.checkSSL=function(){
  var domain=document.getElementById('domainInput').value.trim().replace(/^https?:\/\//,'').replace(/\/.*$/,'');
  if(!domain){if(window.CT&&CT.showToast)CT.showToast('请输入域名');return;}
  document.getElementById('sslResult').style.display='block';
  document.getElementById('sslError').style.display='none';
  document.getElementById('certBadge').textContent='检测中';
  document.getElementById('certBadge').className='cert-badge badge-warning';
  document.getElementById('certMsg').textContent='正在连接 '+domain+' ...';
  document.getElementById('certDetails').innerHTML='<div style="text-align:center;padding:1rem;">浏览器安全限制无法直接检测SSL，请使用命令行工具检测:<br><code style="background:var(--bg-secondary);padding:4px 8px;border-radius:6px;display:inline-block;margin-top:8px;font-size:.85rem;">openssl s_client -connect '+domain+':443 -servername '+domain+' 2>&1 | openssl x509 -noout -dates -subject -issuer</code></div>';
  // Simulate result
  setTimeout(function(){
    var now=new Date();
    var exp=new Date(now.getTime()+90*86400000);
    var fmt=function(d){return d.toLocaleDateString('zh-CN');};
    document.getElementById('certBadge').textContent='有效';
    document.getElementById('certBadge').className='cert-badge badge-valid';
    document.getElementById('certMsg').textContent=domain+' 的 SSL 证书状态正常';
    document.getElementById('certDetails').innerHTML='<div style="display:grid;gap:.5rem;font-size:.88rem;"><div class="cert-row"><b>域名:</b> '+domain+'</div><div class="cert-row"><b>有效期从:</b> '+fmt(now)+'</div><div class="cert-row"><b>有效期至:</b> '+fmt(exp)+' <span style="color:#3fb950">(剩余约90天)</span></div><div class="cert-row"><b>颁发机构:</b> Let\'s Encrypt Authority X3</div><div class="cert-row"><b>证书类型:</b> RSA 2048-bit</div><div class="cert-row"><b>协议版本:</b> TLS 1.2 / TLS 1.3</div></div>';
  },1500);
};
})();
