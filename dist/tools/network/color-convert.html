m===\'rgb\'){var m=v.match(/\\d+/g);if(!m||m.length<3)return\'无效 RGB 值\';rgb=m.map(Number);}else if(from===\'hsl\'){var m=v.match(/\\d+/g);if(!m||m.length<3)return\'无效 HSL 值\';rgb=hsl2rgb(Number(m[0]),Number(m[1]),Number(m[2]));}else if(from===\'hsv\'){var m=v.match(/\\d+/g);if(!m||m.length<3)return\'无效 HSV 值\';rgb=hsv2rgb(Number(m[0]),Number(m[1]),Number(m[2]));}if(to===\'hex\')return r2h(rgb[0],rgb[1],rgb[2]);if(to===\'rgb\')return\'rgb(\'+rgb[0]+\', \'+rgb[1]+\', \'+rgb[2]+\')\';if(to===\'hsl\'){var h=r2hsl(rgb[0],rgb[1],rgb[2]);return\'hsl(\'+h[0]+\', \'+h[1]+\'%, \'+h[2]+\'%)\';}if(to===\'hsv\'){var h=r2hsv(rgb[0],rgb[1],rgb[2]);return\'hsv(\'+h[0]+\', \'+h[1]+\'%, \'+h[2]+\'%)\';}}';
