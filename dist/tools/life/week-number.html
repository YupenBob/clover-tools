  <script>
    CT.initTheme();
    CT.initReveal();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    function isoWeek(date){var d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));var dayNum=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-dayNum);var yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return{year:d.getUTCFullYear(),week:Math.ceil((((d-yearStart)/86400000)+1)/7)};}function isoWeekStart(year,week){var simple=new Date(year,0,1+((week-1)*7));var dow=simple.getDay();var ISOweekStart=simple;if(dow<=4)ISOweekStart.setDate(simple.getDate()-simple.getDay()+1);else ISOweekStart.setDate(simple.getDate()+8-simple.getDay());return ISOweekStart;}function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}var dateInput=document.getElementById('dateInput');var calcBtn=document.getElementById('calcBtn');var dateResult=document.getElementById('dateResult');var dateOut=document.getElementById('dateOut');var yearInput=document.getElementById('yearInput');var weekInput=document.getElementById('weekInput');var reverseBtn=document.getElementById('reverseBtn');var weekResult=document.getElementById('weekResult');dateInput.value=fmt(new Date());calcBtn.onclick=function(){var d=new Date(dateInput.value);if(isNaN(d.getTime())){if(window.CT&&CT.showToast)CT.showToast('请选择有效日期');return;}var w=isoWeek(d);var start=new Date(d);var day=d.getDay()||7;start.setDate(d.getDate()-day+1);var end=new Date(start);end.setDate(start.getDate()+6);dateOut.innerHTML='<b>日期:</b> '+esc(fmt(d))+' ('+['日','一','二','三','四','五','六'][d.getDay()]+')<br><b>ISO 周数:</b> 第 '+w.week+' 周<br><b>ISO 年份:</b> '+w.year+'<br><b>本周范围:</b> '+esc(fmt(start))+' ~ '+esc(fmt(end))+'<br><b>本年第几天:</b> '+Math.ceil((d-new Date(d.getFullYear(),0,1))/86400000);dateResult.style.display='block';};reverseBtn.onclick=function(){var y=parseInt(yearInput.value),w=parseInt(weekInput.value);if(!y||!w||w<1||w>53){if(window.CT&&CT.showToast)CT.showToast('请输入有效年份和周数 (1-53)');return;}var start=isoWeekStart(y,w);var end=new Date(start);end.setDate(start.getDate()+6);weekResult.innerHTML='<div style="padding:0.5rem;background:var(--bg-secondary);border-radius:6px;"><b>第 '+w+' 周</b> ('+y+' 年):<br>'+esc(fmt(start))+' (周一) ~ '+esc(fmt(end))+' (周日)</div>';};
