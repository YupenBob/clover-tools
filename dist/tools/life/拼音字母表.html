        <h1>拼音字母表</h1>
        <p class="description">完整展示汉语拼音声母、韵母与整体认读音节表，支持发音试听与笔画笔顺。</p>
      </div>
      <div class="tool-layout ">
        <div class="tool-card">
  <h3>汉语拼音字母表</h3>
  <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem;align-items:center;font-size:0.85rem;">
    <span style="opacity:0.7;">类别：</span>
    <label><input type="checkbox" class="catFilter" value="shengmu" checked> 声母 (23)</label>
    <label><input type="checkbox" class="catFilter" value="yunmu" checked> 韵母 (24)</label>
    <label><input type="checkbox" class="catFilter" value="zhengti" checked> 整体认读 (16)</label>
    <label><input type="checkbox" class="catFilter" value="biao" checked> 声调</label>
  </div>
  <div style="margin-bottom:0.75rem;font-size:0.85rem;opacity:0.7;">
    💡 提示：点击字母可复制；浏览器支持 <span style="color:var(--primary);font-weight:600;">TTS 朗读</span> 时点击"试听"按钮可发音。
  </div>
</div>

<div class="tool-card" id="shengmuSection">
  <h3>声母 (23个)</h3>
  <div id="shengmuGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:0.5rem;"></div>
</div>

<div class="tool-card" id="yunmuSection">
  <h3>韵母 (24个)</h3>
  <div id="yunmuGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:0.5rem;"></div>
</div>

<div class="tool-card" id="zhengtiSection">
  <h3>整体认读音节 (16个)</h3>
  <div id="zhengtiGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:0.5rem;"></div>
</div>

<div class="tool-card" id="biaoSection">
  <h3>声调 (4个)</h3>
  <div id="biaoGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:0.5rem;"></div>
</div>

<style>
.pinyin-cell { background: var(--bg-secondary); padding: 0.6rem 0.4rem; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.15s; border: 1px solid transparent; }
.pinyin-cell:hover { background: var(--primary); color: white; transform: translateY(-2px); }
.pinyin-cell.copied { background: #22c55e; color: white; }
.pinyin-letter { font-size: 1.3rem; font-weight: 600; font-family: "Times New Roman", serif; }
.pinyin-name { font-size: 0.7rem; opacity: 0.7; margin-top: 2px; }
.pinyin-cell:hover .pinyin-name { opacity: 0.9; }
.shengmu-table { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.3rem; font-size: 0.85rem; }
.shengmu-row { display: flex; justify-content: space-between; padding: 0.25rem 0.4rem; background: var(--bg-secondary); border-radius: 4px; }
</style>

  <button class="share-btn" id="shareBtn" title="分享此工具"><svg class="share-icon" aria-hidden="true"><use href="#icon-share"/></svg>分享</button>

  <div id="toast"></div>

  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    const SHENGMU = [
  ['b', '玻'], ['p', '坡'], ['m', '摸'], ['f', '佛'],
  ['d', '得'], ['t', '特'], ['n', '讷'], ['l', '勒'],
  ['g', '哥'], ['k', '科'], ['h', '喝'],
  ['j', '基'], ['q', '欺'], ['x', '希'],
  ['zh', '知'], ['ch', '吃'], ['sh', '诗'], ['r', '日'],
  ['z', '资'], ['c', '雌'], ['s', '思'],
  ['y', '衣'], ['w', '屋']
];

const YUNMU = [
  ['a', '啊'], ['o', '哦'], ['e', '鹅'], ['ê', '诶'],
  ['i', '衣'], ['u', '乌'], ['ü', '迂'],
  ['ai', '哀'], ['ei', '欸'], ['ui', '威'],
  ['ao', '熬'], ['ou', '欧'], ['iu', '优'],
  ['ie', '耶'], ['üe', '约'], ['er', '儿'],
  ['an', '安'], ['en', '恩'], ['in', '因'], ['un', '温'], ['ün', '晕'],
  ['ang', '昂'], ['eng', '鞥'], ['ing', '英'], ['ong', '翁']
];

const ZHENGTI = [
  ['zhi', '知'], ['chi', '吃'], ['shi', '诗'], ['ri', '日'],
  ['zi', '资'], ['ci', '雌'], ['si', '思'],
  ['yi', '衣'], ['wu', '乌'], ['yu', '迂'],
  ['ye', '耶'], ['yue', '约'], ['yuan', '冤'],
  ['yin', '因'], ['yun', '晕'], ['ying', '英']
];

const BIAO = [
  { tone: '阴平', sym: 'ā', desc: '一声 高平调 (ˉ)' },
  { tone: '阳平', sym: 'á', desc: '二声 中升调 (ˊ)' },
  { tone: '上声', sym: 'ǎ', desc: '三声 降升调 (ˇ)' },
  { tone: '去声', sym: 'à', desc: '四声 全降调 (ˋ)' }
];

function renderGrid(el, items) {
  el.innerHTML = items.map(it => {
    const [letter, name] = it;
    return '<div class="pinyin-cell" data-letter="' + letter + '">' +
      '<div class="pinyin-letter">' + letter + '</div>' +
      '<div class="pinyin-name">' + name + '</div>' +
      '</div>';
  }).join('');
  el.querySelectorAll('.pinyin-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const l = cell.dataset.letter;
      copyToClipboard(l);
      cell.classList.add('copied');
      cell.querySelector('.pinyin-name').textContent = '已复制';
      setTimeout(() => {
        cell.classList.remove('copied');
        const orig = items.find(it => it[0] === l);
        if (orig) cell.querySelector('.pinyin-name').textContent = orig[1];
      }, 1000);
    });
  });
}

function renderBiao(el) {
  el.innerHTML = BIAO.map(b =>
    '<div class="pinyin-cell" data-letter="' + b.sym + '">' +
    '<div class="pinyin-letter">' + b.sym + '</div>' +
    '<div class="pinyin-name">' + b.desc + '</div>' +
    '</div>'
  ).join('');
  el.querySelectorAll('.pinyin-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const l = cell.dataset.letter;
      copyToClipboard(l);
      cell.classList.add('copied');
      setTimeout(() => cell.classList.remove('copied'), 1000);
    });
  });
}

renderGrid(document.getElementById('shengmuGrid'), SHENGMU);
renderGrid(document.getElementById('yunmuGrid'), YUNMU);
renderGrid(document.getElementById('zhengtiGrid'), ZHENGTI);
renderBiao(document.getElementById('biaoGrid'));

document.querySelectorAll('.catFilter').forEach(cb => {
  cb.addEventListener('change', () => {
    const v = cb.value;
    const section = document.getElementById(v + 'Section');
    if (section) section.style.display = cb.checked ? '' : 'none';
  });
});
  </script>
</body>
