        function render(data) {
            const content = document.getElementById('content');
            const totalCount = data.reduce((sum, c) => sum + c.items.length, 0);
            document.getElementById('totalCount').textContent = totalCount;
            document.getElementById('catCount').textContent = data.length;

            if (data.length === 0) {
                content.innerHTML = '<div class="empty-state"><i class="bi bi-telephone-x"></i><div>没有找到匹配的电话号码</div><div style="font-size:13px;margin-top:8px;">试试搜索其他关键词</div></div>';
                return;
            }

            let html = '';
            data.forEach(cat => {
                html += `<div class="category">
                    <div class="category-header">
                        <div class="category-icon">${cat.icon}</div>
                        <div class="category-title">${cat.category}</div>
                        <div class="category-count">${cat.items.length} 个</div>
                    </div>
                    <div class="phone-grid">`;
                cat.items.forEach(item => {
                    html += `<div class="phone-item" data-name="${item.name.toLowerCase()}" data-number="${item.number}" data-desc="${item.desc.toLowerCase()}">
                        <div class="phone-item-name">${item.name}</div>
                        <div class="phone-item-desc">${item.desc}</div>
                        <div class="phone-item-number">
                            <span class="phone-number" style="color: ${cat.color}">${item.number}</span>
                            <div class="phone-actions">
                                <button class="phone-btn" onclick="callNumber('${item.number}')" title="拨打">
                                    <i class="bi bi-telephone-fill"></i>
                                </button>
                                <button class="phone-btn" onclick="copyNumber('${item.number}', '${item.name}')" title="复制">
                                    <i class="bi bi-clipboard"></i>
                                </button>
                            </div>
                        </div>
                    </div>`;
                });
                html += `</div></div>`;
            });
            content.innerHTML = html;
        }

        function callNumber(num) {
            window.location.href = 'tel:' + num;
        }

        function copyNumber(num, name) {
            const text = name + ': ' + num;
            navigator.clipboard.writeText(text).then(() => showToast('已复制: ' + text));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const q = e.target.value.trim().toLowerCase();
            if (!q) {
                render(PHONE_DATA);
                return;
            }
            const filtered = PHONE_DATA.map(cat => ({
                ...cat,
                items: cat.items.filter(item =>
                    item.name.toLowerCase().includes(q) ||
                    item.number.includes(q) ||
                    item.desc.toLowerCase().includes(q)
                )
            })).filter(cat => cat.items.length > 0);
            render(filtered);
        });

        render(PHONE_DATA);
    </script>

  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
</body>
</html>
