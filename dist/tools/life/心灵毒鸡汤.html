    const SOUPS = [

  { text: "你以为的爱情，最后都会变成亲情；你以为的亲情，最后都会变成老死不相往来。", cat: "love" },
  { text: "上不去的工资，下不完的房贷，还有一直涨不涨的工资。", cat: "money" },
  { text: "你的存款余额比我暗恋的人还少。", cat: "money" },
  { text: "小明总说自己不喜欢钱，结果他银行账户密码从来不让别人看。", cat: "money" },
  { text: "不要总熬夜，对手机不好。", cat: "life" },
  { text: "喜欢一个人就去表白吧，万一她瞎了呢。", cat: "love" },
  { text: "你说你会变好，但你连早起都做不到。", cat: "study" },
  { text: "你以为的学习是看书眼酸，他人的学习是家族遗传的智商。", cat: "study" },
  { text: "三百六十行，行行出状元——但你不一定是状元。", cat: "work" },

  { text: "你连自己的身材都管理不好，凭什么相信你能管理好人生？", cat: "life" },
  { text: "你喜欢的人不喜欢你，喜欢你的人你不喜欢。", cat: "love" },
  { text: "你拼命合群的样子，真的很孤独。", cat: "life" },
  { text: "别熬夜了，对手机不好——而你，已经不重要了。", cat: "life" },

  { text: "别再问你为什么这么努力还没有结果，因为你努力的方向不对——你也知道。", cat: "exist" },
  { text: "你以为早起是自律，其实是你昨晚不该刷手机的。", cat: "life" },
  { text: "你羡慕别人的生活，却不知道他们也在羡慕你——你有什么好羡慕的？", cat: "life" }
];

let currentSoup = '';
let history = [];

function pick() {
  const cat = document.querySelector('input[name="cat"]:checked').value;
  const pool = cat === 'all' ? SOUPS : SOUPS.filter(s => s.cat === cat);
  let next;
  do { next = pool[Math.floor(Math.random() * pool.length)]; } while (next === currentSoup && pool.length > 1);
  return next;
}

function render() {
  const soup = pick();
  if (!soup) {
    document.getElementById('soup').textContent = '该分类暂无内容';
    return;
  }
  currentSoup = soup;
  document.getElementById('soup').innerHTML = soup.text + '<br><span style="font-size:0.8rem;opacity:0.6;display:block;margin-top:0.75rem;">[' + soup.cat + ']</span>';
  if (history[0] !== soup.text) {
    history.unshift(soup.text);
    if (history.length > 30) history = history.slice(0, 30);
    renderHistory();
  }
}

function renderHistory() {
  const el = document.getElementById('history');
  if (!history.length) {
    el.innerHTML = '<div style="text-align:center;opacity:0.5;padding:1rem;font-size:0.85rem;">暂无记录</div>';
    return;
  }
  el.innerHTML = history.map((h, i) =>
    '<div style="padding:0.5rem;border-bottom:1px solid var(--border);font-size:0.9rem;display:flex;justify-content:space-between;gap:0.5rem;align-items:start;">' +
    '<span style="flex:1;">' + (i + 1) + '. ' + h + '</span>' +
    '<button class="btn btn-secondary" data-copy="' + i + '" style="font-size:0.75rem;padding:0.2rem 0.5rem;">复制</button>' +
    '</div>'
  ).join('');
  el.querySelectorAll('[data-copy]').forEach(btn => {
    btn.addEventListener('click', () => {
      copyToClipboard(history[parseInt(btn.dataset.copy)]);
    });
  });
}

document.getElementById('nextBtn').addEventListener('click', render);
document.getElementById('copyBtn').addEventListener('click', () => {
  if (currentSoup) copyToClipboard(currentSoup.text);
});
document.getElementById('shareBtn').addEventListener('click', () => {
  if (currentSoup) {
    const shareText = currentSoup.text + '

— 来自 🍀 CloverTools 心灵砒霜';
    copyToClipboard(shareText);
  }
});
document.getElementById('clearHist').addEventListener('click', () => {
  history = [];
  renderHistory();
});

render();
  </script>
