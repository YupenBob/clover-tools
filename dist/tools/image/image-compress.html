<script>
let fileItems = []; // {file, originalSize, compressedBlob, compressedSize, outputName, preview}

const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const configCard = document.getElementById('configCard');
const resultCard = document.getElementById('resultCard');
const status = document.getElementById('status');
const fileList = document.getElementById('fileList');
const qualityInput = document.getElementById('quality');
const qualityVal = document.getElementById('qualityVal');

function showStatus(type, msg) { status.className = 'status ' + type; status.textContent = msg; status.style.display = 'block'; }
function clearStatus() { status.style.display = 'none'; status.textContent = ''; }
function formatSize(b) { if (b < 1024) return b + ' B'; if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB'; return (b/1024/1024).toFixed(2) + ' MB'; }

qualityInput.addEventListener('input', () => { qualityVal.textContent = qualityInput.value; });

fileInput.addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    if (files.length) addFiles(files);
});
['dragover','dragenter'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--border)'; }));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.style.borderColor = 'var(--border)';
    const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
    if (files.length) addFiles(files);
});

function addFiles(files) {
    files.forEach(f => {
        if (!f.type.startsWith('image/')) return;
        fileItems.push({ file: f, originalSize: f.size, compressedBlob: null, compressedSize: 0, outputName: '', preview: null });
    });
    configCard.classList.remove('hidden');
    updateFileList();
    if (fileItems.length > 0) {
        showStatus('success', `📁 已添加 ${fileItems.length} 个文件，点击「开始压缩」`);
    }
}

function updateFileList() {
    fileList.innerHTML = fileItems.map((it, i) => {
        const saved = it.compressedSize ? ((it.originalSize - it.compressedSize) / it.originalSize * 100).toFixed(1) : '';
        return `<div class="file-row">
            <div><strong>${it.file.name}</strong> <span class="meta">${formatSize(it.originalSize)} → ${it.compressedSize ? formatSize(it.compressedSize) : '—'}${saved ? ' (-' + saved + '%)' : ''}</span></div>
            <div>${it.compressedBlob ? `<a href="${it.preview}" download="${it.outputName}" style="color:var(--accent);text-decoration:none;"><i class="bi bi-download"></i> 下载</a>` : '<span class="meta">未压缩</span>'}</div>
        </div>`;
    }).join('');
    document.getElementById('downloadAllBtn').disabled = !fileItems.some(it => it.compressedBlob);
}

document.getElementById('compressBtn').onclick = async () => {
    if (!fileItems.length) return;
    document.getElementById('compressBtn').disabled = true;
    clearStatus();
    const format = document.getElementById('format').value;
    const quality = parseInt(qualityInput.value) / 100;
    const maxWidth = parseInt(document.getElementById('maxWidth').value) || 0;
    let done = 0;
    for (const it of fileItems) {
        try {
            const img = await loadImg(it.file);
            let w = img.naturalWidth, h = img.naturalHeight;
            if (maxWidth > 0 && w > maxWidth) { h = h * maxWidth / w; w = maxWidth; }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            // Fill white for JPEG transparency
            if ((format === 'image/jpeg' || (format === 'auto' && it.file.type === 'image/jpeg')) && it.file.type !== 'image/png') {
                ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
            }
            ctx.drawImage(img, 0, 0, w, h);
            const outType = format === 'auto' ? (it.file.type === 'image/png' ? 'image/png' : (it.file.type === 'image/webp' ? 'image/webp' : 'image/jpeg')) : format;
            const blob = await new Promise(r => canvas.toBlob(r, outType, quality));
            const ext = outType.split('/')[1].replace('jpeg','jpg');
            const baseName = it.file.name.replace(/\.[^.]+$/, '');
            it.compressedBlob = blob;
            it.compressedSize = blob.size;
            it.outputName = `${baseName}_compressed.${ext}`;
            it.preview = URL.createObjectURL(blob);
        } catch (e) {
            console.error('Compress failed:', e);
        }
        done++;
        updateFileList();
    }
    document.getElementById('compressBtn').disabled = false;
    resultCard.classList.remove('hidden');
    const totalOrig = fileItems.reduce((s, it) => s + it.originalSize, 0);
    const totalNew = fileItems.reduce((s, it) => s + (it.compressedSize || 0), 0);
    const totalSaved = totalOrig > 0 ? ((totalOrig - totalNew) / totalOrig * 100).toFixed(1) : 0;
    showStatus('success', `✅ 压缩完成，总计 ${formatSize(totalOrig)} → ${formatSize(totalNew)}（节省 ${totalSaved}%）`);
};

document.getElementById('downloadAllBtn').onclick = () => {
    fileItems.forEach((it, i) => {
        if (!it.compressedBlob) return;
        setTimeout(() => {
            const a = document.createElement('a');
            a.href = it.preview;
            a.download = it.outputName;
            a.click();
        }, i * 300);
    });
};

document.getElementById('resetBtn').onclick = () => {
    fileItems.forEach(it => { if (it.preview) URL.revokeObjectURL(it.preview); });
    fileItems = [];
    fileInput.value = '';
    configCard.classList.add('hidden');
    resultCard.classList.add('hidden');
    clearStatus();
};

function loadImg(file) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
    });
}
</script>

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
</body>
</html>
