<script>
let sourceImage = null;
let sourceFileName = 'image';
let splitBlobs = [];
let splitInfo = null;

const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const configCard = document.getElementById('configCard');
const previewCard = document.getElementById('previewCard');
const previewGrid = document.getElementById('previewGrid');
const status = document.getElementById('status');
const resultInfo = document.getElementById('resultInfo');

function showStatus(type, msg) {
    status.className = 'status ' + type;
    status.textContent = msg;
    status.style.display = 'block';
}
function clearStatus() { status.style.display = 'none'; status.textContent = ''; }

fileInput.addEventListener('change', (e) => {
    const f = e.target.files[0];
    if (f) loadImage(f);
});
['dragover','dragenter'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--border)'; }));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.style.borderColor = 'var(--border)';
    if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function loadImage(file) {
    if (!file.type.startsWith('image/')) { showStatus('error', '请选择图片文件'); return; }
    sourceFileName = file.name.replace(/\.[^.]+$/, '') || 'image';
    const reader = new FileReader();
    reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
            sourceImage = img;
            configCard.classList.remove('hidden');
            clearStatus();
            // Auto-split
            doSplit();
        };
        img.onerror = () => showStatus('error', '图片加载失败');
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

document.getElementById('preset').addEventListener('change', (e) => {
    const v = e.target.value;
    if (v === 'custom') return;
    const [r, c] = v.split('x').map(Number);
    document.getElementById('rows').value = r;
    document.getElementById('cols').value = c;
    if (sourceImage) doSplit();
});
['rows','cols','gap'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
        document.getElementById('preset').value = 'custom';
        if (sourceImage) doSplit();
    });
});

document.getElementById('splitBtn').onclick = doSplit;
document.getElementById('resetBtn').onclick = () => {
    sourceImage = null;
    fileInput.value = '';
    configCard.classList.add('hidden');
    previewCard.classList.add('hidden');
    clearStatus();
};

function doSplit() {
    if (!sourceImage) return;
    const rows = parseInt(document.getElementById('rows').value) || 1;
    const cols = parseInt(document.getElementById('cols').value) || 1;
    const gap = parseInt(document.getElementById('gap').value) || 0;
    if (rows < 1 || cols < 1) { showStatus('error', '行列数需大于0'); return; }
    if (rows > 10 || cols > 10) { showStatus('error', '行列数最多10'); return; }

    const W = sourceImage.naturalWidth;
    const H = sourceImage.naturalHeight;
    // Cell size: exclude gaps (each gap reduces total)
    const totalGapX = gap * (cols - 1);
    const totalGapY = gap * (rows - 1);
    const cellW = Math.floor((W - totalGapX) / cols);
    const cellH = Math.floor((H - totalGapY) / rows);
    if (cellW < 1 || cellH < 1) { showStatus('error', '图片尺寸不足以切分成 ' + rows + '×' + cols); return; }

    previewGrid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    previewGrid.innerHTML = '';
    splitBlobs = [];
    splitInfo = { rows, cols, gap, cellW, cellH };

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const sx = c * (cellW + gap);
            const sy = r * (cellH + gap);
            const canvas = document.createElement('canvas');
            canvas.width = cellW;
            canvas.height = cellH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(sourceImage, sx, sy, cellW, cellH, 0, 0, cellW, cellH);

            // Preview
            const cell = document.createElement('div');
            cell.className = 'preview-cell';
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/png');
            img.alt = `${r+1}-${c+1}`;
            cell.appendChild(img);
            previewGrid.appendChild(cell);

            splitBlobs.push({ blob: null, canvas, idx: r * cols + c + 1 });
        }
    }

    // Convert to blob async
    let pending = splitBlobs.length;
    splitBlobs.forEach(item => {
        item.canvas.toBlob(b => { item.blob = b; if (--pending === 0) finishSplit(); }, 'image/png');
    });
}

function finishSplit() {
    previewCard.classList.remove('hidden');
    document.getElementById('splitBtn').disabled = false;
    document.getElementById('downloadZipBtn').disabled = false;
    document.getElementById('downloadAllBtn').disabled = false;
    resultInfo.innerHTML = `<strong>${splitInfo.rows}×${splitInfo.cols}</strong> 网格，共 <strong>${splitBlobs.length}</strong> 张小图，每张 <strong>${splitInfo.cellW}×${splitInfo.cellH}</strong> px`;
    showStatus('success', `✅ 切图完成，共 ${splitBlobs.length} 张`);
}

document.getElementById('downloadZipBtn').onclick = async () => {
    if (splitBlobs.length === 0) return;
    // Use a tiny ZIP implementation (store-only, no compression)
    // For simplicity, just download individually if ZIP lib not available
    try {
        // Check JSZip availability
        if (window.JSZip) {
            const zip = new JSZip();
            for (const item of splitBlobs) {
                zip.file(`${sourceFileName}_${item.idx}.png`, item.blob);
            }
            const zipBlob = await zip.generateAsync({ type: 'blob' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(zipBlob);
            a.download = `${sourceFileName}_grid_${splitInfo.rows}x${splitInfo.cols}.zip`;
            a.click();
            URL.revokeObjectURL(a.href);
            showStatus('success', '📦 ZIP 下载已开始');
            return;
        }
    } catch (e) { /* fall through */ }
    // Fallback: trigger downloads one by one
    for (const item of splitBlobs) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(item.blob);
        a.download = `${sourceFileName}_${item.idx}.png`;
        a.click();
        await new Promise(r => setTimeout(r, 200));
        URL.revokeObjectURL(a.href);
    }
    showStatus('success', '💾 全部图片已下载');
};

document.getElementById('downloadAllBtn').onclick = () => {
    if (splitBlobs.length === 0) return;
    splitBlobs.forEach((item, i) => {
        setTimeout(() => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(item.blob);
            a.download = `${sourceFileName}_${item.idx}.png`;
            a.click();
            URL.revokeObjectURL(a.href);
        }, i * 250);
    });
};
</script>

var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
</body>
</html>
