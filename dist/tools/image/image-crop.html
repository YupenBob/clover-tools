<script>
let sourceImage = null;
let currentRatio = 'free';
let isDragging = false;
let dragMode = null; // 'move', 'nw', 'ne', 'sw', 'se', 'n', 's', 'e', 'w'
let dragStart = { x: 0, y: 0 };
let cropBox = { x: 0, y: 0, w: 100, h: 100 }; // in image coordinates
let croppedBlob = null;

const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const mainCanvas = document.getElementById('mainCanvas');
const resultCanvas = document.getElementById('resultCanvas');
const mctx = mainCanvas.getContext('2d');
const rctx = resultCanvas.getContext('2d');

fileInput.addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });
['dragover','dragenter'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--border)'; }));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.style.borderColor = 'var(--border)';
    if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function loadImage(file) {
    if (!file.type.startsWith('image/')) return;
    const img = new Image();
    img.onload = () => {
        sourceImage = img;
        const maxW = 800, maxH = 600;
        const scale = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight, 1);
        mainCanvas.width = Math.round(img.naturalWidth * scale);
        mainCanvas.height = Math.round(img.naturalHeight * scale);
        // Initial crop = center 80% area
        cropBox = {
            x: Math.round(img.naturalWidth * 0.1),
            y: Math.round(img.naturalHeight * 0.1),
            w: Math.round(img.naturalWidth * 0.8),
            h: Math.round(img.naturalHeight * 0.8)
        };
        document.getElementById('cropCard').classList.remove('hidden');
        document.getElementById('previewCard').classList.remove('hidden');
        document.getElementById('origSize').textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
        updateCropInputs();
        drawMain();
    };
    img.src = URL.createObjectURL(file);
}

function updateCropInputs() {
    document.getElementById('cropX').value = cropBox.x;
    document.getElementById('cropY').value = cropBox.y;
    document.getElementById('cropW').value = cropBox.w;
    document.getElementById('cropH').value = cropBox.h;
    document.getElementById('cropSize').textContent = `${cropBox.w} × ${cropBox.h}`;
    const r = cropBox.w / cropBox.h;
    document.getElementById('aspectRatio').textContent = r.toFixed(2) + ':1';
}

function drawMain() {
    if (!sourceImage) return;
    mctx.clearRect(0, 0, mainCanvas.width, mainCanvas.height);
    mctx.drawImage(sourceImage, 0, 0, mainCanvas.width, mainCanvas.height);
    // Dim outside crop
    const scaleX = mainCanvas.width / sourceImage.naturalWidth;
    const scaleY = mainCanvas.height / sourceImage.naturalHeight;
    const cx = cropBox.x * scaleX, cy = cropBox.y * scaleY;
    const cw = cropBox.w * scaleX, ch = cropBox.h * scaleY;
    mctx.fillStyle = 'rgba(0,0,0,0.5)';
    mctx.fillRect(0, 0, mainCanvas.width, cy);
    mctx.fillRect(0, cy + ch, mainCanvas.width, mainCanvas.height - cy - ch);
    mctx.fillRect(0, cy, cx, ch);
    mctx.fillRect(cx + cw, cy, mainCanvas.width - cx - cw, ch);
    // Crop border
    mctx.strokeStyle = '#c9a96e';
    mctx.lineWidth = 2;
    mctx.strokeRect(cx, cy, cw, ch);
    // Corner handles
    const handleSize = 10;
    mctx.fillStyle = '#c9a96e';
    [[cx, cy], [cx + cw, cy], [cx, cy + ch], [cx + cw, cy + ch]].forEach(([hx, hy]) => {
        mctx.fillRect(hx - handleSize/2, hy - handleSize/2, handleSize, handleSize);
    });
    // Rule of thirds
    mctx.strokeStyle = 'rgba(201,169,110,0.4)';
    mctx.lineWidth = 1;
    mctx.beginPath();
    mctx.moveTo(cx + cw/3, cy); mctx.lineTo(cx + cw/3, cy + ch);
    mctx.moveTo(cx + 2*cw/3, cy); mctx.lineTo(cx + 2*cw/3, cy + ch);
    mctx.moveTo(cx, cy + ch/3); mctx.lineTo(cx + cw, cy + ch/3);
    mctx.moveTo(cx, cy + 2*ch/3); mctx.lineTo(cx + cw, cy + 2*ch/3);
    mctx.stroke();
}

// Mouse interactions
function getMousePos(e) {
    const rect = mainCanvas.getBoundingClientRect();
    return {
        x: (e.clientX - rect.left) * (mainCanvas.width / rect.width),
        y: (e.clientY - rect.top) * (mainCanvas.height / rect.height)
    };
}
function hitTest(x, y) {
    const scaleX = mainCanvas.width / sourceImage.naturalWidth;
    const scaleY = mainCanvas.height / sourceImage.naturalHeight;
    const cx = cropBox.x * scaleX, cy = cropBox.y * scaleY;
    const cw = cropBox.w * scaleX, ch = cropBox.h * scaleY;
    const tol = 12;
    // Corners first
    if (Math.abs(x - cx) < tol && Math.abs(y - cy) < tol) return 'nw';
    if (Math.abs(x - (cx+cw)) < tol && Math.abs(y - cy) < tol) return 'ne';
    if (Math.abs(x - cx) < tol && Math.abs(y - (cy+ch)) < tol) return 'sw';
    if (Math.abs(x - (cx+cw)) < tol && Math.abs(y - (cy+ch)) < tol) return 'se';
    // Edges
    if (Math.abs(x - cx) < tol && y > cy && y < cy+ch) return 'w';
    if (Math.abs(x - (cx+cw)) < tol && y > cy && y < cy+ch) return 'e';
    if (Math.abs(y - cy) < tol && x > cx && x < cx+cw) return 'n';
    if (Math.abs(y - (cy+ch)) < tol && x > cx && x < cx+cw) return 's';
    // Inside = move
    if (x > cx && x < cx+cw && y > cy && y < cy+ch) return 'move';
    return null;
}

mainCanvas.addEventListener('mousedown', e => {
    if (!sourceImage) return;
    const p = getMousePos(e);
    dragMode = hitTest(p.x, p.y);
    if (dragMode) {
        isDragging = true;
        dragStart = { x: p.x, y: p.y, ...cropBox };
        e.preventDefault();
    }
});
window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    const p = getMousePos(e);
    const scaleX = mainCanvas.width / sourceImage.naturalWidth;
    const scaleY = mainCanvas.height / sourceImage.naturalHeight;
    const dx = (p.x - dragStart.x) / scaleX;
    const dy = (p.y - dragStart.y) / scaleY;
    const W = sourceImage.naturalWidth, H = sourceImage.naturalHeight;
    if (dragMode === 'move') {
        cropBox.x = Math.max(0, Math.min(W - cropBox.w, Math.round(dragStart.x + dx)));
        cropBox.y = Math.max(0, Math.min(H - cropBox.h, Math.round(dragStart.y + dy)));
    } else {
        let nx = dragStart.x, ny = dragStart.y, nw = dragStart.w, nh = dragStart.h;
        if (dragMode.includes('e')) nw = Math.max(1, Math.round(dragStart.w + dx));
        if (dragMode.includes('s')) nh = Math.max(1, Math.round(dragStart.h + dy));
        if (dragMode.includes('w')) { nw = Math.max(1, Math.round(dragStart.w - dx)); nx = dragStart.x + (dragStart.w - nw); }
        if (dragMode.includes('n')) { nh = Math.max(1, Math.round(dragStart.h - dy)); ny = dragStart.y + (dragStart.h - nh); }
        // Apply aspect ratio
        if (currentRatio !== 'free') {
            const [rw, rh] = currentRatio.split(':').map(Number);
            const ar = rw / rh;
            if (dragMode === 'n' || dragMode === 's') nw = Math.round(nh * ar);
            else if (dragMode === 'e' || dragMode === 'w') nh = Math.round(nw / ar);
            else { nw = Math.round(nh * ar); }
        }
        // Clamp
        if (nx < 0) { nw += nx; nx = 0; }
        if (ny < 0) { nh += ny; ny = 0; }
        if (nx + nw > W) nw = W - nx;
        if (ny + nh > H) nh = H - ny;
        cropBox = { x: Math.round(nx), y: Math.round(ny), w: Math.max(1, Math.round(nw)), h: Math.max(1, Math.round(nh)) };
    }
    updateCropInputs();
    drawMain();
});
window.addEventListener('mouseup', () => { isDragging = false; dragMode = null; });

// Preset ratio buttons
document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentRatio = btn.dataset.ratio;
        if (currentRatio !== 'free' && sourceImage) {
            const [rw, rh] = currentRatio.split(':').map(Number);
            const W = sourceImage.naturalWidth, H = sourceImage.naturalHeight;
            const targetAr = rw / rh;
            // Center, fit within current box bounds
            const curAr = cropBox.w / cropBox.h;
            let nw, nh;
            if (curAr > targetAr) { nh = cropBox.h; nw = Math.round(nh * targetAr); }
            else { nw = cropBox.w; nh = Math.round(nw / targetAr); }
            cropBox.x += Math.round((cropBox.w - nw) / 2);
            cropBox.y += Math.round((cropBox.h - nh) / 2);
            cropBox.w = nw; cropBox.h = nh;
            updateCropInputs();
            drawMain();
        }
    });
});

// Direct input changes
['cropX','cropY','cropW','cropH'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
        if (!sourceImage) return;
        const W = sourceImage.naturalWidth, H = sourceImage.naturalHeight;
        cropBox.x = Math.max(0, Math.min(W - 1, parseInt(document.getElementById('cropX').value) || 0));
        cropBox.y = Math.max(0, Math.min(H - 1, parseInt(document.getElementById('cropY').value) || 0));
        cropBox.w = Math.max(1, Math.min(W - cropBox.x, parseInt(document.getElementById('cropW').value) || 1));
        cropBox.h = Math.max(1, Math.min(H - cropBox.y, parseInt(document.getElementById('cropH').value) || 1));
        document.getElementById('cropSize').textContent = `${cropBox.w} × ${cropBox.h}`;
        document.getElementById('aspectRatio').textContent = (cropBox.w / cropBox.h).toFixed(2) + ':1';
        drawMain();
    });
});

document.getElementById('cropBtn').onclick = () => doCrop();
document.getElementById('downloadBtn').onclick = () => {
    if (!croppedBlob) return;
    const a = document.createElement('a');
    a.href = croppedBlob.url;
    a.download = croppedBlob.name;
    a.click();
};
document.getElementById('resetBtn').onclick = () => {
    sourceImage = null;
    fileInput.value = '';
    document.getElementById('cropCard').classList.add('hidden');
    document.getElementById('previewCard').classList.add('hidden');
    document.getElementById('resultCard').classList.add('hidden');
};

function doCrop() {
    if (!sourceImage) return;
    const radius = parseInt(document.getElementById('cropRadius').value) || 0;
    const format = document.getElementById('outputFormat').value;
    resultCanvas.width = cropBox.w;
    resultCanvas.height = cropBox.h;
    rctx.clearRect(0, 0, cropBox.w, cropBox.h);
    if (radius > 0) {
        rctx.save();
        const r = Math.min(radius, cropBox.w / 2, cropBox.h / 2);
        rctx.beginPath();
        rctx.moveTo(r, 0);
        rctx.lineTo(cropBox.w - r, 0);
        rctx.quadraticCurveTo(cropBox.w, 0, cropBox.w, r);
        rctx.lineTo(cropBox.w, cropBox.h - r);
        rctx.quadraticCurveTo(cropBox.w, cropBox.h, cropBox.w - r, cropBox.h);
        rctx.lineTo(r, cropBox.h);
        rctx.quadraticCurveTo(0, cropBox.h, 0, cropBox.h - r);
        rctx.lineTo(0, r);
        rctx.quadraticCurveTo(0, 0, r, 0);
        rctx.closePath();
        rctx.clip();
    }
    rctx.drawImage(sourceImage, cropBox.x, cropBox.y, cropBox.w, cropBox.h, 0, 0, cropBox.w, cropBox.h);
    if (radius > 0) rctx.restore();
    const ext = format.split('/')[1].replace('jpeg', 'jpg');
    resultCanvas.toBlob(blob => {
        croppedBlob = { blob, url: URL.createObjectURL(blob), name: `cropped_${Date.now()}.${ext}` };
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('resultCard').classList.remove('hidden');
    }, format, 0.92);
}

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();
