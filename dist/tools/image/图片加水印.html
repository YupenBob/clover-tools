  <script>
    CT.initTheme();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    const fileInput = document.getElementById('fileInput');
const dropZone = document.getElementById('dropZone');
const wmImage = document.getElementById('wmImage');
const applyBtn = document.getElementById('applyBtn');
const downloadBtn = document.getElementById('downloadBtn');
const previewWrap = document.getElementById('previewWrap');
const statusEl = document.getElementById('status');

let sourceImage = null; // HTMLImageElement
let sourceBitmap = null; // ImageBitmap / canvas source
let watermarkImage = null; // HTMLImageElement for image watermark
let resultBlob = null;
let resultUrl = null;
let resultExt = 'png';

function $(id) { return document.getElementById(id); }

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { resolve({ img, url }); };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片加载失败')); };
    img.src = url;
  });
}

async function handleSourceFile(file) {
  if (!file) return;
  if (!file.type.startsWith('image/')) {
    statusEl.textContent = '请选择图片文件';
    return;
  }
  statusEl.textContent = '加载图片...';
  try {
    const { img, url } = await loadImage(file);
    if (sourceBitmap && sourceBitmap._url) URL.revokeObjectURL(sourceBitmap._url);
    sourceImage = img;
    sourceBitmap = { width: img.naturalWidth, height: img.naturalHeight, _url: url };
    applyBtn.disabled = false;
    statusEl.textContent = `已加载 ${img.naturalWidth} × ${img.naturalHeight}`;
    applyWatermark();
  } catch (err) {
    statusEl.textContent = '加载失败：' + err.message;
  }
}

fileInput.addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) handleSourceFile(f);
  fileInput.value = '';
});

wmImage.addEventListener('change', async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const { img } = await loadImage(f);
    watermarkImage = img;
    statusEl.textContent = '水印图片已就绪';
    if (sourceImage) applyWatermark();
  } catch (err) {
    statusEl.textContent = '水印图片加载失败：' + err.message;
  }
});

['dragenter', 'dragover'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.style.background = 'var(--bg-primary)'; })
);
['dragleave', 'drop'].forEach(ev =>
  dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.style.background = ''; })
);
dropZone.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleSourceFile(f);
});

// Toggle settings visibility based on waterType
document.querySelectorAll('input[name="wmType"]').forEach(r => {
  r.addEventListener('change', () => {
    const isText = $('textSettings').style.display = document.querySelector('input[name="wmType"]:checked').value === 'text' ? '' : 'none';
    $('imageSettings').style.display = document.querySelector('input[name="wmType"]:checked').value === 'image' ? '' : 'none';
    if (sourceImage) applyWatermark();
  });
});

// Re-render when any control changes
['wmText','wmFontSize','wmColor','wmOpacity','wmShadow','wmRotate','wmLayout','wmMargin','wmImgScale','wmImgOpacity','outFormat','outQuality'].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener('input', () => { if (sourceImage) applyWatermark(); });
  el.addEventListener('change', () => { if (sourceImage) applyWatermark(); });
});

function drawWatermarks(ctx, w, h) {
  const wmType = document.querySelector('input[name="wmType"]:checked').value;
  const layout = $('wmLayout').value;
  const margin = parseInt($('wmMargin').value, 10) || 0;

  if (wmType === 'image') {
    if (!watermarkImage) return;
    const scale = parseFloat($('wmImgScale').value) || 0.25;
    const opacity = parseFloat($('wmImgOpacity').value) || 0.7;
    drawImageWatermark(ctx, w, h, layout, scale, opacity, margin);
  } else {
    const text = $('wmText').value || '';
    if (!text) return;
    const fontSize = parseInt($('wmFontSize').value, 10) || 36;
    const color = $('wmColor').value || '#ffffff';
    const opacity = parseFloat($('wmOpacity').value) || 0.6;
    const shadow = $('wmShadow').value;
    const rotate = parseInt($('wmRotate').value, 10) || 0;
    drawTextWatermark(ctx, w, h, layout, text, fontSize, color, opacity, shadow, rotate, margin);
  }
}

function drawTextWatermark(ctx, W, H, layout, text, fontSize, color, opacity, shadow, rotate, margin) {
  ctx.save();
  ctx.font = `bold ${fontSize}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.globalAlpha = opacity;

  if (shadow === 'light') {
    ctx.shadowColor = 'rgba(0,0,0,0.35)';
    ctx.shadowBlur = 4;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;
  } else if (shadow === 'strong') {
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
  }

  const positions = layoutPositions(layout, W, H, margin);
  for (const pos of positions) {
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.rotate((rotate * Math.PI) / 180);
    if (shadow === 'stroke') {
      ctx.strokeStyle = 'rgba(0,0,0,0.7)';
      ctx.lineWidth = Math.max(2, fontSize / 12);
      ctx.strokeText(text, 0, 0);
    }
    ctx.fillStyle = color;
    ctx.fillText(text, 0, 0);
    ctx.restore();
  }
  ctx.restore();
}

function drawImageWatermark(ctx, W, H, layout, scale, opacity, margin) {
  ctx.save();
  ctx.globalAlpha = opacity;
  const wmW = watermarkImage.naturalWidth;
  const wmH = watermarkImage.naturalHeight;
  const targetW = W * scale;
  const ratio = wmH / wmW;
  const targetH = targetW * ratio;

  const positions = layoutPositions(layout, W, H, margin);
  for (const pos of positions) {
    ctx.drawImage(watermarkImage, pos.x - targetW / 2, pos.y - targetH / 2, targetW, targetH);
  }
  ctx.restore();
}

function layoutPositions(layout, W, H, margin) {
  if (layout === 'single') {
    return [{ x: W / 2, y: H / 2 }];
  }
  if (layout === 'diagonal') {
    return [
      { x: W * 0.25, y: H * 0.25 },
      { x: W * 0.75, y: H * 0.5 },
      { x: W * 0.5, y: H * 0.8 },
    ];
  }
  // tile: spaced grid
  const positions = [];
  const stepX = Math.max(80, W / 4);
  const stepY = Math.max(80, H / 5);
  for (let y = margin + stepY / 2; y < H - margin; y += stepY) {
    const offset = (Math.floor(y / stepY) % 2) * (stepX / 2);
    for (let x = margin + stepX / 2 + offset; x < W - margin; x += stepX) {
      positions.push({ x, y });
    }
  }
  return positions;
}

function applyWatermark() {
  if (!sourceImage) return;
  const W = sourceImage.naturalWidth;
  const H = sourceImage.naturalHeight;
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(sourceImage, 0, 0);
  drawWatermarks(ctx, W, H);

  const format = $('outFormat').value;
  resultExt = format === 'jpeg' ? 'jpg' : format;
  const mime = 'image/' + format;
  const quality = (parseInt($('outQuality').value, 10) || 92) / 100;

  canvas.toBlob(blob => {
    if (!blob) {
      statusEl.textContent = '生成失败';
      return;
    }
    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultBlob = blob;
    resultUrl = URL.createObjectURL(blob);
    previewWrap.innerHTML = '';
    const img = document.createElement('img');
    img.src = resultUrl;
    img.style.maxWidth = '100%';
    img.style.maxHeight = '60vh';
    img.style.borderRadius = '4px';
    previewWrap.appendChild(img);
    downloadBtn.disabled = false;
    statusEl.textContent = `✅ 已生成 ${(blob.size / 1024).toFixed(1)} KB，可下载`;
  }, mime, quality);
}

applyBtn.addEventListener('click', applyWatermark);

downloadBtn.addEventListener('click', () => {
  if (!resultUrl) return;
  const a = document.createElement('a');
  a.href = resultUrl;
  a.download = `watermarked_${Date.now()}.${resultExt}`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  if (CT && CT.showToast) CT.showToast('已下载');
});
  </script>
