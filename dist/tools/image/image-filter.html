<script>
let sourceImage = null;
let outputBlob = null;
let outputName = 'filtered.png';
const presets = {
    none: { brightness:100, contrast:100, saturate:100, hue:0, blur:0, grayscale:0, sepia:0, invert:0 },
    bw: { brightness:105, contrast:115, saturate:0, hue:0, blur:0, grayscale:100, sepia:0, invert:0 },
    sepia: { brightness:105, contrast:100, saturate:80, hue:0, blur:0, grayscale:0, sepia:80, invert:0 },
    vivid: { brightness:105, contrast:120, saturate:160, hue:0, blur:0, grayscale:0, sepia:0, invert:0 },
    cool: { brightness:100, contrast:105, saturate:110, hue:200, blur:0, grayscale:0, sepia:0, invert:0 },
    warm: { brightness:105, contrast:105, saturate:120, hue:30, blur:0, grayscale:0, sepia:0, invert:0 },
    dreamy: { brightness:110, contrast:90, saturate:120, hue:0, blur:2, grayscale:0, sepia:10, invert:0 },
    vintage: { brightness:100, contrast:95, saturate:75, hue:25, blur:0, grayscale:0, sepia:50, invert:0 },
    dramatic: { brightness:90, contrast:140, saturate:110, hue:0, blur:0, grayscale:0, sepia:0, invert:0 },
    soft: { brightness:110, contrast:85, saturate:90, hue:0, blur:1.5, grayscale:0, sepia:0, invert:0 }
};

const fileInput = document.getElementById('fileInput');
const uploadArea = document.getElementById('uploadArea');
const origCanvas = document.getElementById('origCanvas');
const resultCanvas = document.getElementById('resultCanvas');
const octx = origCanvas.getContext('2d');
const rctx = resultCanvas.getContext('2d');
const sliders = ['brightness','contrast','saturate','hue','blur','grayscale','sepia','invert'];

fileInput.addEventListener('change', e => { if (e.target.files[0]) loadImage(e.target.files[0]); });
['dragover','dragenter'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--accent)'; }));
['dragleave','drop'].forEach(ev => uploadArea.addEventListener(ev, e => { e.preventDefault(); uploadArea.style.borderColor = 'var(--border)'; }));
uploadArea.addEventListener('drop', e => {
    e.preventDefault();
    uploadArea.style.borderColor = 'var(--border)';
    if (e.dataTransfer.files[0]) loadImage(e.dataTransfer.files[0]);
});

function loadImage(file) {
    if (!file.type.startsWith('image/')) return;
    outputName = file.name.replace(/\.[^.]+$/, '') + '_filtered.png';
    const img = new Image();
    img.onload = () => {
        sourceImage = img;
        const maxW = 700;
        const scale = Math.min(1, maxW / img.naturalWidth);
        origCanvas.width = resultCanvas.width = Math.round(img.naturalWidth * scale);
        origCanvas.height = resultCanvas.height = Math.round(img.naturalHeight * scale);
        octx.drawImage(img, 0, 0, origCanvas.width, origCanvas.height);
        document.getElementById('filterCard').classList.remove('hidden');
        document.getElementById('previewCard').classList.remove('hidden');
        applyFilter();
    };
    img.src = URL.createObjectURL(file);
}

function getFilterString() {
    const b = document.getElementById('brightness').value;
    const c = document.getElementById('contrast').value;
    const s = document.getElementById('saturate').value;
    const h = document.getElementById('hue').value;
    const bl = document.getElementById('blur').value;
    const g = document.getElementById('grayscale').value;
    const se = document.getElementById('sepia').value;
    const i = document.getElementById('invert').value;
    return `brightness(${b}%) contrast(${c}%) saturate(${s}%) hue-rotate(${h}deg) blur(${bl}px) grayscale(${g}%) sepia(${se}%) invert(${i}%)`;
}

function applyFilter() {
    if (!sourceImage) return;
    rctx.filter = getFilterString();
    rctx.clearRect(0, 0, resultCanvas.width, resultCanvas.height);
    rctx.drawImage(sourceImage, 0, 0, resultCanvas.width, resultCanvas.height);
    rctx.filter = 'none';
    // Update value labels
    document.getElementById('brightnessVal').textContent = document.getElementById('brightness').value + '%';
    document.getElementById('contrastVal').textContent = document.getElementById('contrast').value + '%';
    document.getElementById('saturateVal').textContent = document.getElementById('saturate').value + '%';
    document.getElementById('hueVal').textContent = document.getElementById('hue').value + '°';
    document.getElementById('blurVal').textContent = document.getElementById('blur').value + 'px';
    document.getElementById('grayscaleVal').textContent = document.getElementById('grayscale').value + '%';
    document.getElementById('sepiaVal').textContent = document.getElementById('sepia').value + '%';
    document.getElementById('invertVal').textContent = document.getElementById('invert').value + '%';
    document.getElementById('downloadBtn').disabled = false;
}

sliders.forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.preset-btn[data-preset="none"]').classList.add('active');
        applyFilter();
    });
});

document.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const p = presets[btn.dataset.preset];
        document.getElementById('brightness').value = p.brightness;
        document.getElementById('contrast').value = p.contrast;
        document.getElementById('saturate').value = p.saturate;
        document.getElementById('hue').value = p.hue;
        document.getElementById('blur').value = p.blur;
        document.getElementById('grayscale').value = p.grayscale;
        document.getElementById('sepia').value = p.sepia;
        document.getElementById('invert').value = p.invert;
        applyFilter();
    });
});

document.getElementById('downloadBtn').onclick = () => {
    // Re-render at full resolution for download
    const fullCanvas = document.createElement('canvas');
    fullCanvas.width = sourceImage.naturalWidth;
    fullCanvas.height = sourceImage.naturalHeight;
    const fctx = fullCanvas.getContext('2d');
    fctx.filter = getFilterString();
    fctx.drawImage(sourceImage, 0, 0);
    fullCanvas.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = outputName;
        a.click();
        URL.revokeObjectURL(a.href);
    }, 'image/png');
};

document.getElementById('resetBtn').onclick = () => {
    document.querySelector('.preset-btn[data-preset="none"]').click();
};
</script>

  <div id="toast"></div>

  <script>
    CT.initTheme();
    CT.initReveal();
    CT.initCopyPulse();

    CT.initKeyboardShortcuts();

    // Share: copy current URL to clipboard
    document.getElementById("shareBtn").onclick = function() { navigator.clipboard.writeText(window.location.href).then(function() { CT.showToast("\u94fe\u63a5\u5df2\u590d\u5236\uff01"); }).catch(function() { CT.showToast("\u590d\u5236\u5931\u8d25"); }); };

    var mode = 'format';
var input = document.getElementById('input');
var output = document.getElementById('output');
var sampleData = "";
function updateFormatterStats() {
  var inv = input.value;
  document.getElementById('inputStats').textContent = inv.length + ' 字符 · ' + (inv ? inv.split('\n').length : 0) + ' 行';
  document.getElementById('outputStats').textContent = output.value.length + ' 字符';
}
function detectFormat(text) {
  var t = text.trim();
  if (t.startsWith('{') || t.startsWith('[')) return 'json';
  if (t.startsWith('<')) {
    if (/<!DOCTYPE\s+html/i.test(t) || /<html/i.test(t)) return 'html';
    if (/<\?xml/i.test(t)) return 'xml';
    return 'html';
  }
  return 'text';
}
function runFormatter() {
  try {
    var val = input.value.trim();
    output.style.borderColor = '';
    if (!val) { output.value = ''; updateFormatterStats(); return; }
    var fmt = detectFormat(val);
    if (fmt === 'json') {
      var parsed = JSON.parse(val);
      output.value = mode === 'minify' ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 2);
    } else if (fmt === 'html' || fmt === 'xml') {
      var doc = new DOMParser().parseFromString(val, fmt === 'html' ? 'text/html' : 'application/xml');
      if (fmt === 'xml' && doc.querySelector('parsererror')) throw new Error('XML 解析错误');
      var formatted = doc.documentElement.outerHTML;
      output.value = mode === 'minify' ? formatted.replace(/>\s+</g, '><').trim() : formatted;
    } else {
      output.value = val;
    }
  } catch(e) { output.value = '错误: ' + e.message; output.style.borderColor = 'var(--error)'; }
  updateFormatterStats();
}
document.getElementById('format').onclick = function() { mode = 'format'; this.classList.add('active-btn'); document.getElementById('minify').classList.remove('active-btn'); runFormatter(); };
document.getElementById('minify').onclick = function() { mode = 'minify'; this.classList.add('active-btn'); document.getElementById('format').classList.remove('active-btn'); runFormatter(); };
document.getElementById('copyOutput').onclick = function() { CT.copy(output.value, this); };
document.getElementById('clearInput').onclick = function() { input.value = ''; output.value = ''; updateFormatterStats(); input.focus(); };
input.addEventListener('input', CT.debounce(runFormatter, 150));
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'TEXTAREA') {
    if ((e.ctrlKey||e.metaKey) && e.key === 'Enter') { e.preventDefault(); runFormatter(); }
    if ((e.ctrlKey||e.metaKey) && e.key === 'k') { e.preventDefault(); document.getElementById('clearInput').click(); }
  }
});
updateFormatterStats();

  </script>
</body>
</html>
