<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="ft fd">
  <title id="ft">人格风格测试的作答流程</title>
  <desc id="fd">24 道题逐题五档作答，四个维度分别累加后得到字母结果与百分比，可保存 PNG 或复制文字；全部选同一档会出现四个 X。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8935A"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #232019; }
    .title { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 16px; font-weight: 400; fill: #6F6656; text-anchor: middle; }
    .note { font-size: 15px; fill: #6F6656; text-anchor: middle; }
    .box { fill: #FFFDF7; stroke: #D8C39A; stroke-width: 1.6; }
    .accent { fill: #F8ECD2; stroke: #B8935A; stroke-width: 1.8; }
    .flow { stroke: #B8935A; stroke-width: 2; fill: none; }
    .back { stroke: #B8935A; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
  <rect class="box" x="190" y="48" width="340" height="66" rx="14"/>
  <text class="title" x="360.0" y="81.0" dominant-baseline="middle">24 道原创情境题，逐题作答</text>
  <line class="flow" x1="360" y1="114" x2="360" y2="140" marker-end="url(#arrow)"/>
  <rect class="box" x="190" y="140" width="340" height="66" rx="14"/>
  <text class="title" x="360.0" y="173.0" dominant-baseline="middle">五档选择：非常符合 → 很不符合</text>
  <line class="flow" x1="360" y1="206" x2="360" y2="232" marker-end="url(#arrow)"/>
  <rect class="box" x="190" y="232" width="340" height="66" rx="14"/>
  <text class="title" x="360.0" y="265.0" dominant-baseline="middle">四个维度分别累加（含反向题）</text>
  <line class="flow" x1="360" y1="298" x2="360" y2="324" marker-end="url(#arrow)"/>
  <rect class="box" x="190" y="324" width="340" height="66" rx="14"/>
  <text class="title" x="360.0" y="357.0" dominant-baseline="middle">结果码 + 两两百分比</text>
  <path class="flow" d="M 360 390 L 360 405 L 200 405 L 200 420" marker-end="url(#arrow)"/>
  <path class="flow" d="M 360 390 L 360 405 L 520 405 L 520 420" marker-end="url(#arrow)"/>
  <rect class="accent" x="75" y="420" width="250" height="66" rx="14"/>
  <text class="title" x="200.0" y="453.0" dominant-baseline="middle">保存 PNG 分享卡</text>
  <rect class="accent" x="395" y="420" width="250" height="66" rx="14"/>
  <text class="title" x="520.0" y="453.0" dominant-baseline="middle">复制文字结果</text>
  <text class="note" x="360" y="520" dominant-baseline="middle">全部选同一档时四个维度都持平，结果码为 XXXX</text>
</svg>
