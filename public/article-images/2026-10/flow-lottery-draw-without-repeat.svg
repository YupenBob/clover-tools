<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="ft fd">
  <title id="ft">抽奖的抽取流程</title>
  <desc id="fd">粘贴名单后检查人数与重复，用 Math.random 按位置不重复地抽出中奖者，在老虎机中逐个揭晓，最后复制结果或再抽一次。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8935A"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #232019; }
    .title { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 16px; font-weight: 400; fill: #6F6656; text-anchor: middle; }
    .note { font-size: 15px; fill: #6F6656; text-anchor: middle; }
    .box { fill: #FFFDF7; stroke: #D8C39A; stroke-width: 1.6; }
    .accent { fill: #F8ECD2; stroke: #B8935A; stroke-width: 1.8; }
    .flow { stroke: #B8935A; stroke-width: 2; fill: none; }
    .back { stroke: #B8935A; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
  <rect class="box" x="180" y="36" width="360" height="58" rx="14"/>
  <text class="title" x="360.0" y="65.0" dominant-baseline="middle">名单：每行一个姓名</text>
  <line class="flow" x1="360" y1="94" x2="360" y2="112" marker-end="url(#arrow)"/>
  <rect class="box" x="180" y="112" width="360" height="58" rx="14"/>
  <text class="title" x="360.0" y="141.0" dominant-baseline="middle">检查人数与重复（只提示，不合并）</text>
  <line class="flow" x1="360" y1="170" x2="360" y2="188" marker-end="url(#arrow)"/>
  <rect class="box" x="180" y="188" width="360" height="58" rx="14"/>
  <text class="title" x="360.0" y="217.0" dominant-baseline="middle">Math.random 逐个抽取（位置不放回）</text>
  <line class="flow" x1="360" y1="246" x2="360" y2="264" marker-end="url(#arrow)"/>
  <rect class="box" x="180" y="264" width="360" height="58" rx="14"/>
  <text class="title" x="360.0" y="293.0" dominant-baseline="middle">老虎机逐个揭晓</text>
  <line class="flow" x1="360" y1="322" x2="360" y2="340" marker-end="url(#arrow)"/>
  <rect class="box" x="180" y="340" width="360" height="58" rx="14"/>
  <text class="title" x="360.0" y="369.0" dominant-baseline="middle">复制结果 / 再抽一次</text>
  <text class="note" x="360" y="430" dominant-baseline="middle">重复姓名仍可能被抽中两次，名单要先清理。</text>
</svg>
