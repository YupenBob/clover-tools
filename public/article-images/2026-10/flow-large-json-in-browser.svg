<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430" role="img" aria-labelledby="ft fd">
  <title id="ft">大 JSON 的处理与排查流程</title>
  <desc id="fd">粘贴 JSON 后先确认能否一次解析；失败时按行号列号定位并分段修复，成功后再格式化或压缩并复制下载。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8935A"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #232019; }
    .title { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 16px; font-weight: 400; fill: #6F6656; text-anchor: middle; }
    .note { font-size: 15px; fill: #6F6656; text-anchor: middle; }
    .box { fill: #FFFDF7; stroke: #D8C39A; stroke-width: 1.6; }
    .accent { fill: #F8ECD2; stroke: #B8935A; stroke-width: 1.8; }
    .flow { stroke: #B8935A; stroke-width: 2; fill: none; }
    .back { stroke: #B8935A; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
  <rect class="box" x="230" y="30" width="260" height="54" rx="14"/>
  <text class="title" x="360.0" y="57.0" dominant-baseline="middle">粘贴 JSON</text>
  <line class="flow" x1="360" y1="84" x2="360" y2="104" marker-end="url(#arrow)"/>
  <polygon class="accent" points="360,104.0 490.0,152 360,200.0 230.0,152"/><text class="title" x="360" y="152" dominant-baseline="middle">能一次解析？</text>
  <path class="flow" d="M 230 152 L 160 152 L 160 225" marker-end="url(#arrow)"/><text class="sub" x="186" y="140">否</text>
  <path class="flow" d="M 490 152 L 560 152 L 560 225" marker-end="url(#arrow)"/><text class="sub" x="520" y="140">是</text>
  <rect class="box" x="45" y="225" width="230" height="60" rx="14"/>
  <text class="title" x="160.0" y="255.0" dominant-baseline="middle">按行号 / 列号定位</text>
  <rect class="box" x="445" y="225" width="230" height="60" rx="14"/>
  <text class="title" x="560.0" y="255.0" dominant-baseline="middle">格式化 / 压缩</text>
  <line class="flow" x1="160" y1="285" x2="160" y2="310" marker-end="url(#arrow)"/>
  <rect class="box" x="45" y="310" width="230" height="60" rx="14"/>
  <text class="title" x="160.0" y="340.0" dominant-baseline="middle">修复后重新校验</text>
  <line class="flow" x1="560" y1="285" x2="560" y2="310" marker-end="url(#arrow)"/>
  <rect class="box" x="445" y="310" width="230" height="60" rx="14"/>
  <text class="title" x="560.0" y="340.0" dominant-baseline="middle">复制或下载</text>
  <text class="note" x="360" y="400" dominant-baseline="middle">几 MB 的 JSON 会先卡在主线程，分段校验比反复整段重试更稳。</text>
</svg>
