<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="ft fd">
  <title id="ft">税后工资的估算流程</title>
  <desc id="fd">输入税前月薪后按固定的养老、医疗、失业比例和所选公积金档位计算五险一金，减去 5000 起征点后按预扣率表算个税，得到税后金额；不含专项附加扣除。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B8935A"/></marker>
  </defs>
  <style>
    text { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; fill: #232019; }
    .title { font-size: 21px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 16px; font-weight: 400; fill: #6F6656; text-anchor: middle; }
    .note { font-size: 15px; fill: #6F6656; text-anchor: middle; }
    .box { fill: #FFFDF7; stroke: #D8C39A; stroke-width: 1.6; }
    .accent { fill: #F8ECD2; stroke: #B8935A; stroke-width: 1.8; }
    .flow { stroke: #B8935A; stroke-width: 2; fill: none; }
    .back { stroke: #B8935A; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>
  <rect class="box" x="150" y="34" width="420" height="58" rx="14"/>
  <text class="title" x="360.0" y="63.0" dominant-baseline="middle">税前月薪</text>
  <line class="flow" x1="360" y1="92" x2="360" y2="120" marker-end="url(#arrow)"/>
  <rect class="box" x="150" y="120" width="420" height="58" rx="14"/>
  <text class="title" x="360.0" y="137.0" dominant-baseline="middle">五险一金 + 公积金</text>
  <text class="sub" x="360.0" y="163.0" dominant-baseline="middle">8% / 2% / 0.5% + 自选 5%、7%、12%</text>
  <line class="flow" x1="360" y1="178" x2="360" y2="206" marker-end="url(#arrow)"/>
  <rect class="box" x="150" y="206" width="420" height="58" rx="14"/>
  <text class="title" x="360.0" y="223.0" dominant-baseline="middle">应纳税所得额</text>
  <text class="sub" x="360.0" y="249.0" dominant-baseline="middle">税前 − 五险一金 − 5000</text>
  <line class="flow" x1="360" y1="264" x2="360" y2="292" marker-end="url(#arrow)"/>
  <rect class="box" x="150" y="292" width="420" height="58" rx="14"/>
  <text class="title" x="360.0" y="321.0" dominant-baseline="middle">按预扣率表算个税</text>
  <line class="flow" x1="360" y1="350" x2="360" y2="378" marker-end="url(#arrow)"/>
  <rect class="accent" x="150" y="378" width="420" height="58" rx="14"/>
  <text class="title" x="360.0" y="407.0" dominant-baseline="middle">税后到手</text>
  <text class="note" x="360" y="470" dominant-baseline="middle">不按城市调整比例，也不含专项附加扣除。</text>
</svg>
