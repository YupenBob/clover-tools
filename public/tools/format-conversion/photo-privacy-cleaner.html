<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片隐私信息去除 - CloverTools</title>
    <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0d1117;
            color: #e0e0e0;
            min-height: 100vh;
            line-height: 1.6;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 1px solid #30363d;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2rem;
            color: #c9a96e;
            margin-bottom: 10px;
        }
        
        header p {
            color: #8b949e;
            font-size: 0.95rem;
        }
        
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #c9a96e;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .upload-zone {
            border: 2px dashed #30363d;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: rgba(48, 54, 61, 0.2);
        }
        
        .upload-zone:hover, .upload-zone.dragover {
            border-color: #c9a96e;
            background-color: rgba(201, 169, 110, 0.1);
        }
        
        .upload-zone input[type="file"] {
            display: none;
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        
        .upload-text {
            color: #8b949e;
            margin-bottom: 8px;
        }
        
        .upload-hint {
            font-size: 0.85rem;
            color: #6e7681;
        }
        
        .exif-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }
        
        .exif-table th, .exif-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        
        .exif-table th {
            background-color: rgba(48, 54, 61, 0.3);
            color: #c9a96e;
            font-weight: 600;
        }
        
        .exif-table tr:hover {
            background-color: rgba(48, 54, 61, 0.2);
        }
        
        .sensitive {
            color: #f85149;
            margin-right: 6px;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #8b949e;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            background-color: #c9a96e;
            color: #0d1117;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 16px;
        }
        
        .btn:hover {
            background-color: #d4b87a;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background-color: #30363d;
            color: #6e7681;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background-color: #30363d;
            color: #e0e0e0;
        }
        
        .btn-secondary:hover {
            background-color: #3d444d;
        }
        
        .preview-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .preview-box {
            flex: 1;
            min-width: 280px;
            text-align: center;
        }
        
        .preview-box h3 {
            font-size: 0.9rem;
            color: #8b949e;
            margin-bottom: 12px;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            border: 1px solid #30363d;
            object-fit: contain;
            background-color: rgba(0, 0, 0, 0.3);
        }
        
        .batch-list {
            margin-top: 20px;
        }
        
        .batch-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background-color: rgba(48, 54, 61, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #30363d;
        }
        
        .batch-item-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }
        
        .batch-item-name {
            font-size: 0.9rem;
            color: #e0e0e0;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        
        .batch-item-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        
        .status-pending {
            background-color: rgba(201, 169, 110, 0.2);
            color: #c9a96e;
        }
        
        .status-processing {
            background-color: rgba(86, 156, 214, 0.2);
            color: #569cd6;
        }
        
        .status-done {
            background-color: rgba(63, 185, 80, 0.2);
            color: #3fb950;
        }
        
        .status-error {
            background-color: rgba(248, 81, 73, 0.2);
            color: #f85149;
        }
        
        .batch-item-remove {
            background: none;
            border: none;
            color: #6e7681;
            cursor: pointer;
            padding: 4px 8px;
            font-size: 1.2rem;
            transition: color 0.3s;
        }
        
        .batch-item-remove:hover {
            color: #f85149;
        }
        
        footer {
            text-align: center;
            padding: 30px 0;
            border-top: 1px solid #30363d;
            margin-top: 40px;
            color: #8b949e;
        }
        
        .gps-location {
            font-size: 0.85rem;
            color: #569cd6;
            margin-top: 4px;
        }
        
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
            
            .card {
                padding: 16px;
            }
            
            .upload-zone {
                padding: 24px;
            }
            
            .preview-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>☘️ 照片隐私信息去除 - CloverTools</h1>
            <p>上传照片，自动检测并去除所有EXIF隐私信息</p>
        </header>
        
        <div class="card">
            <h2>📤 上传照片</h2>
            <div class="upload-zone" id="uploadZone">
                <input type="file" id="fileInput" accept="image/jpeg,image/png" multiple>
                <div class="upload-icon">🖼️</div>
                <div class="upload-text">拖拽图片到此处或点击上传</div>
                <div class="upload-hint">支持 JPG/PNG 格式，单次最多5张</div>
            </div>
        </div>
        
        <div class="card" id="batchCard" style="display: none;">
            <h2>📋 批量处理列表</h2>
            <div class="batch-list" id="batchList"></div>
            <div class="actions">
                <button class="btn" id="cleanAllBtn" onclick="processAllFiles()">🧹 去除所有隐私信息</button>
                <button class="btn btn-secondary" onclick="clearBatch()">🗑️ 清空列表</button>
            </div>
        </div>
        
        <div class="card" id="previewCard" style="display: none;">
            <h2>🔍 图片预览与EXIF信息</h2>
            <div class="preview-container">
                <div class="preview-box">
                    <h3>原始图片</h3>
                    <img id="originalPreview" class="preview-image" alt="Original">
                </div>
                <div class="preview-box">
                    <h3>清除后预览</h3>
                    <img id="cleanedPreview" class="preview-image" alt="Cleaned">
                </div>
            </div>
            <div id="exifData"></div>
            <div class="actions">
                <button class="btn" id="downloadBtn" onclick="downloadCleaned()">💾 下载清除后的图片</button>
                <button class="btn btn-secondary" onclick="resetUpload()">🔄 处理新图片</button>
            </div>
        </div>
        
        <footer>
            <p>CloverTools ☘️</p>
        </footer>
    </div>
    
    <script>
        let currentFile = null;
        let currentBlob = null;
        let batchFiles = [];
        const MAX_BATCH_FILES = 5;
        
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });
        
        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });
        
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });
        
        function handleFiles(files) {
            const validFiles = Array.from(files).filter(file => {
                const isValidType = file.type === 'image/jpeg' || file.type === 'image/png';
                const notDuplicate = !batchFiles.some(f => f.name === file.name && f.size === file.size);
                return isValidType && notDuplicate;
            });
            
            const remainingSlots = MAX_BATCH_FILES - batchFiles.length;
            const filesToAdd = validFiles.slice(0, remainingSlots);
            
            filesToAdd.forEach(file => {
                batchFiles.push(file);
            });
            
            updateBatchUI();
            
            if (batchFiles.length === 1) {
                processSingleFile(batchFiles[0]);
            }
        }
        
        function updateBatchUI() {
            const batchCard = document.getElementById('batchCard');
            const batchList = document.getElementById('batchList');
            
            if (batchFiles.length > 0) {
                batchCard.style.display = 'block';
                batchList.innerHTML = batchFiles.map((file, index) => `
                    <div class
