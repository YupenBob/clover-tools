<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片隐私信息去除 - 批量清除EXIF敏感数据</title>
  <link rel="stylesheet" href="../../src/shared.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-secondary: #8b949e;
      --primary: #c9a96e;
      --primary-hover: #b8956a;
      --accent: #c9a96e;
      --btn-bg: #21262d;
      --input-bg: #0d1117;
      --result-bg: #161b22;
      --danger: #f85149;
      --warning: #d29922;
      --success: #3fb950;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .breadcrumb { font-size: .82rem; color: var(--text-secondary); margin-bottom: .5rem; }
    h1 { font-size: 1.5rem; margin-bottom: .4rem; }
    .subtitle { color: var(--text-secondary); font-size: .9rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .card h3 { font-size: 1rem; margin: 0 0 1rem; }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
    }
    .drop-zone:hover, .drop-zone.dragover { border-color: var(--primary); background: rgba(201,169,110,.05); }
    .drop-zone i { font-size: 3rem; color: var(--text-secondary); display: block; margin-bottom: .75rem; }
    .drop-zone p { color: var(--text-secondary); font-size: .9rem; margin: .3rem 0; }
    .drop-zone input[type="file"] { display: none; }
    .batch-list { display: flex; flex-direction: column; gap: .75rem; margin-top: 1rem; }
    .batch-item {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem 1rem;
      display: flex;
      align-items: center;
      gap: .75rem;
    }
    .batch-item img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
    .batch-item .info { flex: 1; }
    .batch-item .name { font-size: .85rem; font-weight: 500; }
    .batch-item .status { font-size: .78rem; color: var(--text-secondary); }
    .batch-item .status.danger { color: var(--danger); }
    .batch-item .status.success { color: var(--success); }
    .batch-item .actions { display: flex; gap: .5rem; }
    .btn { padding: .5rem 1.2rem; border-radius: 6px; cursor: pointer; font-size: .88rem; border: none; transition: opacity .2s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-ghost { background: var(--btn-bg); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .exif-table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .5rem; }
    .exif-table th { text-align: left; padding: .5rem .75rem; background: var(--btn-bg); border-bottom: 1px solid var(--border); color: var(--text-secondary); font-weight: 500; }
    .exif-table td { padding: .5rem .75rem; border-bottom: 1px solid var(--border); }
    .exif-table tr:last-child td { border-bottom: none; }
    .badge { display: inline-flex; align-items: center; gap: .25rem; padding: .2rem .55rem; border-radius: 20px; font-size: .75rem; font-weight: 500; }
    .badge-danger { background: rgba(248,81,73,.15); color: var(--danger); }
    .badge-warning { background: rgba(210,153,34,.15); color: var(--warning); }
    .badge-safe { background: rgba(63,185,80,.15); color: var(--success); }
    .preview-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
    .preview-box { text-align: center; }
    .preview-box img { max-width: 100%; max-height: 300px; border-radius: 8px; border: 1px solid var(--border); object-fit: contain; }
    .preview-label { font-size: .8rem; color: var(--text-secondary); margin-top: .4rem; }
    .stat-bar { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .stat-item { display: flex; align-items: center; gap: .4rem; font-size: .85rem; }
    .stat-item i { color: var(--primary); }
    .actions-row { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
    .no-exif { color: var(--success); text-align: center; padding: 2rem; }
    .no-exif i { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
  </style>
</head>
<body>
<div class="container">
  <div class="breadcrumb">首页 / 格式转换 / 照片隐私信息去除</div>
  <h1>照片隐私信息去除</h1>
  <p class="subtitle">一键去除照片中的GPS位置、拍摄设备信息等隐私EXIF数据，防止照片分享时泄露个人位置和设备信息。</p>

  <div class="card">
    <h3><i class="bi bi-shield-lock" style="color:var(--primary);margin-right:.4rem"></i>上传照片</h3>
    <div class="drop-zone" id="dropZone">
      <i class="bi bi-cloud-arrow-up"></i>
      <p><strong>拖拽照片到这里</strong> 或 <strong>点击选择文件</strong></p>
      <p style="font-size:.8rem">支持 JPG / PNG / WebP，支持批量上传</p>
      <input type="file" id="fileInput" accept="image/jpeg,image/jpg,image/png,image/webp" multiple>
    </div>
    <div id="batchList" class="batch-list" style="display:none"></div>
  </div>

  <div class="card" id="exifCard" style="display:none">
    <h3><i class="bi bi-exclamation-triangle" style="color:var(--warning);margin-right:.4rem"></i>检测到的 EXIF 信息</h3>
    <div class="stat-bar" id="statBar"></div>
    <div id="exifTableWrap"></div>
  </div>

  <div class="card" id="previewCard" style="display:none">
    <h3><i class="bi bi-eye" style="color:var(--primary);margin-right:.4rem"></i>处理预览</h3>
    <div class="preview-row">
      <div class="preview-box">
        <div class="preview-label">原始图片（含隐私信息）</div>
        <img id="origPreview" src="" alt="原始">
      </div>
      <div class="preview-box">
        <div class="preview-label">处理后（已去除隐私信息）</div>
        <img id="cleanPreview" src="" alt="清理后">
      </div>
    </div>
  </div>

  <div class="card" id="actionsCard" style="display:none">
    <div class="actions-row">
      <button class="btn btn-primary" id="cleanBtn" onclick="processAll()">
        <i class="bi bi-shield-lock"></i> 去除所有隐私信息
      </button>
      <button class="btn btn-ghost" id="downloadBtn" onclick="downloadClean()" disabled>
        <i class="bi bi-download"></i> 下载已清理图片
      </button>
    </div>
  </div>
</div>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const batchList = document.getElementById('batchList');
const exifCard = document.getElementById('exifCard');
const previewCard = document.getElementById('previewCard');
const actionsCard = document.getElementById('actionsCard');
const cleanBtn = document.getElementById('cleanBtn');
const downloadBtn = document.getElementById('downloadBtn');

let currentFiles = [];
let processedBlobs = [];

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
fileInput.addEventListener('change', e => handleFiles(e.target.files));

function handleFiles(files) {
  currentFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
  if (!currentFiles.length) return;
  renderBatchList();
  exifCard.style.display = 'block';
  previewCard.style.display = 'none';
  actionsCard.style.display = 'none';
  readExif(currentFiles[0]);
}

function renderBatchList() {
  batchList.style.display = currentFiles.length > 1 ? 'flex' : 'none';
  batchList.innerHTML = '';
  currentFiles.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const item = document.createElement('div');
    item.className = 'batch-item';
    item.innerHTML = `
      <img src="${url}" alt="">
      <div class="info">
        <div class="name">${file.name}</div>
        <div class="status" id="status-${i}">等待分析...</div>
      </div>
      <div class="actions">
        <button class="btn btn-ghost" style="padding:.3rem .7rem;font-size:.78rem" onclick="selectFile(${i})">查看</button>
        <button class="btn btn-danger" style="padding:.3rem .7rem;font-size:.78rem" onclick="removeFile(${i})">移除</button>
      </div>
    `;
    batchList.appendChild(item);
  });
}

function selectFile(i) {
  readExif(currentFiles[i]);
}

function removeFile(i) {
  URL.revokeObjectURL(URL.createObjectURL(currentFiles[i]));
  currentFiles.splice(i, 1);
  if (currentFiles.length === 0) {
    batchList.style.display = 'none';
    exifCard.style.display = 'none';
    previewCard.style.display = 'none';
    actionsCard.style.display = 'none';
  } else {
    renderBatchList();
    readExif(currentFiles[0]);
  }
}

function readExif(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      document.getElementById('origPreview').src = e.target.result;
      EXIF.getData(img, function() {
        const allData = EXIF.getAllTags(this);
        displayExif(allData, file.name);
        updateCleanPreview(e.target.result, file.type);
      });
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function getExifFields(data) {
  const fields = [];
  const dangerous = ['GPSLatitude', 'GPSLongitude', 'GPSAltitude', 'GPSLatitudeRef', 'GPSLongitudeRef',
    'Make', 'Model', 'Software', 'HostComputer', 'LensMake', 'LensModel', 'DateTimeOriginal',
    'DateTimeDigitized', 'DateTime', 'Artist', 'Copyright', 'OwnerName', 'CameraOwnerName',
    'BodySerialNumber', 'LensSerialNumber', 'ImageUniqueID', 'UserComment', 'XMPToolkit'];

  if (data.GPSLatitude && data.GPSLongitude) {
    fields.push({ key: 'GPSLatitude', label: 'GPS 纬度', value: `${data.GPSLatitude}`, danger: true });
    fields.push({ key: 'GPSLongitude', label: 'GPS 经度', value: `${data.GPSLongitude}`, danger: true });
  }
  if (data.Make) fields.push({ key: 'Make', label: '设备厂商', value: data.Make, danger: true });
  if (data.Model) fields.push({ key: 'Model', label: '设备型号', value: data.Model, danger: true });
  if (data.Software) fields.push({ key: 'Software', label: '使用软件', value: data.Software, danger: true });
  if (data.DateTimeOriginal) fields.push({ key: 'DateTimeOriginal', label: '拍摄时间', value: data.DateTimeOriginal, danger: true });
  if (data.DateTimeDigitized) fields.push({ key: 'DateTimeDigitized', label: '数字化时间', value: data.DateTimeDigitized, danger: true });
  if (data.LensMake) fields.push({ key: 'LensMake', label: '镜头厂商', value: data.LensMake, danger: true });
  if (data.LensModel) fields.push({ key: 'LensModel', label: '镜头型号', value: data.LensModel, danger: true });
  if (data.Artist) fields.push({ key: 'Artist', label: '作者', value: data.Artist, danger: true });
  if (data.Copyright) fields.push({ key: 'Copyright', label: '版权', value: data.Copyright, danger: true });
  if (data.HostComputer) fields.push({ key: 'HostComputer', label: '主机', value: data.HostComputer, danger: true });
  if (data.BodySerialNumber) fields.push({ key: 'BodySerialNumber', label: '机身序列号', value: data.BodySerialNumber, danger: true });
  if (data.LensSerialNumber) fields.push({ key: 'LensSerialNumber', label: '镜头序列号', value: data.LensSerialNumber, danger: true });
  if (data.ImageUniqueID) fields.push({ key: 'ImageUniqueID', label: '图片唯一ID', value: data.ImageUniqueID, danger: true });
  if (data.UserComment) fields.push({ key: 'UserComment', label: '用户备注', value: data.UserComment, danger: true });
  if (data.GPSAltitude) fields.push({ key: 'GPSAltitude', label: 'GPS 海拔', value: `${data.GPSAltitude}`, danger: true });

  // Safe fields
  if (data.ImageWidth) fields.push({ key: 'ImageWidth', label: '图片宽度', value: `${data.ImageWidth} px`, danger: false });
  if (data.ImageHeight) fields.push({ key: 'ImageHeight', label: '图片高度', value: `${data.ImageHeight} px`, danger: false });
  if (data.Orientation) fields.push({ key: 'Orientation', label: '方向', value: `${data.Orientation}`, danger: false });
  if (data.ExposureTime) fields.push({ key: 'ExposureTime', label: '曝光时间', value: `${data.ExposureTime}`, danger: false });
  if (data.FNumber) fields.push({ key: 'FNumber', label: '光圈', value: `f/${data.FNumber}`, danger: false });
  if (data.ISOSpeedRatings) fields.push({ key: 'ISOSpeedRatings', label: 'ISO', value: `${data.ISOSpeedRatings}`, danger: false });
  if (data.FocalLength) fields.push({ key: 'FocalLength', label: '焦距', value: `${data.FocalLength} mm`, danger: false });

  return fields;
}

function displayExif(data, filename) {
  const statBar = document.getElementById('statBar');
  const wrap = document.getElementById('exifTableWrap');
  const hasGPS = data.GPSLatitude && data.GPSLongitude;
  const hasCamera = data.Make || data.Model;
  const dangerCount = getExifFields(data).filter(f => f.danger).length;

  statBar.innerHTML = `
    ${hasGPS ? `<div class="stat-item"><i class="bi bi-geo-alt-fill"></i><span class="badge badge-danger">⚠️ 包含GPS位置</span></div>` : ''}
    ${hasCamera ? `<div class="stat-item"><i class="bi bi-camera-fill"></i><span class="badge badge-warning">⚠️ 包含设备信息</span></div>` : ''}
    <div class="stat-item"><i class="bi bi-shield"></i><span class="badge badge-safe">检测到 ${dangerCount} 项敏感数据</span></div>
  `;

  const fields = getExifFields(data);

  if (fields.length === 0) {
    wrap.innerHTML = `<div class="no-exif"><i class="bi bi-check-circle"></i><p>未检测到 EXIF 数据，该图片已经是干净的 ✨</p></div>`;
    actionsCard.style.display = 'block';
    cleanBtn.disabled = true;
    return;
  }

  let html = `<table class="exif-table"><thead><tr><th>字段</th><th>内容</th><th>风险</th></tr></thead><tbody>`;
  fields.forEach(f => {
    const badge = f.danger
      ? `<span class="badge badge-danger">⚠️ 隐私信息</span>`
      : `<span class="badge badge-safe">安全</span>`;
    html += `<tr><td>${f.label}</td><td style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${f.value}">${f.value}</td><td>${badge}</td></tr>`;
  });
  html += `</tbody></table>`;
  wrap.innerHTML = html;
  actionsCard.style.display = 'block';
  cleanBtn.disabled = false;
  downloadBtn.disabled = true;
}

function updateCleanPreview(dataUrl, mimeType) {
  const img = new Image();
  img.onload = function() {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    // Canvas strips EXIF automatically
    const clean = canvas.toDataURL(mimeType === 'image/png' ? 'image/png' : 'image/jpeg', 0.95);
    document.getElementById('cleanPreview').src = clean;
    previewCard.style.display = 'block';
    processedBlobs = [dataURLtoBlob(clean)];
    downloadBtn.disabled = false;
    downloadBtn.dataset.blob = clean;
  };
  img.src = dataUrl;
}

function dataURLtoBlob(dataurl) {
  const arr = dataurl.split(',');
  const mime = arr[0].match(/:(.*?);/)[1];
  const bstr = atob(arr[1]);
  let n = bstr.length;
  const u8arr = new Uint8Array(n);
  while (n--) u8arr[n] = bstr.charCodeAt(n);
  return new Blob([u8arr], { type: mime });
}

async function processAll() {
  if (!currentFiles.length) return;
  cleanBtn.disabled = true;
  cleanBtn.textContent = '处理中...';

  const results = [];
  for (const file of currentFiles) {
    const blob = await stripExif(file);
    results.push({ name: file.name, blob });
  }

  processedBlobs = results.map(r => r.blob);

  if (results.length === 1) {
    const url = URL.createObjectURL(results[0].blob);
    document.getElementById('cleanPreview').src = url;
    downloadBtn.dataset.blob = url;
    downloadBtn.disabled = false;
  } else {
    // Batch: download as zip
    const { default: JSZip } = await import('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
    const zip = new JSZip();
    results.forEach(r => zip.file(r.name.replace(/\.[^.]+$/, '_clean$&'), r.blob));
    const zblob = await zip.generateAsync({ type: 'blob' });
    const zurl = URL.createObjectURL(zblob);
    const a = document.createElement('a');
    a.href = zurl;
    a.download = 'cleaned_photos.zip';
    a.click();
    URL.revokeObjectURL(zurl);
  }

  cleanBtn.textContent = '处理完成 ✅';
  cleanBtn.disabled = false;
  setTimeout(() => {
    cleanBtn.innerHTML = '<i class="bi bi-shield-lock"></i> 去除所有隐私信息';
  }, 3000);
}

function stripExif(file) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const fmt = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
      canvas.toBlob(blob => resolve(blob), fmt, 0.95);
    };
    img.src = URL.createObjectURL(file);
  });
}

function downloadClean() {
  if (!processedBlobs.length) return;
  if (processedBlobs.length === 1) {
    const url = URL.createObjectURL(processedBlobs[0]);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'cleaned_photo.jpg';
    a.click();
    URL.revokeObjectURL(url);
  }
}
</script>
</body>
</html>
