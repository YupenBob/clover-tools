<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M3U8解析下载 - CloverTools</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #c9a96e;
            --text: #e0e0e0;
            --muted: #8b949e;
            --border: #30363d;
            --green: #3fb950;
            --red: #f85149;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px;
        }
        .container { max-width: 720px; margin: 0 auto; }
        h1 {
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--muted);
            font-size: 0.875rem;
            margin-bottom: 24px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .card-title {
            font-size: 0.875rem;
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 600;
        }
        .input-row {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        input[type="text"] {
            flex: 1;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        input[type="text"]:focus { border-color: var(--accent); }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--accent);
            color: #000;
        }
        .btn-primary:hover { background: #e0c080; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #ff6b6b; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .file-upload {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s;
            margin-top: 8px;
        }
        .file-upload:hover { border-color: var(--accent); }
        .file-upload input { display: none; }
        .file-upload i { font-size: 2rem; color: var(--muted); margin-bottom: 8px; }
        .file-upload p { color: var(--muted); font-size: 0.875rem; }
        .file-upload .hint { font-size: 0.75rem; margin-top: 4px; }
        .info-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .info-box p { font-size: 0.8rem; color: var(--muted); margin: 4px 0; }
        .info-box span { color: var(--text); }
        .progress-wrap { margin: 16px 0; }
        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        .progress-bar {
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
        }
        .status {
            font-size: 0.875rem;
            padding: 12px;
            border-radius: 6px;
            margin-top: 12px;
            display: none;
        }
        .status.error { background: rgba(248,81,73,0.1); color: var(--red); display: block; }
        .status.success { background: rgba(63,185,80,0.1); color: var(--green); display: block; }
        .btn-row { display: flex; gap: 8px; margin-top: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1><i class="bi bi-play-circle"></i> M3U8解析下载</h1>
    <p class="subtitle">解析M3U8播放列表，合并TS分片为MP4，浏览器端完成</p>

    <div class="card">
        <div class="card-title">输入M3U8链接</div>
        <div class="input-row">
            <input type="text" id="m3u8Url" placeholder="https://example.com/live.m3u8">
            <button class="btn btn-primary" id="parseBtn" onclick="parseM3U8()">
                <i class="bi bi-search"></i> 解析
            </button>
        </div>
        <p style="font-size:0.75rem;color:var(--muted);text-align:center;">或</p>
        <label class="file-upload" id="fileDrop">
            <input type="file" accept=".m3u8,.M3U8" id="m3u8File">
            <i class="bi bi-cloud-upload"></i>
            <p>上传本地 .m3u8 文件</p>
            <span class="hint">支持 .m3u8 或 .M3U8 文件</span>
        </label>
    </div>

    <div id="streamInfo" class="card" style="display:none;">
        <div class="card-title">流信息</div>
        <div class="info-box">
            <p>分辨率：<span id="infoRes">-</span></p>
            <p>带宽：<span id="infoBandwidth">-</span></p>
            <p>编码：<span id="infoCodecs">-</span></p>
            <p>总片段：<span id="infoSegments">-</span></p>
            <p>总时长：<span id="infoDuration">-</span></p>
        </div>
        <div class="btn-row">
            <button class="btn btn-primary" id="downloadBtn" onclick="startDownload()">
                <i class="bi bi-download"></i> 下载MP4
            </button>
            <button class="btn btn-danger" id="stopBtn" onclick="stopDownload()" style="display:none;">
                <i class="bi bi-stop-circle"></i> 停止
            </button>
        </div>
        <div class="progress-wrap" id="progressWrap" style="display:none;">
            <div class="progress-label">
                <span id="progressText">准备下载...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
        <div class="status" id="statusBox"></div>
    </div>
</div>

<script>
let hls = null;
let segments = [];
let streamUrl = '';
let isDownloading = false;
let abortController = null;

document.getElementById('m3u8File').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        document.getElementById('m3u8Url').value = '';
        parseM3U8Content(ev.target.result, '');
    };
    reader.readAsText(file);
});

function parseM3U8(url) {
    const baseUrl = url.substring(0, url.lastIndexOf('/') + 1);
    fetch(url)
        .then(r => r.text())
        .then(text => parseM3U8Content(text, baseUrl))
        .catch(err => showStatus('error', '获取M3U8失败: ' + err.message));
}

function parseM3U8Content(text, baseUrl) {
    const lines = text.split('\n');
    segments = [];
    let targetDuration = 10;
    let resolution = '', bandwidth = '', codecs = '';
    let segCount = 0;
    let totalDuration = 0;
    let isVariantPlaylist = false;
    let variantStreams = [];

    for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
            const parts = line.split(',');
            const dur = parseFloat(parts[0].split(':')[1]);
            totalDuration += dur;
            if (i + 1 < lines.length) {
                const segUrl = lines[i + 1].trim();
                if (segUrl && !segUrl.startsWith('#')) {
                    const fullUrl = segUrl.startsWith('http') ? segUrl : baseUrl + segUrl;
                    segments.push({ url: fullUrl, duration: dur });
                    segCount++;
                }
            }
        } else if (line.startsWith('#EXT-X-TARGETDURATION:')) {
            targetDuration = parseInt(line.split(':')[1]);
        } else if (line.startsWith('#EXT-X-STREAM-INF:')) {
            isVariantPlaylist = true;
            if (line.includes('RESOLUTION=')) {
                const m = line.match(/RESOLUTION=(\d+x\d+)/);
                if (m) resolution = m[1];
            }
            if (line.includes('BANDWIDTH=')) {
                const m = line.match(/BANDWIDTH=(\d+)/);
                if (m) bandwidth = (parseInt(m[1]) / 1000).toFixed(0) + ' kbps';
            }
            if (line.includes('CODECS=')) {
                const m = line.match(/CODECS="([^"]+)"/);
                if (m) codecs = m[1];
            }
            // Next non-comment line is URL
            for (let j = i + 1; j < lines.length; j++) {
                const ul = lines[j].trim();
                if (ul && !ul.startsWith('#')) {
                    variantStreams.push({
                        url: ul.startsWith('http') ? ul : baseUrl + ul,
                        resolution, bandwidth, codecs
                    });
                    break;
                }
            }
        }
    }

    if (isVariantPlaylist && variantStreams.length > 0) {
        // Pick highest quality stream
        let best = variantStreams[0];
        for (const v of variantStreams) {
            if (v.resolution > best.resolution) best = v;
        }
        showStatus('success', '检测到多码率列表，已自动选择最高画质');
        parseM3U8(best.url);
        return;
    }

    if (segments.length === 0) {
        showStatus('error', '未找到有效的TS分片，请检查M3U8格式');
        return;
    }

    document.getElementById('streamInfo').style.display = 'block';
    document.getElementById('infoRes').textContent = resolution || '未指定';
    document.getElementById('infoBandwidth').textContent = bandwidth || '未指定';
    document.getElementById('infoCodecs').textContent = codecs || '未指定';
    document.getElementById('infoSegments').textContent = segCount + ' 个片段';
    document.getElementById('infoDuration').textContent = formatTime(totalDuration);
    document.getElementById('streamInfo').scrollIntoView({ behavior: 'smooth' });
}

function formatTime(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    return h > 0 ? `${h}小时${m}分${s}秒` : `${m}分${s}秒`;
}

function showStatus(type, msg) {
    const box = document.getElementById('statusBox');
    box.className = 'status ' + type;
    box.textContent = msg;
    box.style.display = 'block';
}

async function startDownload() {
    if (segments.length === 0) return;
    isDownloading = true;
    abortController = new AbortController();
    document.getElementById('downloadBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'inline-block';
    document.getElementById('progressWrap').style.display = 'block';
    showStatus('', '');

    const total = segments.length;
    const blobs = [];
    let downloaded = 0;
    let failed = 0;

    for (let i = 0; i < total; i++) {
        if (!isDownloading) break;
        const seg = segments[i];
        try {
            const resp = await fetch(seg.url, { signal: abortController.signal });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const blob = await resp.blob();
            blobs.push(blob);
            downloaded++;
        } catch (e) {
            if (e.name === 'AbortError') {
                showStatus('error', '下载已停止');
                resetButtons();
                return;
            }
            failed++;
            console.warn('Segment', i, 'failed:', e.message);
            // Continue with next segment
        }
        const pct = Math.round((i + 1) / total * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressPercent').textContent = pct + '%';
        document.getElementById('progressText').textContent =
            `已下载 ${downloaded}/${total} 个片段${failed > 0 ? ' (' + failed + '个失败)' : ''}`;
    }

    if (downloaded === 0) {
        showStatus('error', '所有片段下载失败，请检查网络或M3U8链接有效性');
        resetButtons();
        return;
    }

    // Merge blobs
    showStatus('success', `下载完成，正在合并${downloaded}个片段...`);
    document.getElementById('progressText').textContent = '正在合并文件...';

    const mime = 'video/mp2t';
    const merged = new Blob(blobs, { type: mime });
    const url = URL.createObjectURL(merged);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'video_' + Date.now() + '.mp4';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);

    document.getElementById('progressText').textContent =
        `完成！成功${downloaded}个${failed > 0 ? '，失败' + failed + '个' : ''}`;
    showStatus('success', '下载完成！文件已保存。');
    resetButtons();
}

function stopDownload() {
    isDownloading = false;
    if (abortController) abortController.abort();
}

function resetButtons() {
    document.getElementById('downloadBtn').style.display = 'inline-block';
    document.getElementById('stopBtn').style.display = 'none';
    isDownloading = false;
}

function parseM3U8() {
    const url = document.getElementById('m3u8Url').value.trim();
    if (!url) {
        showStatus('error', '请输入M3U8链接或上传文件');
        return;
    }
    if (!url.toLowerCase().includes('.m3u8')) {
        showStatus('error', '链接看起来不像M3U8，请确认');
        return;
    }
    document.getElementById('streamInfo').style.display = 'none';
    parseM3U8(url);
}
</script>
</body>
</html>
